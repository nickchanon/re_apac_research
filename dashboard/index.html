<script>window.__APAC_DATA__=[{"publish_date":"2026-05-27","firm":"CBRE","title":"Japan 2026 Logistics Occupier Survey","summary":"CBRE's 2026 Logistics Occupier Survey, conducted in March 2026, finds that Japanese logistics occupiers are increasingly focused on attracting and retaining staff and improving operational efficiency. A mandatory Chief Logistics Officer (CLO) appointment requirement under the revised Act on Advancement of Integration and Streamlining of Distribution Business, effective April 2026, is expected to accelerate efficiency measures. Appetite for relocation and expansion remains robust, with some occupiers renewing contracts multiple times at the same facility.","sector":"Industrial & Logistics","market":"Tokyo","prime_yield":null,"prime_rent":null,"url":"https://www.cbre.co.jp/en/insights/reports/japan-2026-logistics-occupier-survey","publishDate":"2026-04-01","primeYield":null,"primeRent":null,"id":1},{"publish_date":"2026-05-21","firm":"CBRE","title":"2026 Asia Pacific Data Centre Trends & Outlook","summary":"The Asia Pacific data centre market continues to experience an unprecedented boom, with demand expanding rapidly on the back of AI implementation, cloud adoption, and digitalisation. Global hyperscale demand is growing at a CAGR of 14%, and tech firms plan to increase CapEx on AI by 61% in 2026. Direct investment volume reached a record high of US$11.6 billion in 2025, with neocloud providers emerging as a new demand driver; power availability and elevated construction costs remain the two most pressing challenges to expansion.","sector":"Data Centre","market":"APAC","prime_yield":null,"prime_rent":null,"url":"https://www.cbre.com/insights/reports/2026-asia-pacific-data-centre-trends-and-outlook","publishDate":"2026-04-01","primeYield":null,"primeRent":null,"id":2},{"publish_date":"2026-05-21","firm":"CBRE","title":"Hong Kong Residential Insights May 2026","summary":"Hong Kong's residential property market recorded a significant broad-based rebound in April 2026, with total home sales value jumping 50.9% YoY to HK$63.7 billion and transaction volume rising 29.4% YoY to 7,368 units. The luxury segment surged with 87 units priced above HK$100 million transacted as of mid-April, representing approximately 135% YoY growth. CBRE projects full-year 2026 residential prices to rise approximately 8% to 10%, supported by easing supply pressures and developer confidence.","sector":"Residential","market":"Hong Kong","prime_yield":null,"prime_rent":null,"url":"https://www.cbre.com.hk/insights/articles/hong-kong-residential-market-report-may-2026","publishDate":"2026-05-01","primeYield":null,"primeRent":null,"id":3},{"publish_date":"2026-05-18","firm":"CBRE","title":"Japan Viewpoint: Shifting Domestic Consumption Patterns to Boost Demand for High Street Stores","summary":"This viewpoint examines how shifting domestic consumption patterns in Japan are expected to generate stronger demand for high street retail space. CBRE notes that supply-demand conditions remain extremely tight, with several of the nine surveyed high street areas posting vacancy rates of 0%. Rents have exceeded pre-pandemic peaks in seven of the nine surveyed areas, and CBRE projects Ginza high street rents to reach JPY 299,500 per tsubo by end-2027.","sector":"Retail","market":"Tokyo","prime_yield":null,"prime_rent":"Ginza high street rent projected to reach JPY 299,500/tsubo by end-2027","url":"https://www.cbre.co.jp/en/insights/articles/japan-viewpoint-shifting-domestic-consumption-patterns-to-boost-demand-for-high-street-stores","publishDate":"2026-04-01","primeYield":null,"primeRent":null,"id":4},{"publish_date":"2026-05-13","firm":"CBRE","title":"2025 Tokyo Flexible Office Market","summary":"The Tokyo flexible office market grew moderately by 5.0% YoY in 2025, with flexible space accounting for 3.3% of the total Tokyo office market. Operators are increasingly selecting high-grade buildings with strong amenities to support talent attraction and flexible work styles, with the share of new openings in Tokyo's five central wards increasing. Companies using flexible office space have been more successful in talent recruitment, and firms planning to increase usage significantly outnumber those planning to reduce it.","sector":"Office","market":"Tokyo","prime_yield":null,"prime_rent":null,"url":"https://www.cbre.co.jp/en/insights/reports/2025-tokyo-flexible-office-market","publishDate":"2026-04-01","primeYield":null,"primeRent":null,"id":5},{"publish_date":"2026-05-11","firm":"CBRE","title":"Japan Investment MarketView Q1 2026","summary":"Commercial real estate investment volume in Japan increased 2% YoY to a record first-quarter high of JPY 2.043 trillion in Q1 2026, with overseas investors completing a large-scale acquisition exceeding JPY 100 billion. The residential, logistics, and hotel sectors each recorded double-digit YoY volume growth, while hotel investment reached a record quarterly high. Expected NOI yields for Tokyo prime office assets in Otemachi rose 2 bps QoQ to 3.15%.","sector":"Investment","market":"Tokyo","prime_yield":"Tokyo prime office (Otemachi) expected NOI yield: 3.15%","prime_rent":null,"url":"https://www.cbre.com/insights/figures/japan-investment-marketview-q1-2026","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":6},{"publish_date":"2026-05-11","firm":"CBRE","title":"Japan Retail MarketView Q1 2026","summary":"Average rents set new all-time highs in five of the ten surveyed high street areas in Q1 2026 \u2014 Ginza, Omotesando/Harajuku, Shibuya, Shinsaibashi, and Kyoto \u2014 driven by fashion sector demand and new brand store openings. Vacancy in both Ginza and Shibuya remained at 0.0%, reflecting extremely tight supply conditions. Multiple retailers competing for single available units has become increasingly common, and CBRE expects average rents to continue on an upward trend.","sector":"Retail","market":"Tokyo","prime_yield":null,"prime_rent":"Ginza and Shibuya vacancy at 0.0%; rents at new all-time highs in these markets","url":"https://www.cbre.co.jp/en/insights/figures/japan-retail-marketview-q1-2026","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":7},{"publish_date":"2026-05-08","firm":"CBRE","title":"Asia Pacific Figures Q1 2026","summary":"Asia Pacific commercial real estate investment volume fell 9% QoQ to US$46.2 billion in Q1 2026, pulling back from the prior quarter's record high, but was up 18% YoY on an annual basis. Asia-wide Grade A office net absorption totalled 17.3 million sq. ft. NFA, up 7.8% QoQ and broadly on track with 2025 levels, with occupier sentiment remaining resilient despite the onset of the Middle East conflict. Logistics leasing momentum slowed in Q1 2026 after a relatively robust previous quarter.","sector":"Mixed/Cross-Sector","market":"APAC","prime_yield":null,"prime_rent":null,"url":"https://www.cbre.com/insights/figures/asia-pacific-figures-q1-2026","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":8},{"publish_date":"2026-05-29","firm":"CBRE","title":"The Leasing Gauge 2026","summary":"CBRE's Leasing Gauge 2026 report for Australia examines commercial real estate leasing conditions across key property sectors, noting that supply constraints are intensifying across markets and rent growth is tracking above expectations. The report highlights that economic rents continue to sit 20-30% above market rents as construction costs remain elevated, favouring a buy-over-build strategy. Both office and retail sectors are showing stronger leasing fundamentals than anticipated at the start of the year.","sector":"Mixed/Cross-Sector","market":"Australia","prime_yield":null,"prime_rent":null,"url":"https://www.cbre.com.au/insights/reports/the-leasing-gauge-2026","publishDate":"2026-04-01","primeYield":null,"primeRent":null,"id":9},{"publish_date":"2026-05-26","firm":"CBRE","title":"Retail Built to Endure: The Resilience of Australian Shopping Centres","summary":"Australian shopping centres are delivering income stability in uncertain markets, benefiting from strong population growth, limited new supply, and improved tenant economics that position retail as a defensive asset class with resilient income-led returns. Shopping centre rents are forecast to rise in the mid-single digit range in 2026, with Perth outperforming and vacancy rates remaining below 5% across most submarkets. Development costs and land prices are constraining new supply pipelines, further underpinning the outlook for existing assets.","sector":"Retail","market":"Australia","prime_yield":null,"prime_rent":"Shopping centre rents forecast to rise mid-single digits in 2026; Sydney and Perth pacing at +7% YoY","url":"https://www.cbre.com.au/insights/articles/retail-built-to-endure-the-resilience-of-australian-shopping-centres","publishDate":"2026-04-01","primeYield":null,"primeRent":null,"id":10},{"publish_date":"2026-04-27","firm":"CBRE","title":"Japan Logistics MarketView Q1 2026","summary":"The Greater Tokyo logistics vacancy rate decreased 0.6 pp QoQ to 9.2% in Q1 2026, with net absorption significantly surpassing the five-year quarterly average on strong demand for existing properties; effective rents rose 0.9% QoQ to JPY 4,530. Greater Osaka saw the vacancy rate fall sharply by 1.5 pp to 2.2%, with three new properties completing at full occupancy and effective rents rising 1.2% QoQ to JPY 4,350. Greater Nagoya vacancy increased to 16.8%, though effective rents still rose marginally to JPY 3,740.","sector":"Industrial & Logistics","market":"Tokyo","prime_yield":null,"prime_rent":"Greater Tokyo effective logistics rent: JPY 4,530/tsubo (+0.9% QoQ); Greater Osaka: JPY 4,350/tsubo (+1.2% QoQ); Greater Nagoya: JPY 3,740/tsubo","url":"https://www.cbre.co.jp/en/insights/figures/japan-logistics-marketview-q1-2026","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":11},{"publish_date":"2026-04-24","firm":"CBRE","title":"Japan Office MarketView Q1 2026","summary":"Tokyo's All-Grade office vacancy rate fell 0.1 pp QoQ to 1.5% in Q1 2026, with net absorption of 114,000 tsubo surpassing the new supply of 103,000 tsubo; Grade A and Grade A- rents both recorded their second-highest QoQ growth rates on record. In Osaka, the All-Grade vacancy rate declined to 2.0%, with Grade B rents surging 3.9% QoQ to JPY 16,150 \u2014 surpassing the previous peak set in Q1 2008. All-Grade rents rose in nine of the ten surveyed regional cities, with Sapporo, Saitama, Hiroshima, and Fukuoka continuing to set record highs.","sector":"Office","market":"Tokyo","prime_yield":null,"prime_rent":"Tokyo Grade A rents: +5.4% QoQ (second-highest growth on record); Osaka Grade B rents: JPY 16,150 (new record high)","url":"https://www.cbre.com/insights/figures/japan-office-marketview-q1-2026","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":12},{"publish_date":"2026-04-23","firm":"CBRE","title":"Australia Retail Figures Q1 2026","summary":"Net face rents grew across all retail sectors in Australia in Q1 2026, with CBD secondary and super prime assets recording the highest growth of 2.3% and 2.2% QoQ respectively. Shopping centre and large format yields continued to compress, with large format centres compressing 4 bps QoQ, while there were 32 retail transactions exceeding A$5 million totalling c.A$1.67 billion. Consumer sentiment declined significantly, with the Westpac-Melbourne Institute Index falling 12.5% to 80.1 in April amid global uncertainty.","sector":"Retail","market":"Australia","prime_yield":"Regional centres compressing 1 bp QoQ; sub-regional 2 bps; large format 4 bps; CBD super prime expanded 5 bps QoQ","prime_rent":"CBD super prime rents: +2.2% QoQ; CBD secondary: +2.3% QoQ","url":"https://www.cbre.com.au/insights/figures/australia-retail-figures-q1-2026","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":13},{"publish_date":"2026-04-22","firm":"CBRE","title":"Hong Kong Viewpoint: Recovery Time \u2013 How Financial Sector Demand is Reviving Hong Kong's Grade A Office Market","summary":"Strong capital market performance, increasing wealth inflows, and supportive government policies are reinforcing Hong Kong's status as a leading global financial hub and underpinning a rebound in office leasing demand, predominantly in the Central CBD. Financial sector demand \u2014 particularly from wealth management, insurance, and non-bank financial firms \u2014 is driving a sustained recovery in Central Grade A office rents and absorbing vacancy. CBRE identifies the financial sector as the key structural driver of Hong Kong's office market revival in 2026.","sector":"Office","market":"Hong Kong","prime_yield":null,"prime_rent":null,"url":"https://www.cbre.com.hk/insights/articles/hong-kong-viewpoint-recovery-time-how-financial-sector-demand-is-reviving-hong-kongs-grade-a-office-market","publishDate":"2026-04-01","primeYield":null,"primeRent":null,"id":14},{"publish_date":"2026-04-17","firm":"CBRE","title":"Asia Pacific Office Trends Q1 2026","summary":"Asia Pacific office leasing was broadly unaffected by the onset of the Middle East conflict in Q1 2026, though several Southeast Asian markets implemented work-from-home policies to reduce energy and fuel demand. Singapore's office market carried its positive momentum into 2026, underpinned by strong occupier demand and record-low vacancy, with the banking and financial sector \u2014 led by wealth management, hedge funds, and quant trading firms \u2014 remaining the key demand driver. Tokyo's office market remains exceptionally tight due to robust domestic demand, with more landlords incorporating CPI-linked clauses in lease contracts for annual rental adjustments.","sector":"Office","market":"APAC","prime_yield":null,"prime_rent":null,"url":"https://www.cbre.com/insights/figures/asia-pacific-office-trends-q1-2026","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":15},{"publish_date":"2026-04-17","firm":"CBRE","title":"Asia Pacific Industrial & Logistics Trends Q1 2026","summary":"Recent oil price volatility has emerged as a key risk for the Asia Pacific industrial and logistics market, with higher transport costs and supply chain disruption weighing on occupier demand, though traditional 3PL operators continued to underpin leasing activity in Q1 2026. In Australia, 3PL operators are consolidating from older second-generation facilities into new super prime assets, while renewals drive the bulk of leasing activity due to tight availability and elevated fit-out costs. Japan's Greater Tokyo logistics market continues to recover from previous supply spikes with overall vacancy trending downward, while Greater Osaka saw robust leasing supported by domestic consumption.","sector":"Industrial & Logistics","market":"APAC","prime_yield":null,"prime_rent":null,"url":"https://www.cbre.com/insights/figures/asia-pacific-industrial-logistics-trends-q1-2026","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":16},{"publish_date":"2026-04-16","firm":"CBRE","title":"Talking Property \u2013 The House View Q2 2026","summary":"CBRE Australia's Head of Research Sameer Chopra and Phil Rowland discuss the rapidly shifting economic and geopolitical landscape, noting that office prime effective rents grew 8% YoY in Brisbane and Sydney \u2014 far ahead of year-start expectations \u2014 and industrial net effective rents declined approximately 2.5% in Sydney and Melbourne due to elevated incentives amid new supply. CBRE now expects transaction volumes to grow approximately 5% in 2026 (revised down from 10%), with cap rate expansion of 10-15 bps in office, 25-35 bps in industrial, and 10-15 bps in shopping centres. Supply constraints are intensifying across all sectors as construction cost forecasts have risen materially.","sector":"Mixed/Cross-Sector","market":"Australia","prime_yield":"Office cap rate expansion: 10-15 bps; industrial: 25-35 bps; shopping centres: 10-15 bps in 2026","prime_rent":"Office: Sydney +8% YoY, Brisbane +8% YoY, Perth +5%, Melbourne +3%; Retail: Sydney/Perth regional centres +7% YoY; Industrial: Sydney/Melbourne net effective rents -2.5%","url":"https://www.cbre.com.au/insights/talking-property-with-cbre/the-house-view-q2-2026","publishDate":"2026-04-01","primeYield":null,"primeRent":null,"id":17},{"publish_date":"2026-04-15","firm":"CBRE","title":"Seoul Figures Q1 2026","summary":"Average Grade A office vacancy across Seoul's three major business districts declined to 2.8% in Q1 2026, stabilising the market, though new leasing volume fell both QoQ and YoY amid a wait-and-see stance ahead of anticipated Q2 CBD completions. Logistics supply in 2026 is forecast at a decade low, driving vacancy to continue declining from its 2024 peak with dry storage vacancy falling below 10%, while 3PL and e-commerce tenants accounted for 65% of new take-up. Overall Seoul investment volume declined 17% YoY, though strategic investor-led office acquisitions and selective prime logistics transactions continued.","sector":"Mixed/Cross-Sector","market":"Seoul","prime_yield":null,"prime_rent":null,"url":"https://www.cbrekorea.com/en/insights/figures/seoul-figures-q1-2026","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":18},{"publish_date":"2026-04-15","firm":"CBRE","title":"Brisbane CBD Office Figures Q1 2026","summary":"Brisbane CBD prime gross face rents grew 3.7% QoQ and 9.2% YoY in Q1 2026, among the strongest performances in Australia, with incentives declining 50 bps to average 38.9%. Prime CBD yields tightened slightly by 2 bps to 7.02%, reflecting late 2025 transaction activity. Market sentiment is noticeably improved year-on-year, with more tenants engaging with the market, though rising bond rates and the cash rate are creating some near-term investment uncertainty.","sector":"Office","market":"Australia","prime_yield":"Brisbane prime CBD office yield: 7.02% (tightened 2 bps QoQ)","prime_rent":"Brisbane CBD prime gross face rent: +3.7% QoQ, +9.2% YoY in Q1 2026","url":"https://www.cbre.com.au/insights/figures/brisbane-cbd-office-figures-q1-2026","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":19},{"publish_date":"2026-04-14","firm":"CBRE","title":"Australia CBD Office Figures Q1 2026","summary":"Australian CBD prime effective rents climbed 1.8% QoQ and 6.6% YoY in Q1 2026, the highest annual growth since early 2019, driven by the lowest new supply pipeline in over 30 years and improving leasing sentiment. Prime yields were stable at an average of 6.67% across Australian CBDs, with transaction activity reaching A$3.5 billion \u2014 a solid start to the year despite global headwinds from the Middle East conflict. No new office space was delivered to the Sydney CBD in 2026, and development is set to slow substantially going forward.","sector":"Office","market":"Australia","prime_yield":"Australian CBD prime office yield: 6.67% average (stable in Q1 2026)","prime_rent":"Australian CBD prime effective rents: +1.8% QoQ, +6.6% YoY in Q1 2026","url":"https://www.cbre.com.au/insights/figures/australia-cbd-office-figures-q1-2026","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":20},{"publish_date":"2026-04-14","firm":"CBRE","title":"Sydney CBD Office Figures Q1 2026","summary":"CBRE received 141 leasing enquiries totalling 125,230 sqm in the Sydney CBD in Q1 2026, a 22% improvement vs Q1 2025 and a 122.7% improvement vs Q4 2025, reflecting notably stronger leasing sentiment. No new office space will be delivered to the Sydney CBD in 2026, and all four major precincts \u2014 Core, Midtown, Walsh Bay, and Western Corridor \u2014 recorded strong prime net effective rent growth. Investment volumes reached A$1.1 billion in the Sydney CBD in Q1 2026, with cap rates held stable despite global headwinds.","sector":"Office","market":"Australia","prime_yield":null,"prime_rent":"Sydney CBD overall vacancy: 13.8% at H2 2025; all precincts recording strong prime net effective rent growth","url":"https://www.cbre.com.au/insights/figures/sydney-cbd-office-figures-q1-2026","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":21},{"publish_date":"2026-04-14","firm":"CBRE","title":"Hong Kong Figures \u2013 Office Q1 2026","summary":"Hong Kong Grade A office rents increased 1.6% QoQ in Q1 2026 \u2014 the strongest growth since Q3 2018 \u2014 driven primarily by Central (+5.9% QoQ) and Greater Tsim Sha Tsui (+0.9% QoQ), with Grade A1 buildings in Central recording their strongest gains since Q3 2010 at +12.1% QoQ. No new supply was delivered this quarter, and with positive net absorption of 375,400 sq. ft. (a fourth consecutive positive quarter), overall vacancy fell 0.4 pp to 16.8%, the biggest single-quarter decline since Q2 2015. Over the past four quarters, cumulative net absorption has totalled 2.7 million sq. ft.","sector":"Office","market":"Hong Kong","prime_yield":null,"prime_rent":"Hong Kong overall Grade A office rents: +1.6% QoQ; Central: +5.9% QoQ; Grade A1 Central: +12.1% QoQ","url":"https://www.cbre.com.hk/insights/figures/hong-kong-figures-office-q1-2026","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":22},{"publish_date":"2026-04-14","firm":"CBRE","title":"Hong Kong Figures \u2013 Retail Q1 2026","summary":"Leasing volume in Hong Kong's core retail districts totalled 213,800 sq. ft. in Q1 2026, declining QoQ due to seasonal factors but rising YoY; fashion brands were the second most active trade at 22% of volume, their highest share since Q4 2016. Low vacancy in prime areas pushed high street shop rents up 0.9% QoQ \u2014 the fifteenth consecutive quarterly increase \u2014 with vacancy for core retail districts rising slightly to 6.8%, still near its lowest since early 2024. Mainland Chinese tea and coffee shops continued to expand across the market.","sector":"Retail","market":"Hong Kong","prime_yield":null,"prime_rent":"Hong Kong high street rents: +0.9% QoQ (15th consecutive quarterly increase); core district vacancy: 6.8%","url":"https://www.cbre.com.hk/insights/figures/hong-kong-figures-retail-q1-2026","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":23},{"publish_date":"2026-04-14","firm":"CBRE","title":"Hong Kong Figures \u2013 Industrial Q1 2026","summary":"Industrial leasing in Hong Kong remained sluggish in Q1 2026, with total leasing volume of 682,800 sq. ft. representing a 35% QoQ decline, though still up 17% YoY from a low base. Despite positive net absorption of 135,800 sq. ft. \u2014 ending four consecutive quarters of net withdrawal \u2014 overall warehouse rents fell a further 1.2% QoQ as landlords cut rates to improve occupancy, marking the ninth consecutive quarterly rental decline. Overall warehouse vacancy narrowed slightly by 0.3 pp to 12.8%.","sector":"Industrial & Logistics","market":"Hong Kong","prime_yield":null,"prime_rent":"Hong Kong warehouse rents: -1.2% QoQ (9th consecutive quarterly decline); vacancy: 12.8%","url":"https://www.cbre.com.hk/insights/figures/hong-kong-figures-industrial-q1-2026","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":24},{"publish_date":"2026-04-14","firm":"CBRE","title":"Hong Kong Figures \u2013 Investment Q1 2026","summary":"Commercial real estate investment volume in Hong Kong surged 105% YoY to HK$12.3 billion in Q1 2026, slightly above the 2025 quarterly average of HK$11.5 billion, despite a 43% QoQ decline from the prior quarter's exceptional high. End-users were the dominant buyers at 43% of total volume, with 14 of the 29 transactions involving financially stressed assets totalling HK$8.7 billion. Hotel investment gained traction as institutional investors targeted student hostel conversions.","sector":"Investment","market":"Hong Kong","prime_yield":null,"prime_rent":null,"url":"https://www.cbre.com.hk/insights/figures/hong-kong-figures-investment-q1-2026","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":25},{"publish_date":"2026-04-13","firm":"CBRE","title":"Australia Industrial and Logistics Figures Q1 2026","summary":"Gross take-up in Australia's industrial and logistics market moderated to approximately 680,000 sqm in Q1 2026, with approximately 700,000 sqm delivered as the development pipeline remains elevated. National super prime midpoint yields expanded marginally to 5.7%, reflecting higher interest rates and elevated bond yields, while effective rents returned to growth as face rental growth began to offset elevated incentives. Close to 40% of the 2026-2027 supply pipeline is pre-committed, with investment sales for income-producing assets totalling close to A$1 billion.","sector":"Industrial & Logistics","market":"Australia","prime_yield":"National super prime industrial midpoint yield: 5.7% (expanded marginally in Q1 2026)","prime_rent":"Effective rents returned to growth in Q1 2026; Sydney super prime net face rent: +1.8% YoY","url":"https://www.cbre.com.au/insights/figures/australia-industrial-and-logistics-figures-q1-2026","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":26},{"publish_date":"2026-04-13","firm":"CBRE","title":"Updated Pacific Market Outlook \u2013 April 2026 Edition","summary":"CBRE Australia updated its January 2026 Pacific Market Outlook to reflect materially higher bond yields and construction cost forecasts, with cap rate expectations revised higher by 25-35 bps for super prime industrial, approximately 25 bps for prime office, and 20-25 bps for regional malls. Transaction volume growth expectations for 2026 were reduced, with total returns shifting away from cap rate compression towards rent growth. Construction costs are forecast to grow 18% between 2026 and 2027, further constraining future supply pipelines.","sector":"Mixed/Cross-Sector","market":"Australia","prime_yield":"Super prime industrial cap rate expectations +25-35 bps; prime office +25 bps; regional malls +20-25 bps vs Jan 2026 forecast","prime_rent":null,"url":"https://www.cbre.com/insights/reports/updated-pacific-market-outlook-april-2026-edition","publishDate":"2026-04-01","primeYield":null,"primeRent":null,"id":27},{"publish_date":"2026-04-10","firm":"CBRE","title":"Singapore Figures Q1 2026","summary":"Singapore's Core CBD Grade A office vacancy compressed to a record low of 3.3% in Q1 2026, down from 4.5% in Q4 2025, underpinned by strong occupier demand led by the banking and financial sector. Prime logistics rents were flat after 1.1% QoQ growth last quarter, while islandwide prime retail rents rose 0.5% QoQ with growth recorded across all submarkets. Real estate investment volumes surged to a record quarterly high of S$19.89 billion, nearly tripling YoY on several large-ticket portfolio deals and a REIT IPO.","sector":"Mixed/Cross-Sector","market":"Singapore","prime_yield":null,"prime_rent":"Singapore Core CBD Grade A office vacancy: 3.3% (record low); prime retail rents: +0.5% QoQ; prime logistics rents: flat in Q1 2026","url":"https://www.cbre.com.sg/insights/figures/singapore-figures-q1-2026","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":28},{"publish_date":"2026-05-05","firm":"JLL","title":"Global Real Estate Perspective, May 2026","summary":"JLL's monthly global CRE overview covering investment, office, logistics, retail, hotels and living sectors. Global direct transaction volumes reached USD 216 billion in Q1 2026, up 18% year-over-year, with Asia Pacific recording the strongest growth at +31% YoY led by Japan and Singapore (which posted its highest quarterly investment volume on record). The report highlights resilient occupier demand, flight-to-quality trends in office markets, and strong RevPAR growth in APAC hotels.","sector":"Mixed/Cross-Sector","market":"APAC","prime_yield":null,"prime_rent":null,"url":"https://www.jll.com/en-us/insights/market-perspectives/global","publishDate":"2026-05-01","primeYield":null,"primeRent":null,"id":29},{"publish_date":"2026-05-19","firm":"JLL","title":"Asia Pacific commercial real estate investment surges to record USD 47.0 billion in Q1 2026","summary":"JLL's press release and data report covering APAC capital markets in Q1 2026. Total CRE investment reached USD 47.0 billion, a 31% YoY increase and the region's strongest first-quarter performance on record. Japan led at USD 13.2 billion, Singapore surged 433% to USD 11.5 billion (driven by mega-fund asset transfers), Australia recorded USD 5.7 billion (+49% YoY), Hong Kong rose 41% to USD 1.6 billion, and South Korea reached USD 4.8 billion. Cross-border capital flows hit an all-time quarterly high of USD 16.3 billion, up 87% YoY.","sector":"Investment","market":"APAC","prime_yield":"Hong Kong distressed retail initial yields compressed from ~9.4% (Q4 2025) to ~6.4% (Q1 2026)","prime_rent":null,"url":"https://www.jll.com/en-hk/newsroom/asia-pacific-commercial-real-estate-investment-surges-to-record-usd-47-billion-in-q1-2026","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":30},{"publish_date":"2026-05-13","firm":"JLL","title":"Asia Pacific Capital Tracker Spring 2026: The 'HALO' Effect \u2013 Heavy Assets, Low Obsolescence","summary":"JLL's flagship APAC capital markets research report for Spring 2026. The report documents the strongest Q1 on record for APAC CRE investment at USD 47.0 billion (+31% YoY), with Japan at USD 13.2 billion, Singapore at USD 11.5 billion, Australia at USD 5.7 billion, Hong Kong at USD 1.6 billion, and South Korea at USD 4.8 billion. Key themes include the 'HALO' concept (Heavy Assets, Low Obsolescence), the emergence of owner-occupiers in office value-add acquisitions, intense competition for core logistics assets, and surging hospitality liquidity. Tokyo office and retail rents are rising fastest in the APAC region.","sector":"Investment","market":"APAC","prime_yield":null,"prime_rent":"Tokyo Grade A office rents up 22% YoY (near-zero vacancy); Tokyo retail rents up +8% YoY","url":"https://co.jll/4wcLXuc","publishDate":"2026-04-01","primeYield":null,"primeRent":null,"id":31},{"publish_date":"2026-05-20","firm":"JLL","title":"Asia Pacific Office Market Dynamics Q1 2026","summary":"JLL's regional office market update covering Q1 2026. The APAC office leasing environment remained firm, underpinned by sustained demand for high-quality, well-located space. Regional supply totalled 1.3 million sqm\u2014slightly below Q4 2025 levels but up YoY\u2014while vacancy edged down QoQ, reflecting resilient absorption. Investment activity reached USD 24 billion, up 46% YoY, making office the most active CRE sector by volume. Tokyo maintained a sub-1% Grade A vacancy rate with robust rent growth; Seoul's Gangnam and Yeouido saw tight availability driving deals above asking prices.","sector":"Office","market":"APAC","prime_yield":null,"prime_rent":"Tokyo Grade A vacancy: sub-1%; Tokyo Grade A average monthly gross rent: JPY 40,247/tsubo (+13.2% YoY)","url":"https://www.jll.com/en-au/insights/market-dynamics/asia-pacific-office","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":32},{"publish_date":"2026-05-20","firm":"JLL","title":"Office Market Insights Q1 2026","summary":"JLL's detailed APAC office market insights note published via the APAC research portal. Highlights Tokyo's sub-1% Grade A vacancy and robust rent growth, Central Hong Kong vacancy falling to its lowest since 2023, and Singapore attracting value-add strategies via institutional asset recycling. Sydney's CBD leasing activity was strong, fuelled by expansions and flight-to-quality, while Melbourne leasing remained largely confined to prime-grade assets. Seoul's Gangnam and Yeouido tight availability drove transactions above asking prices.","sector":"Office","market":"APAC","prime_yield":null,"prime_rent":"Tokyo Grade A vacancy: sub-1% (robust rent growth); Singapore CBD rent growth sub-1% q-o-q in Q1 2026; Seoul net effective rent: KRW 149,516/pyeong (+4.5% YoY)","url":"https://research.jllapsites.com/appd-article/office-market-insights-q1-2026/","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":33},{"publish_date":"2026-05-20","firm":"JLL","title":"Tokyo Office Market Dynamics Q1 2026","summary":"JLL's city-level report on Tokyo's Grade A office market. Net absorption reached 69,000 tsubo in Q1 2026, up from 38,000 tsubo in Q4 2025, driven by employees returning to the office and business expansion in manufacturing, IT, and professional services. The vacancy rate held steady at 0.7% (down 1.8 pp YoY). The average monthly gross rent rose 5.2% QoQ and 13.2% YoY to JPY 40,247 per tsubo, reflecting near-zero vacancy and strong demand.","sector":"Office","market":"Tokyo","prime_yield":null,"prime_rent":"Grade A average monthly gross rent: JPY 40,247/tsubo (+5.2% q-o-q, +13.2% y-o-y)","url":"https://research.jllapsites.com/appd-market-report/q1-2026-office-tokyo/","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":34},{"publish_date":"2026-05-20","firm":"JLL","title":"Seoul Office Market Dynamics Q1 2026","summary":"JLL's city-level report on Seoul's office market. Overall quarterly net take-up reached 7,502 pyeong in Q1 2026, driven by CBD move-ins including NH NongHyup Tower occupancy. The Seoul vacancy rate fell 39 bps QoQ to 4.3%, with the CBD vacancy down 159 bps to 6.9%. Net effective rents rose 1.1% QoQ and 4.5% YoY to KRW 149,516 per pyeong. Total office investment volume reached KRW 3.4 trillion, highlighted by the ~KRW 1.3 trillion acquisition of Seoul Square.","sector":"Office","market":"Seoul","prime_yield":"Grade A office cap rate: 4.1% (Q1 2026)","prime_rent":"Seoul net effective rent: KRW 149,516/pyeong (+1.1% q-o-q, +4.5% y-o-y); CBD net effective rent: +1.9% q-o-q","url":"https://research.jllapsites.com/appd-market-report/q1-2026-office-seoul/","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":35},{"publish_date":"2026-05-20","firm":"JLL","title":"Singapore Office Market Dynamics Q1 2026","summary":"JLL's city-level report on Singapore's CBD office market. Positive leasing momentum from 2025 carried into Q1 2026, with vacancy tightening more significantly for prime properties. There were no major office completions during the quarter. Office rent growth continued, though quarter-on-quarter gains fell back to the sub-1% region. The Marina Bay submarket led the drop in vacancy rates, and some spaces were re-let before the current occupants vacated, reflecting strong demand for premium space.","sector":"Office","market":"Singapore","prime_yield":null,"prime_rent":"CBD office rent growth: sub-1% q-o-q in Q1 2026; Core CBD vacancy tightened (Marina Bay leading decline)","url":"https://research.jllapsites.com/appd-market-report/q1-2026-office-singapore/","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":36},{"publish_date":"2026-05-18","firm":"JLL","title":"Hong Kong Office Market Dynamics Q1 2026","summary":"JLL's Q1 2026 analysis of Hong Kong's office market. Total net absorption reached 614,300 sqft but fell 59.7% QoQ from the elevated Q4 2025 base. The overall office vacancy rate stood at 13.5% at end-March; Central vacancy dropped 1.4 ppts QoQ to 9.6%\u2014single-digit for the first time since 2023, driven by financial sector demand. Overall office rent rose 1.5% QoQ, with Central leading at +3.8% QoQ. Grade A capital values dipped 0.4% QoQ. Rents are projected to decline moderately by 0\u20135% in full-year 2026.","sector":"Office","market":"Hong Kong","prime_yield":null,"prime_rent":"Overall Grade A office rent: +1.5% q-o-q in Q1 2026; Central rent: +3.8% q-o-q (Central vacancy: 9.6%)","url":"https://research.jllapsites.com/appd-market-report/q1-2026-office-hong-kong/","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":37},{"publish_date":"2026-05-07","firm":"JLL","title":"Sydney Office Market Dynamics Q1 2026","summary":"JLL's Q1 2026 city-level report on Sydney's office market. The Sydney office vacancy rate remained flat over the quarter. One completion was recorded across all Sydney markets totalling 4,500 sqm. Office transactions were concentrated in the metro markets, with strong CBD leasing activity fuelled by occupier expansions and a continued flight-to-quality trend. The market is underpinned by very limited new construction and low pipeline supply.","sector":"Office","market":"Australia","prime_yield":null,"prime_rent":null,"url":"https://www.jll.com/en-au/insights/market-dynamics/sydney-office","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":38},{"publish_date":"2026-05-06","firm":"JLL","title":"Melbourne Office Market Dynamics Q1 2026","summary":"JLL's Q1 2026 city-level report on Melbourne's office market. Net absorption was negative across the CBD, Fringe, and South East Suburban (S.E.S.) markets during the quarter. Headline vacancy remained elevated across all three markets. Leasing remained largely confined to prime-grade assets despite market-wide headwinds, reflecting the ongoing flight-to-quality trend across Australian office markets.","sector":"Office","market":"Australia","prime_yield":null,"prime_rent":null,"url":"https://www.jll.com/en-au/insights/market-dynamics/melbourne-office","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":39},{"publish_date":"2026-05-18","firm":"JLL","title":"Asia Pacific Industrial Market Dynamics Q1 2026","summary":"JLL's regional industrial and logistics market update for Q1 2026. Net absorption slowed QoQ to majority Tier-1 cities, with notable improvements in Beijing, Shanghai, Tokyo, and Sydney. Vacancy continued to decline regionally, driven by a fall in completions, signalling market recovery from a high-vacancy environment. Rental growth was observed in select Tier-1 markets including Seoul, Singapore, Tokyo, Sydney, and Melbourne, with investor interest expected to remain strong\u2014especially for core opportunities in Seoul, Tokyo, and Singapore.","sector":"Industrial & Logistics","market":"APAC","prime_yield":null,"prime_rent":"Tokyo prime area rents driven up by high demand and construction costs; Seoul and Singapore rents increased marginally; Sydney and Melbourne: rental growth recorded","url":"https://www.jll.com/en-au/insights/market-dynamics/asia-pacific-industrial","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":40},{"publish_date":"2026-05-20","firm":"JLL","title":"Industrial Market Insights Q1 2026","summary":"JLL's detailed APAC industrial market insights published via the research portal. Regional net absorption was 1.5 million sqm in Q1 2026 (fell 1.3 million sqm QoQ), with the majority (1.2 million sqm) occurring in Tier-1 cities. Total completions fell 1.2 million sqm QoQ to 3.6 million sqm. Regional vacancy declined 0.2 pp to 11.6%. Tokyo prime rents continued rising on high demand and construction costs; Seoul and Singapore rents increased marginally; Sydney and Melbourne recorded rental growth; Hong Kong saw no completions with net absorption negative for the ninth consecutive quarter.","sector":"Industrial & Logistics","market":"APAC","prime_yield":"Seoul logistics cap rate: 5.2% (stable); Tokyo Greater Tokyo logistics: capital values +0.1% q-o-q","prime_rent":"Tokyo logistics: JPY 4,823/tsubo/month (+0.9% q-o-q); Seoul logistics: KRW 32,600/pyeong (+0.7% q-o-q, +3.2% y-o-y)","url":"https://research.jllapsites.com/appd-article/industrial-market-insights-q1-2026/","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":41},{"publish_date":"2026-05-20","firm":"JLL","title":"Tokyo Industrial/Logistics Market Dynamics Q1 2026","summary":"JLL's city-level report on Greater Tokyo's logistics market. 3PL companies increasingly relocated and expanded logistics facilities throughout Greater Tokyo. As rents rose in core areas, demand for more affordable properties in fringe areas recovered. Overall vacancy declined 0.6 pp QoQ to 8.2%. The average gross rent was JPY 4,823 per tsubo per month (+0.9% QoQ). Capital values rose 0.1% QoQ and 1.2% YoY.","sector":"Industrial & Logistics","market":"Tokyo","prime_yield":null,"prime_rent":"Greater Tokyo logistics average gross rent: JPY 4,823/tsubo/month (+0.9% q-o-q); vacancy: 8.2%","url":"https://research.jllapsites.com/appd-market-report/q1-2026-logistics-industrial-tokyo/","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":42},{"publish_date":"2026-05-20","firm":"JLL","title":"Seoul Industrial/Logistics Market Dynamics Q1 2026","summary":"JLL's city-level report on Seoul's SCA Grade A logistics market. Net absorption reached 33,652 pyeong in Q1 2026, with positive absorption in Central, North, South, and West submarkets while South-east was negative. The overall SCA vacancy rate was stable at approximately 15.4%. Net effective rents increased 0.7% QoQ and 3.2% YoY to KRW 32,600 per pyeong. Total logistics investment volume reached KRW 747.2 billion, with the quarter's most notable deal being the KRW 432 billion sale of Arenas Yeongjong.","sector":"Industrial & Logistics","market":"Seoul","prime_yield":"Market cap rate: 5.2% (stable in Q1 2026)","prime_rent":"SCA Grade A net effective rent: KRW 32,600/pyeong (+0.7% q-o-q, +3.2% y-o-y); vacancy: ~15.4%","url":"https://research.jllapsites.com/appd-market-report/q1-2026-logistics-industrial-seoul/","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":43},{"publish_date":"2026-05-20","firm":"JLL","title":"Singapore Industrial/Logistics Market Dynamics Q1 2026","summary":"JLL's Q1 2026 report on Singapore's industrial and logistics sector. Demand held firm, with higher-specification logistics and warehouse premises remaining sought after. Islandwide average rents and capital values rose QoQ for the first time after six consecutive quarters of stability\u2014ending a prolonged period of flat metrics. Yields were kept unchanged. Notable Q1 2026 deals included UI Boustead REIT acquiring three logistics assets for SGD 138.8 million and CapitaLand Ascendas REIT purchasing a facility for SGD 504.2 million. Capital value growth could outpace rental growth and tighten yields by year-end.","sector":"Industrial & Logistics","market":"Singapore","prime_yield":"Yields unchanged in Q1 2026; capital value growth expected to tighten yields by year-end","prime_rent":"Islandwide average rent: rose q-o-q in Q1 2026 (first increase after 6 consecutive stable quarters)","url":"https://research.jllapsites.com/appd-market-report/q1-2026-logistics-industrial-singapore/","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":44},{"publish_date":"2026-05-14","firm":"JLL","title":"Industrial Real Estate Market Analysis Q1 2026: Latest Industrial Vacancy Rates Across Australia","summary":"JLL's comprehensive industrial vacancy and supply update for Australia. Vacancy was broadly stable in Sydney, Melbourne, and Brisbane in Q1 2026. Sydney recorded 5.8% vacancy across 23.5 million sqm, Melbourne 5.2% across 30.6 million sqm (Australia's largest market), Brisbane 5.3% across 13.8 million sqm, and Perth the lowest nationally at 2.0%. Sub-lease vacancy decreased in Sydney (to 1.1%) and Melbourne (to 1.0%). The 45,000+ sqm cohort was the tightest nationally at 2.9% vacancy.","sector":"Industrial & Logistics","market":"Australia","prime_yield":null,"prime_rent":null,"url":"https://www.jll.com/en-au/insights/market-dynamics/latest-industrial-vacancy-rates-across-australia","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":45},{"publish_date":"2026-05-20","firm":"JLL","title":"Sydney Industrial/Logistics Market Dynamics Q1 2026","summary":"JLL's city-level Q1 2026 report on Sydney's industrial market. After four consecutive quarters of strong activity, demand slowed as economic uncertainty challenged occupier sentiment\u2014quarterly gross take-up decreased 53.5% to 199,200 sqm, 20% below the 10-year average. Supply delivery rebounded to 319,000 sqm (+91% above 10-year average). Sales activity was AUD 499.1 million, 28% below the 10-year average. Prime yields were unchanged across all Sydney precincts following two quarters of compression, and rental growth slowed with only the Outer Central West recording a 1.1% QoQ increase.","sector":"Industrial & Logistics","market":"Australia","prime_yield":"Prime yields unchanged across all Sydney precincts in Q1 2026 (following two quarters of compression)","prime_rent":"Outer Central West rents: +1.1% q-o-q; other Sydney precincts: rents unchanged in Q1 2026","url":"https://research.jllapsites.com/appd-market-report/q1-2026-logistics-industrial-sydney/","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":46},{"publish_date":"2026-05-06","firm":"JLL","title":"Melbourne Industrial Market Dynamics Q1 2026","summary":"JLL's Q1 2026 report on Melbourne's industrial market. Occupier activity was elevated in Q1 2026, led by the North precinct. New supply moderated as speculative development completions continued to ease. Rental growth was mixed by grade and precinct, with secondary net face rents in the North and South East precincts declining due to rising vacancy within the secondary grade. The overall market vacancy stood at 5.2% across 30.6 million sqm.","sector":"Industrial & Logistics","market":"Australia","prime_yield":null,"prime_rent":"Secondary rents declined in North and South East precincts; vacancy: 5.2% (Melbourne overall)","url":"https://www.jll.com/en-au/insights/market-dynamics/melbourne-industrial","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":47},{"publish_date":"2026-05-20","firm":"JLL","title":"Hong Kong Industrial/Logistics Market Dynamics Q1 2026","summary":"JLL's Q1 2026 report on Hong Kong's industrial market. New lease activity remained constrained, supported primarily by the construction and semiconductor industries. Prime warehouse vacancy reached 10.5% in Q1 2026. Net absorption was negative for the ninth consecutive quarter, and there were no completions in Q1 2026. Investment activity was underpinned by an en-bloc transaction at Kodak House I and acquisitions by the Urban Renewal Authority, with mainland Chinese investors accounting for approximately 15.6% of total investment volume.","sector":"Industrial & Logistics","market":"Hong Kong","prime_yield":null,"prime_rent":"Prime warehouse vacancy: 10.5%; no completions in Q1 2026; net absorption negative for 9th consecutive quarter","url":"https://research.jllapsites.com/appd-market-report/q1-2026-logistics-industrial-hong-kong/","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":48},{"publish_date":"2026-05-19","firm":"JLL","title":"Hong Kong Monthly Market Dynamics \u2013 May 2026","summary":"JLL's monthly tracker of Hong Kong's multi-sector property market for May 2026. In April, overall office rent rose 1.2% MoM, with Central\u2014the key driver\u2014recording a 2.1% MoM increase. On the residential side, the successful MTR Kam Sheung Road Phase Two tender reflects developer confidence in Northern Metropolis growth. Retail leasing activity continued to reflect ongoing tenant reshuffling, while imports and exports surged 41.2% and 35.8% YoY respectively, supporting industrial market activity.","sector":"Mixed/Cross-Sector","market":"Hong Kong","prime_yield":null,"prime_rent":"Overall office rent: +1.2% m-o-m in April 2026; Central office rent: +2.1% m-o-m in April 2026","url":"https://www.jll.com/en-hk/insights/market-dynamics/hong-kong-monthly","publishDate":"2026-05-01","primeYield":null,"primeRent":null,"id":49},{"publish_date":"2026-05-18","firm":"JLL","title":"Hong Kong Office Market Dynamics Q1 2026","summary":"JLL's quarterly analysis of Hong Kong's office market. Demand normalised but quality leasing momentum held firm, with Central vacancy dropping to single digits for the first time since 2023, reflecting robust demand from the financial sector. Overall Grade A office rent rose 1.5% QoQ in Q1 2026, while Grade A capital values declined 0.4% QoQ. Early signs of rental recovery are emerging amid ongoing capital market headwinds, with moderate rent declines of 0\u20135% projected for full-year 2026.","sector":"Office","market":"Hong Kong","prime_yield":null,"prime_rent":"Overall Grade A office rent: +1.5% q-o-q; Central: +3.8% q-o-q; Central vacancy: 9.6% (first single-digit since 2023); overall vacancy: 13.5%","url":"https://www.jll.com/en-hk/insights/market-dynamics/hong-kong-office","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":50},{"publish_date":"2026-05-18","firm":"JLL","title":"Hong Kong Residential Market Dynamics Q1 2026","summary":"JLL's Q1 2026 overview of Hong Kong's residential market. Residential transaction volume rose 54.0% YoY in Q1 2026, with three residential sites tendered during the quarter. Luxury leasing and investment activity strengthened on the back of a broad market recovery, supported by easing financing conditions (HIBOR declining from 3.1% to 2.2%). The successful MTR Kam Sheung Road Phase Two tender reflected continued developer confidence in the Northern Metropolis.","sector":"Residential","market":"Hong Kong","prime_yield":null,"prime_rent":null,"url":"https://www.jll.com/en-hk/insights/market-dynamics/hong-kong-residential","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":51},{"publish_date":"2026-05-18","firm":"JLL","title":"Hong Kong Retail Market Dynamics Q1 2026","summary":"JLL's Q1 2026 analysis of Hong Kong's retail property market. Retail leasing activity remained steady during the quarter. Prime shopping centre vacancy rose to 12.6% in Q1 2026. Investment volume dropped compared to Q4 2025, though the market has moved past its trough with retail sales recording sustained growth and high-street rents stabilising. Ongoing tenant reshuffling continued, with fresh concepts and F&B operators leading activity.","sector":"Retail","market":"Hong Kong","prime_yield":null,"prime_rent":"Prime shopping centre vacancy: 12.6% (Q1 2026); high-street rents broadly stable with overall rental growth of ~1.6% y-o-y per market context","url":"https://www.jll.com/en-hk/insights/market-dynamics/hong-kong-retail","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":52},{"publish_date":"2026-05-18","firm":"JLL","title":"Asia Pacific Retail Market Dynamics Q1 2026","summary":"JLL's regional retail market update for Q1 2026, subtitled 'Asia Pacific retail steadying the course amid global headwinds.' Rents showed modest growth overall, driven by continued tenant interest in prime assets, though Greater China's ongoing declines\u2014while narrowing\u2014continued to weigh on the regional average. Retailers remained active in prime locations including city centres, tourist destinations, and experiential venues, while secondary retail faced more pressure.","sector":"Retail","market":"APAC","prime_yield":null,"prime_rent":"Modest rental growth in prime assets across the region; Greater China rents still declining but narrowing","url":"https://www.jll.com/en-au/insights/market-dynamics/asia-pacific-retail","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":53},{"publish_date":"2026-05-18","firm":"JLL","title":"Asia Pacific Residential Market Dynamics Q1 2026","summary":"JLL's regional residential market update for Q1 2026, subtitled 'Demand holds firm despite uncertainty.' Despite macroeconomic headwinds, prime residential demand remained structurally supported across Asia Pacific. Prime residential demand proved durable amid persistent global uncertainty. Capital value growth was subdued across most markets, reflecting cautious buyer sentiment amid geopolitical and interest-rate pressures.","sector":"Residential","market":"APAC","prime_yield":null,"prime_rent":null,"url":"https://www.jll.com/en-au/insights/market-dynamics/asia-pacific-residential","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":54},{"publish_date":"2026-05-06","firm":"JLL","title":"Australian Economy and CRE Trends \u2013 May 2026","summary":"JLL's monthly Australian macro and CRE outlook for May 2026, subtitled 'An Intricate Pathway Ahead.' Australian economic growth is anticipated at 2.0% in 2026, supported by a gradual recovery in private demand, stable household incomes, and robust public spending. Annual CPI rose to 4.6% in the 12 months to March 2026. The RBA raised the official cash rate to 4.35% in May 2026\u2014the third consecutive increase in 2026\u2014creating headwinds for CRE markets. Long-term structural trends in shifting demographics and technological advancement underpin continued CRE resilience.","sector":"Mixed/Cross-Sector","market":"Australia","prime_yield":null,"prime_rent":null,"url":"https://www.jll.com/en-au/insights/australian-economy-and-cre-trends-may-2026","publishDate":"2026-05-01","primeYield":null,"primeRent":null,"id":55},{"publish_date":"2026-05-15","firm":"JLL","title":"Relative Affordability Drives Australian Residential Prices","summary":"JLL Research analysis of Australian residential price dynamics, showing how buyers priced out of expensive suburbs are fuelling strong growth in more affordable markets. Perth, Adelaide, and South East Queensland averaged over 11% per year in house price growth over five years, while Sydney averaged 8% per year. Melbourne lagged at around 3.3%. Salisbury (Adelaide's north) reached a median house price of AUD 758,000 (+16.5% per year). The report highlights relative affordability as the primary structural driver of price growth, especially as high Sydney prices push buyers west and to other cities.","sector":"Residential","market":"Australia","prime_yield":null,"prime_rent":"Median house prices: Salisbury AUD 758,000 (+16.5%/yr); Mosman AUD 5,240,000 (+4.3%/yr); Perth/Adelaide/SE Qld avg ~AUD 1,505,000 (vs Sydney inner >AUD 2,250,000)","url":"https://www.jll.com/en-au/insights/relative-affordability-drives-australian-residential-prices","publishDate":"2026-04-01","primeYield":null,"primeRent":null,"id":56},{"publish_date":"2026-05-06","firm":"JLL","title":"Melbourne Residential Market Dynamics Q1 2026","summary":"JLL's Q1 2026 city-level report on Melbourne's residential market. Apartment completions in Melbourne's inner precinct were just over 2,000 in 2025\u2014a 10-year low. Median apartment sale prices in Melbourne remained largely stagnant at AUD 615,000 since early 2023. Apartment rents saw some modest growth. Buyer activity was increasing, supported by the constrained supply pipeline, with developers expected to deliver fewer new projects in the near term.","sector":"Residential","market":"Australia","prime_yield":null,"prime_rent":"Melbourne median apartment sale price: AUD 615,000 (largely stagnant since early 2023); rents: modest growth","url":"https://www.jll.com/en-au/insights/market-dynamics/melbourne-residential","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":57},{"publish_date":"2026-05-06","firm":"JLL","title":"Melbourne Retail Market Dynamics Q1 2026","summary":"JLL's Q1 2026 report on Melbourne's retail market. Non-discretionary spending increased 5% annually, double the discretionary spending growth of 2.7%, reflecting the ongoing polarisation in consumer spending. Six retail projects were completed in Q1 2026, up from the previous year. Eleven retail sales transactions occurred in Melbourne during the quarter. The market showed resilience in prime locations while secondary retail faced continued headwinds.","sector":"Retail","market":"Australia","prime_yield":null,"prime_rent":null,"url":"https://www.jll.com/en-au/insights/market-dynamics/melbourne-retail","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":58},{"publish_date":"2026-05-13","firm":"JLL","title":"Investment Market Dynamics \u2013 Q1 2026 (Japan)","summary":"JLL's Japan-focused capital markets research for Q1 2026, showcasing global and Japan capital flows and investment trends. Japan remained the largest APAC CRE market at USD 13.2 billion in Q1 2026, with Q1 2026 volumes 43% above the 10-year quarterly average. Inbound capital from overseas investors reached multi-year highs. Office assets dominated activity, including Brookfield's ~USD 1.9 billion acquisition of Dentsu's headquarters. The report notes that 2025 saw JPY 6.6 trillion in total Japan real estate transaction volume\u2014the highest since 2020.","sector":"Investment","market":"Tokyo","prime_yield":null,"prime_rent":null,"url":"https://www.jll.com/en-jp/insights/market-dynamics/japan-investment","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":59},{"publish_date":"2026-05-21","firm":"JLL","title":"Foreign Investment Shapes Korea's Co-Living Market","summary":"JLL Research analysis of Korea's emerging co-living sector. Shifting demographics\u2014including high home prices, risk of losing Jeonse deposits, high price-to-income ratios, growing single-person households, and long-term overseas visitors\u2014have drawn foreign capital to Korea's co-living market. ICG's partnership with Homes Company established a co-living fund worth approximately KRW 300 billion. New LTV restrictions (0% in regulated areas) introduced in late 2025 are reshaping financing structures for rental housing operators.","sector":"Residential","market":"Seoul","prime_yield":null,"prime_rent":null,"url":"https://www.jll.com/en-hk/insights/foreign-investment-shapes-korea-s-co-living-market","publishDate":"2026-04-01","primeYield":null,"primeRent":null,"id":60},{"publish_date":"2026-05-06","firm":"JLL","title":"Asia Pacific Office Fit-Out Cost Guide 2026","summary":"JLL's annual APAC office fit-out cost benchmark drawing on data from 27 cities across 14 countries. The regional average fit-out cost across APAC is USD 1,550/sqm, with 2\u20135% year-on-year local-currency increases. Tokyo is the highest-cost city in APAC; Singapore and major Australian cities (Sydney, Melbourne, Brisbane) follow closely. Seoul sits in the mid-range, while Hong Kong serves as the baseline for the city cost index. High-cost markets reflect labour shortages and high performance standards.","sector":"Office","market":"APAC","prime_yield":null,"prime_rent":"APAC average office fit-out cost: USD 1,550/sqm (+2\u20135% y-o-y); Tokyo highest; Singapore and major Australian cities next; Seoul mid-range; Hong Kong = baseline index","url":"https://www.jll.com/en-in/guides/apac-fit-out-costs-guide","publishDate":"2026-04-01","primeYield":null,"primeRent":null,"id":61},{"publish_date":"2026-05-05","firm":"JLL","title":"Brisbane Office Market Dynamics Q1 2026","summary":"JLL's Q1 2026 report on Brisbane's office market. The market showed a clear divergence between the CBD and Near City precincts. Brisbane CBD recorded net absorption of 5,300 sqm, supported by sustained tenant demand, while the Near City market posted negative net absorption of -22,800 sqm. Headline CBD vacancy edged down slightly to 11.5%, while Near City vacancy rose to 15.0%. Rental growth continued across the market but showed signs of moderation.","sector":"Office","market":"Australia","prime_yield":null,"prime_rent":"Brisbane CBD vacancy: 11.5%; Near City vacancy: 15.0%; rental growth continuing but moderating","url":"https://www.jll.com/en-au/insights/market-dynamics/brisbane-office","publishDate":"2026-04-15","primeYield":null,"primeRent":null,"id":62},{"publishDate":"2026-05-28","firm":"Savills","title":"Asia Pacific Investment Quarterly Q1 2026","summary":"Asia Pacific real estate investment rose 19.2% year-on-year in Q1 2026, led by prime office investment (up 25.7% YoY) in gateway cities such as Tokyo and Singapore. Cross-border capital flows strengthened, with Singapore recording S$11.48 billion in investment sales (up ~95% YoY) and Japan's prime office rents in the Central 5 Wards reaching new highs. Data centre and industrial/logistics assets continued attracting capital driven by AI infrastructure demand, semiconductor exports, and supply-chain reshoring.","sector":"Investment","market":"APAC","primeYield":null,"primeRent":null,"url":"https://www.savills.com/research_articles/255800/370754-0","id":63},{"publishDate":"2026-05-11","firm":"Savills","title":"Global Occupier Markets: Prime Office Costs \u2013 Q1 2026","summary":"Global prime office occupier costs rose 0.7% in Q1 2026, bringing the 12-month increase to 5% and the two-year cumulative gain to 9.1%. Tokyo posted the sharpest quarterly rise of any APAC city ever recorded in the series (12.7% QoQ), driven by near-zero vacancy in top buildings and landlords raising headline rents. APAC overall saw a 0.4% increase, with Asian markets excluding China up 1.4% on average, while mainland Chinese hubs continued to decline 2%.","sector":"Office","market":"APAC","primeYield":null,"primeRent":null,"url":"https://www.savills.com/research_articles/255800/prime-office-costs-q1-2026","id":64},{"publishDate":"2026-04-21","firm":"Savills","title":"Singapore Office Market Q1/2026","summary":"Savills revised its Singapore office rental forecast for 2026 upward from 2% to 3%\u20135% YoY growth, supported by tight supply and sustained occupancy. CBD Grade A rents rose 0.6% QoQ to a post-2019 high of S$10.02 per sq ft (eighth consecutive quarter of gains), while Grade AAA rents reached S$13.28 per sq ft. CBD Grade A vacancy dipped to 6.6%, the lowest since Q3 2024, with Grade AAA vacancy falling to 5.1% for the fifth consecutive quarter.","sector":"Office","market":"Singapore","primeYield":null,"primeRent":"S$10.02 per sq ft per month (CBD Grade A); S$13.28 per sq ft per month (Grade AAA)","url":"https://www.savills.com.sg/research/singapore/office-market.aspx","id":65},{"publishDate":"2026-05-19","firm":"Savills","title":"Singapore Private Residential Leasing Q1/2026","summary":"Singapore's island-wide private residential leasing volumes rose 4.0% QoQ to 20,862 transactions in Q1 2026, recovering from a year-end seasonal dip. High-end non-landed rents rose 1.7% QoQ to S$6.15 per sq ft \u2014 the sixth consecutive quarter of luxury rental increases, with cumulative growth of 7% from the Q3 2024 trough. Savills expects private residential rental prices to remain broadly flat through 2026, underpinned by manageable supply additions of ~5,371 units.","sector":"Residential","market":"Singapore","primeYield":null,"primeRent":"S$6.15 per sq ft per month (luxury non-landed)","url":"https://www.savills.com.sg/research/singapore/residential-leasing.aspx","id":66},{"publishDate":"2026-05-20","firm":"Savills","title":"Singapore Retail Vacancy Holds at 6.3% Amid Tight Supply Pipeline \u2013 Q1/2026","summary":"Singapore's retail vacancy rate held steady at 6.3% in Q1 2026, despite softer leasing demand and rising tenant churn, as the constrained supply pipeline (427,000 sq ft projected for 2026) contained vacancy. Prime Orchard Area mall rents edged up 0.1% QoQ to S$23.60 per sq ft, while suburban rents rose 0.2% QoQ to S$14.90 per sq ft. The market is bifurcating, with well-located prime malls maintaining occupancy while secondary locations face growing leasing challenges.","sector":"Retail","market":"Singapore","primeYield":null,"primeRent":"S$23.60 per sq ft per month (Orchard Area prime malls); S$14.90 per sq ft per month (Suburban)","url":"https://www.savills.com.sg/research/singapore/retail-market.aspx","id":67},{"publishDate":"2026-05-20","firm":"Savills","title":"Singapore Real Estate Investment Sales Q1/2026","summary":"Singapore real estate investment sales surged to S$11.48 billion in Q1 2026, up 95.4% YoY from S$5.88 billion, supported by developer land replenishment, private wealth participation, and REIT asset recycling. Residential assets led by sector share at 38.5%, followed by industrial (25.7%) and commercial (17.8%). Savills revised its full-year 2026 investment sales projection upward to S$35\u201340 billion, from S$34 billion.","sector":"Investment","market":"Singapore","primeYield":null,"primeRent":null,"url":"https://www.savills.com.sg/research/singapore/investment-market.aspx","id":68},{"publishDate":"2026-05-26","firm":"Savills","title":"Singapore Industrial Market Q1/2026","summary":"Strata industrial sales in Singapore declined 17.5% QoQ to 335 deals in Q1 2026, the lowest quarterly total since 2020, amid a more cautious business environment. Buyer preferences shifted sharply toward longer land tenures, with freehold industrial assets rising 2.9% QoQ to S$876 per sq ft and 60-year leasehold assets up 1.4% QoQ to S$569 per sq ft, while 30-year leasehold assets dipped 0.6% QoQ to S$353 per sq ft. Prime warehouse and logistics rents increased 0.4% QoQ to S$1.83 per sq ft per month.","sector":"Industrial & Logistics","market":"Singapore","primeYield":null,"primeRent":"S$1.83 per sq ft per month (prime warehouse/logistics)","url":"https://www.savills.com.sg/research/singapore/industrial-market.aspx","id":69},{"publishDate":"2026-05-26","firm":"Savills","title":"Singapore Residential Sales Market Q1/2026","summary":"Singapore developers launched approximately 1,844 new private units in Q1 2026, down ~30% QoQ and 41.3% YoY, while sales totalled ~2,025 units as demand outpaced new supply for a second consecutive quarter. Strong take-up was seen at River Modern (410 of 455 sold), Pinery Residences (537 of 588), and Newport Residences (184 of 246). Private residential prices rose 0.3% QoQ, moderating from 0.6% in Q4 2025.","sector":"Residential","market":"Singapore","primeYield":null,"primeRent":null,"url":"https://www.savills.com.sg/research/singapore/residential-sales.aspx","id":70},{"publishDate":"2026-05-05","firm":"Savills","title":"Seoul Prime Office Market Monitor Q1/2026 \u2013 Vacancy and Absorption","summary":"Seoul's prime office market recorded negative net absorption of -26,900 sq m in Q1 2026, pushing average vacancy up 0.4 percentage points QoQ to 4.0%. The CBD bore the brunt, with net absorption of -22,100 sq m and vacancy rising to 5.5%, while the Gangnam Business District was the only major submarket to post positive net absorption with vacancy stable at 1.7%. Redevelopment-driven relocations continued to shape YBD activity.","sector":"Office","market":"Seoul","primeYield":null,"primeRent":null,"url":"https://www.savills.co.kr/research/korea/office-market.aspx","id":71},{"publishDate":"2026-05-07","firm":"Savills","title":"Seoul Prime Office Rents Q1/2026","summary":"Average prime office face rents in Seoul rose 4.1% YoY to KRW128,200 per pyeong in Q1 2026, led by the Gangnam Business District at 6.2% YoY (KRW131,300 per pyeong). The CBD recorded rents of KRW133,300 per pyeong (up 3.8% YoY) and YBD rents reached KRW112,900 per pyeong (up 1.7% YoY). Maintenance fees also rose 2.6% YoY to KRW48,400 per pyeong, broadly in line with CPI inflation of 2\u20133%.","sector":"Office","market":"Seoul","primeYield":null,"primeRent":"KRW128,200 per pyeong per month (prime average); KRW133,300 (CBD)","url":"https://realestateasia.com/commercial-office/news/seoul-prime-office-rents-rise-41-in-q1","id":72},{"publishDate":"2026-05-12","firm":"Savills","title":"Seoul Office Investment Market Q1/2026","summary":"Seoul's office investment market registered KRW3.0 trillion in transactions in Q1 2026, up 13% YoY, though representing only about 14% of the record KRW21 trillion achieved in 2025. The largest deal was Korea Investment Real AMC's KRW1.2856 trillion acquisition of Seoul Square in the CBD. Prime office cap rates remained stable at mid-to-high 4% nominal, though rising government bond yields are narrowing spreads and could exert upward pressure.","sector":"Investment","market":"Seoul","primeYield":"4.00%\u20134.50% (mid-to-high 4% nominal cap rate)","primeRent":null,"url":"https://realestateasia.com/commercial-office/news/seoul-office-investment-surges-13-in-q1","id":73},{"publishDate":"2026-05-05","firm":"Savills","title":"Seoul Prime Office Supply Outlook: New CBD Completions in 2026","summary":"Seoul's CBD prime office market is seeing its first new supply since Grand Central's completion in 2020, with three developments scheduled for 2026: G1 Seoul (April), Rene Square (May), and EUL Tower (October). No additional prime completions are expected in 2027, making the 2026 pipeline critical for near-term vacancy and rent dynamics. Savills notes market attention is focused on leasing strategies for these assets and their impact on CBD vacancy.","sector":"Office","market":"Seoul","primeYield":null,"primeRent":null,"url":"https://realestateasia.com/commercial-office/news/three-prime-office-projects-reshape-seoul-cbd-supply-in-2026","id":74},{"publishDate":"2026-05-12","firm":"Savills","title":"Seoul Prime Office Vacancy Outlook Q2/2026 and Beyond","summary":"Savills projects divergent vacancy trends across Seoul's major office districts as new CBD supply enters the market. CBD vacancy is expected to edge higher due to G1 Seoul and Rene Square completions, partially offset by expansions (Netflix, Bae Kim & Lee) and relocations at Grand Central. GBD vacancy should remain broadly stable despite tenant turnover, while YBD vacancy is set to rise short-term before improving as NH NongHyup Capital and Mirae Asset Securities take space at new buildings.","sector":"Office","market":"Seoul","primeYield":null,"primeRent":null,"url":"https://realestateasia.com/commercial-office/news/seoul-prime-office-vacancy-set-rise-new-supply-enters-cbd","id":75},{"publishDate":"2026-05-05","firm":"Savills","title":"Tokyo Residential Market Q1/2026 \u2013 Occupancy Update","summary":"Occupancy rates across Tokyo's 23 Wards rose 0.6 percentage points QoQ to 96.8% in Q1 2026, driven by a return-to-office trend (companies offering remote work fell from 48.4% to 40.1% YoY). The central 5 wards recorded 96.4% occupancy, up 0.4 ppts both QoQ and YoY. Savills expects stable demographic fundamentals, the spring moving season, and rising condominium prices pushing renters into the leasing market to continue supporting demand.","sector":"Residential","market":"Tokyo","primeYield":null,"primeRent":null,"url":"https://realestateasia.com/residential/news/tokyo-residential-occupancy-rate-increases-968-in-q1","id":76},{"publishDate":"2026-05-28","firm":"Savills","title":"Japan / Tokyo Office Market \u2013 APAC Investment Quarterly Q1/2026 Highlights","summary":"In Japan's office market, strong occupier demand, limited supply, and positive yield spreads continued to support pricing in Q1 2026, with prime office rents in Tokyo's Central 5 Wards touching new highs. Japan's commercial real estate investment reached JPY2.043 trillion in Q1 2026, up 2% YoY and the highest first-quarter level on record. Cross-border capital flows concentrated heavily in Japan during the quarter.","sector":"Office","market":"Tokyo","primeYield":null,"primeRent":null,"url":"https://www.savills.co.jp/research/japan/office-market.aspx","id":77},{"publishDate":"2026-05-11","firm":"Savills","title":"Global Occupier Markets: Prime Office Costs \u2013 Q1 2026 (Tokyo Focus)","summary":"Tokyo recorded the sharpest quarterly increase in occupier costs (12.7% in Q1 2026) of any APAC city ever measured since the report's 2020 launch, driven by near-zero vacancy in top-tier office buildings, landlords raising headline rents, and Japan's sustained inflation above 2%. Gross rents across the top Tokyo buildings had been broadly flat from 2022\u20132024 but are now rising as corporate profitability improved and demand for premium offices intensified. Fewer completions are expected in 2026 than 2025, sustaining supply constraint.","sector":"Office","market":"Tokyo","primeYield":null,"primeRent":null,"url":"https://www.savills.com/research_articles/255800/prime-office-costs-q1-2026","id":78},{"publishDate":"2026-05-13","firm":"Savills","title":"Savills plc Q1 2026 Trading Update \u2013 Asia Pacific Commentary","summary":"Savills reported that Asia Pacific investment volumes increased 16% YoY on a constant currency basis in Q1 2026, with broad-based growth across major sectors and markets. The firm recorded a significant recovery in capital transaction revenues in its Asia Pacific region, including a particularly strong start to 2026 in Hong Kong and improvement in Mainland China. Savills maintained its full-year 2026 guidance while flagging Middle East geopolitical uncertainty as a key risk.","sector":"Mixed/Cross-Sector","market":"APAC","primeYield":null,"primeRent":null,"url":"https://global.morningstar.com/en-gb/news/alliance-news/1778660177407027400/savills-says-2026-view-unchanged-but-notes-significant-uncertainty","id":79},{"publishDate":"2026-05-11","firm":"Savills","title":"Global Luxury Retail Outlook 2026 (Ninth Edition)","summary":"Average prime luxury retail rents across 27 global destinations rose just 0.9% in 2025, down sharply from 6.6% in 2024. London's Bond Street displaced Hong Kong's Tsim Sha Tsui as the world's most expensive luxury retail market; Tsim Sha Tsui retained the title of Asia's priciest strip at US$22,000 per sq m annually (\u20ac16,160). Singapore outperformed the global average with 2% prime luxury rental growth in 2025 and remained in the global top 10 for luxury store openings, alongside Tokyo, Bangkok and Shanghai.","sector":"Retail","market":"Hong Kong","primeYield":null,"primeRent":"US$22,000 per sq m per year (Tsim Sha Tsui luxury retail)","url":"https://www.savills.com/research_articles/255800/global-luxury-retail-outlook-2026","id":80},{"publishDate":"2026-05-11","firm":"Savills","title":"Global Luxury Retail Outlook 2026 \u2013 Singapore Highlights","summary":"Singapore's luxury retail market achieved 2% prime rent growth in 2025, outperforming the global average of 0.9%, and remained among the world's top 10 destinations for new luxury store openings. Limited availability on prime retail streets such as Orchard Road and Marina Bay concentrated demand in a smaller number of flagship locations, supporting continued rental pressure. Singapore retained its appeal with ultra-high-net-worth individuals from the US, Germany, and other global wealth centres.","sector":"Retail","market":"Singapore","primeYield":null,"primeRent":null,"url":"https://www.savills.com/research_articles/255800/global-luxury-retail-outlook-2026","id":81},{"publishDate":"2026-05-13","firm":"Savills","title":"Hong Kong Office Market Q1/2026 \u2013 Prime Central Rental Forecast","summary":"Savills forecasts prime Central office rents in Hong Kong to rise 5\u20137% in 2026, supported by tightening vacancy in the core Central submarket. Central Grade A rents rose approximately 3.5% in Q1 2026, with Central vacancy falling to around 9.9% by February \u2014 the lowest since 2023. Non-residential investment in Hong Kong was boosted by office and hotel deals, and investors explored hotel-to-student-accommodation repositioning opportunities.","sector":"Office","market":"Hong Kong","primeYield":null,"primeRent":null,"url":"https://www.savills.com.hk/research/hong-kong/office-market.aspx","id":82},{"publishDate":"2026-05-15","firm":"Savills","title":"Asia Pacific Real Assets Market Update \u2013 May 2026 (APREA)","summary":"Savills APAC Capital Markets presented a regional real assets market update at the APREA conference in May 2026, noting that geopolitical developments in the Middle East are influencing investor sentiment without causing a fundamental market pullback. Prime assets are experiencing a 'flight to quality' dynamic tightening supply and pushing pricing, while capital deployment is becoming more selective across different APAC markets. Savills characterised the environment as 'disciplined conviction' rather than broad-based retreat.","sector":"Mixed/Cross-Sector","market":"APAC","primeYield":null,"primeRent":null,"url":"https://www.linkedin.com/posts/savills-asia-pacific_savillsasiapacific-capitalmarkets-commercialrealestate-activity-7460871625945767936-WV2f","id":83},{"publishDate":"2026-05-08","firm":"Savills","title":"The Residential Review \u2013 May 2026 (Australia)","summary":"The first edition of Savills Australia's new monthly residential research update covering Australia's housing markets. The May 2026 edition focuses on the drivers behind Perth's continued price growth, Sydney's bifurcated market conditions, and key themes ahead of the Federal Budget. It serves as a regular pulse check bringing together data and on-the-ground market insight across Australia's increasingly uneven residential markets.","sector":"Residential","market":"Australia","primeYield":null,"primeRent":null,"url":"https://www.savills.com.au/research/residential-review-may-2026.aspx","id":84},{"publishDate":"2026-05-21","firm":"Savills","title":"Australia Retail Market in Minutes \u2013 Q1 2026 / May 2026","summary":"Australian retail investment volumes reached approximately A$4 billion in Q1 2026, the second consecutive quarter above that threshold, bringing rolling annual turnover to A$13.2 billion \u2014 up from A$9.9 billion a year earlier. Institutional capital accounted for 54% of acquisitions, while private and syndicated investors rose to 44%. Regional centres dominated at A$1.8 billion (nearly four times YoY), and neighbourhood centres rose 54% YoY, though large format retail was more selective.","sector":"Retail","market":"Australia","primeYield":null,"primeRent":null,"url":"https://www.savills.com.au/research/retail-market-in-minutes-q1-2026.aspx","id":85},{"publishDate":"2026-05-01","firm":"Savills","title":"Singapore Office Rental Forecast Revised Upward to 3%\u20135% for 2026","summary":"Savills Singapore revised its 2026 office rental growth forecast from 2% to 3%\u20135% YoY, citing persistently low vacancy levels and landlords' pricing power. CBD Grade A rents hit S$10.02 per sq ft \u2014 highest since Q4 2019 \u2014 while Grade AAA vacancy tightened to 5.1%. Shorter lease renewal terms are becoming more common among technology firms as companies navigate economic uncertainty.","sector":"Office","market":"Singapore","primeYield":null,"primeRent":"S$10.02 per sq ft per month (CBD Grade A); S$13.28 per sq ft per month (Grade AAA)","url":"https://sav.li/fHJkAo","id":86},{"publishDate":"2026-05-19","firm":"Savills","title":"Singapore Private Residential Vacancy Q1/2026","summary":"Singapore's overall private residential vacancy rose 0.2 percentage points QoQ to 6.2% in Q1 2026, with islandwide vacant stock increasing 2.3% to 26,158 units despite only 911 new units completing the quarter. Performance diverged sharply: CCR vacancy fell from 8.8% to 8.2% as net demand improved in the city centre, while RCR and OCR both saw slight vacancy increases. Total completed private stock reached 424,165 units.","sector":"Residential","market":"Singapore","primeYield":null,"primeRent":null,"url":"https://realestateasia.com/residential/news/singapore-private-residential-vacancy-rises-62-in-q1-2026","id":87},{"publishDate":"2026-05-28","firm":"Savills","title":"Savills Impacts 2026 \u2013 AI's Implications for Real Estate","summary":"Savills launched its Impacts 2026 research programme examining AI's broad implications for real estate demand and strategy. The report includes analysis of 'Deep Tech cities', whose economies grew 0.9 percentage points per year faster than their host countries over the past decade. Savills found that companies significantly using AI are about 4% more likely to expand headcount than shed staff, and that economic growth and business sentiment remain more significant drivers of office demand than AI displacement.","sector":"Mixed/Cross-Sector","market":"APAC","primeYield":null,"primeRent":null,"url":"https://impacts.savills.com/technology/ais-implications-for-real-estate.html","id":88},{"publishDate":"2026-05-12","firm":"Savills","title":"Global Luxury Retail Outlook 2026 \u2013 Hong Kong (Tsim Sha Tsui)","summary":"Hong Kong's Tsim Sha Tsui retained its title as Asia's most expensive luxury retail location in the Savills ninth annual Global Luxury Retail Outlook, with annual rents of US$22,000 (approximately \u00a316,160) per s
