q m \u2014 ranking as the world's second most expensive luxury retail strip after London's Bond Street (\u00a319,228 per sq m). Hong Kong remained among the world's most active markets for new luxury store openings. The report noted slower rent growth in Hong Kong in 2025 compared to 2024's rebound.","sector":"Retail","market":"Hong Kong","primeYield":null,"primeRent":"US$22,000 per sq m per year (Tsim Sha Tsui)","url":"https://www.savills.com/research_articles/255800/global-luxury-retail-outlook-2026","id":89},{"publishDate":"2026-05-21","firm":"Savills","title":"Singapore Private Residential Rents Outlook 2026","summary":"Savills expects Singapore private residential rents to remain broadly flat through 2026, supported by manageable supply additions and stable underlying demand despite global economic and geopolitical headwinds. In the URA rental index, overall non-landed rents rose 0.4% QoQ in Q1 2026, with CCR up 0.5% and OCR up 1.0%, while RCR posted a rare 0.2% decline \u2014 its first contraction since Q2 2024. Median rents for new leases showed broad-based increases across all regions.","sector":"Residential","market":"Singapore","primeYield":null,"primeRent":null,"url":"https://sg.news.yahoo.com/singapore-private-home-leasing-rebounds-085654982.html","id":90},{"publishDate":"2026-04-17","firm":"Knight Frank","title":"Asia-Pacific Q1 2026 Office Highlights","summary":"Prime office rents across APAC rose 0.8% quarter-on-quarter in Q1 2026, led by India and Australia, as vacancy tightened to 14.1% across developed markets. Sydney (8.6% YoY) and Brisbane (8.2% YoY) were among the strongest performers in the region, trailing only Bengaluru and Tokyo. Occupiers are acting earlier, prioritising quality, energy efficiency and long-term flexibility, with 18 of 24 monitored cities recording stable or increasing rents.","sector":"Office","market":"APAC","primeYield":null,"primeRent":"+0.8% QoQ across APAC","url":"https://kfmap.asia/research/asia-pacific-q1-2026-office-highlights/4875","id":91},{"publishDate":"2026-04-30","firm":"Knight Frank","title":"Asia-Pacific Capital Markets Insights Q1 2026","summary":"APAC real estate investment surged to US$64.6 billion in Q1 2026 \u2014 up 13.0% quarter-on-quarter and 64.7% year-on-year \u2014 the strongest quarterly performance since Q4 2021. Office assets led sector activity at US$23.5 billion (+46.7% YoY), while cross-border investment more than doubled to US$22.4 billion. Japan attracted US$6 billion in inbound capital; Singapore cross-border volumes rose to US$5.7 billion; South Korea cross-border inflows climbed 45% YoY to US$1.4 billion.","sector":"Investment","market":"APAC","primeYield":null,"primeRent":null,"url":"https://hubs.la/Q04gbZ660","id":92},{"publishDate":"2026-05-29","firm":"Knight Frank","title":"Hong Kong Monthly \u2014 May 2026","summary":"Premium Central Grade-A offices recorded approximately 10% rental growth over the past 12 months, with Central overall at HK$94.6 per sq ft per month (up 8.9% YoY). Primary residential sales reached 8,146 units YTD (+47.8%), driven by mainland Chinese buyers and capital inflows, with Knight Frank forecasting full-year price growth of 8\u201310%. Retail sales extended an 11-consecutive-month growth streak with 12.8% YoY growth in March, led by motor vehicles and luxury goods.","sector":"Mixed/Cross-Sector","market":"Hong Kong","primeYield":null,"primeRent":"HK$94.6 psf/mth (Overall Central, Apr 2026); HK$113.6 psf/mth (Premium Central)","url":"https://content.knightfrank.com/research/676/documents/en/hong-kong-monthly-may-2026-12872.pdf","id":93},{"publishDate":"2026-04-01","firm":"Knight Frank","title":"Hong Kong Monthly \u2014 April 2026","summary":"Hong Kong's Q1 2026 residential market strengthened with total transaction volumes rising 9% QoQ to 18,654 units, driven by a 13% increase in secondary sales. Prices rose 1.8% MoM in February and 1.4% MoM in March, supported by capital inflows and stronger buyer enquiries. Knight Frank raised its full-year 2026 residential price growth forecast to 8\u201310%, with luxury rents rising 11.2% year-on-year.","sector":"Mixed/Cross-Sector","market":"Hong Kong","primeYield":null,"primeRent":null,"url":"https://www.knightfrank.com.hk/blog/amp/2026/05/29/hong-kong-monthly-report-may-2026","id":94},{"publishDate":"2026-05-07","firm":"Knight Frank","title":"Hong Kong Industrial Leasing Q1 2026","summary":"Demand for Hong Kong industrial leasing remained steady in Q1 2026 despite external headwinds, driven primarily by logistics and e-commerce companies. Vacancy rates for both general industrial properties and modern logistics improved slightly. The Kowloon East submarket faces rising vacancies as narrowing rental differentials between industrial and office space prompt tenants to consolidate into offices.","sector":"Industrial & Logistics","market":"Hong Kong","primeYield":null,"primeRent":null,"url":"https://www.linkedin.com/posts/knight-frank-greaterchina_industrial-leasing-logistics-activity-7458004294940872705-qHNV","id":95},{"publishDate":"2026-04-23","firm":"Knight Frank","title":"From Volatility to Opportunity: 2026 Outlook for the Hong Kong Island Grade A Office Market","summary":"Hong Kong Island Grade A office capital values remain more than 60% below their 2019 peak, presenting opportunities as the market pivots from leasing to ownership with end-users now accounting for around 90% of recent office acquisitions. In 2025, large-scale office transaction value reached HK$28 billion \u2014 more than double the 2024 level. Premium Central continued to outperform, recording 5.1% QoQ rental growth in Q1 2026.","sector":"Office","market":"Hong Kong","primeYield":null,"primeRent":"Premium Central: +5.1% QoQ in Q1 2026; ~10% YoY growth in past 12 months","url":"https://www.linkedin.com/posts/knight-frank-greaterchina_knightfrank-hongkongproperty-marketinsights-activity-7459527763469897729-ZD56","id":96},{"publishDate":"2026-05-06","firm":"Knight Frank","title":"Hong Kong's Prime Market Turns a Corner","summary":"Hong Kong prime residential prices slipped 2.1% in 2025 per the PIRI 100, yet super-prime activity surged with 81 US$10 million+ transactions in Q4 \u2014 second globally only to Dubai. Morgan Stanley raised its 2026 Hong Kong home-price growth estimate to 12%, citing strong sell-through rates, declining inventory, and falling land supply. Momentum is driven by a resurgent IPO market, mainland Chinese wealth inflows, and expanded talent visa schemes.","sector":"Residential","market":"Hong Kong","primeYield":null,"primeRent":null,"url":"https://www.knightfrank.co.uk/research/article/2026/5/hong-kongs-prime-market-turns-a-corner","id":97},{"publishDate":"2026-05-27","firm":"Knight Frank","title":"Hong Kong's Resurgence Reflects a New Wealth Order","summary":"Hong Kong overtook Switzerland as the world's largest cross-border booking centre in 2025, with cross-border wealth rising 10.7% to US$2.9 trillion driven by mainland China flows and surging IPO activity (US$36 billion raised via HKEX in 2025, up 218% YoY). Singapore and the UAE complete the top three global cross-border wealth hubs. Asia-Pacific's role in the AI supply chain and equity market performance in Hong Kong and Japan is rapidly expanding the region's financial wealth.","sector":"Investment","market":"Hong Kong","primeYield":null,"primeRent":null,"url":"https://www.knightfrank.co.uk/research/article/2026/5/hong-kongs-resurgence-reflects-a-new-wealth-order","id":98},{"publishDate":"2026-05-07","firm":"Knight Frank","title":"Australian Office Indicators Q1 2026","summary":"Net effective rents in Sydney CBD rose 10.2% and Melbourne CBD rose 6.8% over the 12 months to end-March 2026 \u2014 the fastest post-pandemic growth rates. Brisbane CBD led with 11.7% annual net effective rental growth. Core precincts outperformed significantly: Sydney Core surged 14.3% and Melbourne Eastern Core jumped 16.1% YoY, creating a 54% and 93% premium respectively over non-core CBD locations.","sector":"Office","market":"Australia","primeYield":null,"primeRent":"Sydney: +8.6% YoY prime net face rent; Brisbane: +8.2% YoY; Melbourne: CBD NER +6.8% YoY","url":"https://www.knightfrank.com.au/blog/amp/2026/05/15/australias-larger-cbds-recording-robust-office-rental-growth","id":99},{"publishDate":"2026-05-10","firm":"Knight Frank","title":"Australian Industrial Review Q1 2026","summary":"East coast industrial vacancy edged up marginally to 3.9% in Q1 2026, with Sydney recording the tightest rate at 2.9%. New supply is contracting sharply \u2014 2026 completions are forecast to fall a further 20% following a 19% decline in 2025, totalling 1.66 million sq m. Brisbane leads on annual prime effective rent growth at 9.2%, and the thinning development pipeline is expected to drive stronger absorption and rental gains across east coast markets.","sector":"Industrial & Logistics","market":"Australia","primeYield":null,"primeRent":"Brisbane: +9.2% annual prime effective rent growth (strongest on east coast)","url":"https://www.knightfrank.com.au/blog/amp/2026/05/10/thinning-industrial-development-pipeline-will-aid-future-rental-growth-across-east-coast","id":100},{"publishDate":"2026-04-01","firm":"Knight Frank","title":"Australian Retail Review \u2014 April 2026","summary":"Australia's retail property sector delivered the strongest total return of all commercial property sectors in 2025 at 9.2%, carrying momentum into 2026 with around A$3.6 billion of retail transactions in Q1. Household spending growth and tightening supply are driving outperformance, though new geopolitical pressures from the Middle East conflict introduce uncertainty. Prime centres continue to outperform, supported by stronger sales, higher foot traffic and resilient tenant demand.","sector":"Retail","market":"Australia","primeYield":null,"primeRent":null,"url":"https://www.knightfrank.com.au/research","id":101},{"publishDate":"2026-04-06","firm":"Knight Frank","title":"Singapore Investment Market Update Q1 2026","summary":"Singapore real estate investment sales hit a record Q1 high of S$15.4 billion \u2014 up 166.5% YoY and 10% QoQ \u2014 driven by a low interest rate environment and key transactions including the injection of Asia Square Tower 1 into a private fund (~S$4.1 billion) and the sale of 78 Shenton Way (~S$615 million). Commercial sector led with S$6.3 billion, while industrial reached S$3.1 billion. Knight Frank maintained its full-year 2026 investment sales forecast at approximately S$30 billion.","sector":"Investment","market":"Singapore","primeYield":null,"primeRent":null,"url":"https://www.knightfrank.com.sg/research","id":102},{"publishDate":"2026-04-07","firm":"Knight Frank","title":"Singapore Office Market Update Q1 2026","summary":"Singapore office rents in the Central Region declined marginally by 0.2% QoQ in Q1 2026 per URA data, though prime Grade A CBD rents continued their recovery with islandwide office vacancy falling to 10.8% \u2014 its fourth consecutive quarter of improvement. Total available shadow space decreased by 2.3% to 422,000 sq ft NLA. The market continues to exhibit a flight-to-quality dynamic with premium Grade A buildings maintaining pricing power.","sector":"Office","market":"Singapore","primeYield":null,"primeRent":"-0.2% QoQ (Central Region); Grade A CBD prime rents rising","url":"https://www.knightfrank.com.sg/research","id":103},{"publishDate":"2026-04-15","firm":"Knight Frank","title":"Singapore Industrial and Logistics Market Update Q1 2026","summary":"Singapore's industrial sector saw property prices grow at a slower pace in Q1 2026, led by multiple-user factories which posted a 1.7% quarterly increase. Demand for higher-specification logistics and warehouse premises remained healthy, underpinned by logistics service providers and e-commerce firms. The sector outlook remains supported by continual investor demand for quality logistics assets and Singapore's attractiveness as a safe investment haven.","sector":"Industrial & Logistics","market":"Singapore","primeYield":null,"primeRent":null,"url":"https://www.knightfrank.com.sg/research","id":104},{"publishDate":"2026-04-15","firm":"Knight Frank","title":"Singapore Retail Market Update Q1 2026","summary":"Islandwide retail occupancy held steady in Q1 2026 despite several high-profile store closures, with vacancies quickly backfilled by new and existing brands. The retail sector continues to benefit from strong household spending, tourism recovery, and the flight of shoppers back to prime malls and street-level retail. Supply constraints continue to underpin rental stability in well-located assets.","sector":"Retail","market":"Singapore","primeYield":null,"primeRent":null,"url":"https://www.knightfrank.com.sg/research","id":105},{"publishDate":"2026-04-15","firm":"Knight Frank","title":"Singapore Residential Market Update Q1 2026","summary":"Private home prices rose at a faster pace in Q1 2026, though overall sales activity softened. Rental prices rebounded marginally from a 0.5% QoQ drop in Q4 2025 to a 0.3% increase in Q1 2026. Executive Condominiums were the standout performer, with transaction volume tripling to approximately 1,500 units, while District 10 median prices surged over 40% driven by large-format freehold resale demand.","sector":"Residential","market":"Singapore","primeYield":null,"primeRent":"+0.3% QoQ residential rents in Q1 2026","url":"https://www.knightfrank.com.sg/research","id":106},{"publishDate":"2026-04-15","firm":"Knight Frank","title":"Singapore Auction Market Update Q1 2026","summary":"Knight Frank's quarterly Singapore Auction Market Update for Q1 2026 reports on the performance of residential and commercial property auctions in Singapore. The report covers auction volumes, hammer rates, and key transactions across both residential and commercial sectors, providing insights into distressed and voluntary auction activity in the current market environment.","sector":"Mixed/Cross-Sector","market":"Singapore","primeYield":null,"primeRent":null,"url":"https://www.knightfrank.com.sg/research","id":107},{"publishDate":"2026-04-01","firm":"Knight Frank","title":"Mixed-use Developments: Conduits to Quality Living \u2014 Singapore","summary":"This Singapore thought leadership report examines how larger mixed-use units are outpacing smaller ones on price growth, and how offices are increasingly choosing to buy rather than lease as part of a broader shift toward the 'Third Place' model that integrates offices, homes and communities under one development. The report reflects evolving tenant and owner preferences for amenity-rich, live-work-play environments.","sector":"Mixed/Cross-Sector","market":"Singapore","primeYield":null,"primeRent":null,"url":"https://www.knightfrank.com.sg/research","id":108},{"publishDate":"2026-05-11","firm":"Knight Frank","title":"Leading Indicators \u2014 May 2026","summary":"Knight Frank's monthly Leading Indicators report tracks key economic and financial metrics impacting property markets across the Asia-Pacific region and globally. Published by Chief Economist Ben Burston, the May 2026 edition covers macro indicators including interest rates, inflation, GDP growth trajectories, and real estate capital flows relevant to investment decision-making across APAC markets.","sector":"Mixed/Cross-Sector","market":"APAC","primeYield":null,"primeRent":null,"url":"https://www.knightfrank.com.sg/research/leading-indicators-may-2026-12844.aspx","id":109},{"publishDate":"2026-04-01","firm":"Knight Frank","title":"Leading Indicators \u2014 April 2026","summary":"Knight Frank's monthly Leading Indicators report for April 2026 tracks key economic and financial metrics impacting property markets globally and across Asia-Pacific. Published by Chief Economist Ben Burston, the report covers macro drivers including interest rate dynamics, inflation trends, GDP growth, and capital flow signals relevant to APAC real estate markets.","sector":"Mixed/Cross-Sector","market":"APAC","primeYield":null,"primeRent":null,"url":"https://www.knightfrank.com.sg/research","id":110},{"publishDate":"2026-04-24","firm":"Knight Frank","title":"The Wealth Report 2026","summary":"Knight Frank's 20th annual Wealth Report finds the global UHNW population reached 713,626 in 2026, with Asia-Pacific holding nearly 31% of the total. Tokyo led the PIRI 100 Prime International Residential Index with a 58.5% surge in prime residential prices in 2025, while Singapore's UHNW population is forecast to grow 46% by 2031 and Brisbane is identified as a next-tier global luxury market driven by the 2032 Olympics infrastructure pipeline. Australia's billionaire population is forecast to grow 77% over five years.","sector":"Residential","market":"APAC","primeYield":null,"primeRent":"Tokyo prime new-build: +58.5% in 2025; Hong Kong prime: -2.1% in 2025; Singapore luxury residential: +7.9% in 2025","url":"https://www.knightfrank.com/research","id":111},{"publishDate":"2026-04-02","firm":"Knight Frank","title":"Data Centres Global Report 2026","summary":"Knight Frank's global data centre report covers the rapidly expanding sector shaped by AI, hyperscale demand, and new financing models. The report forecasts data centre capacity growth of almost 25% over the next two years globally, with over 80% of 2026 APAC capacity already pre-let. Japan has seen the largest-ever data centre financing deal in the country, and the report notes US$15 billion invested in APAC data centres in 2025 alone.","sector":"Data Centre","market":"APAC","primeYield":null,"primeRent":null,"url":"https://www.knightfrank.com/research","id":112},{"publishDate":"2026-05-14","firm":"Knight Frank","title":"Powering Property and Private Capital \u2014 Data Centre AI Infrastructure Analysis","summary":"AI-driven data centre demand is creating one of the most capital-intensive development cycles in real estate history, with the IEA projecting global electricity demand from data centres to more than double to ~950 TWh by 2030. Knight Frank forecasts data centre capacity growth of almost 25% over the next two years, with $1.4\u20131.6 trillion of infrastructure investment required over five years. APAC is a key growth region with Japan, Singapore and Australia among the leading markets.","sector":"Data Centre","market":"APAC","primeYield":null,"primeRent":null,"url":"https://www.knightfrank.co.uk/research/article/2026/5/powering-property-and-private-capital","id":113},{"publishDate":"2026-05-13","firm":"Knight Frank","title":"Asia-Pacific Capital Markets Insights \u2014 Japan Focus Q1 2026","summary":"Japan attracted US$6 billion in inbound capital in Q1 2026 \u2014 43% above the 10-year quarterly average \u2014 driven by tight prime office vacancy and stable leasing demand. Tokyo office rents rose 22% YoY as Grade A vacancy approached near-zero levels, while retail rents rose 8%. Living sector volumes dominated at over 80% of APAC living investment in Q1 2026, and data centre demand is rapidly expanding with over 80% of 2026 capacity already pre-let.","sector":"Investment","market":"Tokyo","primeYield":null,"primeRent":"Tokyo office: +22% YoY; Tokyo retail: +8% YoY","url":"https://lnkd.in/ddJXVR2S","id":114},{"publishDate":"2026-05-13","firm":"Knight Frank","title":"Asia-Pacific Capital Markets Insights \u2014 South Korea Focus Q1 2026","summary":"South Korea ranked third for APAC cross-border investment inflows in Q1 2026, with volumes rising 45.0% year-on-year to US$1.4 billion. Logistics assets accounted for 38.8% of activity, reflecting steady demand and moderating supply, with KKR's acquisition of the Shinsegae Food Hub for US$201.1 million as the headline deal. Office investment is stabilising after meaningful repricing, with domestic Korean capital dominating Seoul office activity.","sector":"Investment","market":"Seoul","primeYield":null,"primeRent":null,"url":"https://lnkd.in/ddJXVR2S","id":115},{"publishDate":"2026-04-24","firm":"Knight Frank","title":"Prime International Residential Index (PIRI 100) \u2014 2025 Annual Results","summary":"The PIRI 100 recorded 3.2% average price growth across 100 tracked luxury markets in 2025, with 73 markets seeing increases. Asia-Pacific averaged 3.6% growth, with Tokyo leading globally at +58.5% driven by yen weakness and prime supply scarcity. Hong Kong recorded a -2.1% annual decline in prime prices, though super-prime activity surged with 81 US$10 million+ transactions in Q4 2025. The report is published as part of The Wealth Report 2026.","sector":"Residential","market":"APAC","primeYield":null,"primeRent":"Tokyo: +58.5%; Hong Kong: -2.1%; APAC average: +3.6% (all in 2025)","url":"https://www.knightfrank.com/research","id":116},{"publishDate":"2026-05-18","firm":"Knight Frank","title":"APAC Prime Residential Markets Diverge \u2014 Wealth Report 2026 Analysis","summary":"Knight Frank analysis published May 2026 highlights widening divergence in APAC prime residential markets. Tokyo led all global luxury markets at +58.5% in 2025, while Greater China markets remained under pressure with Guangzhou down 12.2% and Hong Kong slipping 2.1%. Singapore's UHNW population is forecast to grow 46% by 2031 with luxury residential prices up 7.9% in 2025. Australia's billionaire population is forecast to grow 77% over five years.","sector":"Residential","market":"APAC","primeYield":null,"primeRent":"Tokyo: +58.5%; Singapore luxury residential: +7.9% (2025)","url":"https://realestateasia.com/residential/news/apac-prime-residential-prices-rise-36-winners-and-laggards-diverge","id":117},{"publishDate":"2026-05-05","firm":"Knight Frank","title":"APAC Real Estate Investment Q1 2026 \u2014 Capital Markets Analysis","summary":"APAC real estate investment reached US$64.6 billion in Q1 2026, the strongest quarterly result since Q4 2021, as capital decisively shifted from price discovery to deployment. Cross-border volumes more than doubled YoY to US$22.4 billion, with sovereign wealth funds and institutional investors deploying US$12.8 billion combined (+50% YoY). Japan topped inbound capital attraction at US$6 billion, with Singapore cross-border volumes surging to US$5.7 billion from under US$1 billion a year earlier.","sector":"Investment","market":"APAC","primeYield":null,"primeRent":null,"url":"https://realestateasia.com/commercial-other/in-focus/apac-real-estate-investment-surges-highest-quarterly-level-2021","id":118},{"publishDate":"2026-04-01","firm":"Knight Frank","title":"Australian Horizon Report 2026","summary":"Knight Frank's Australian Horizon Report for 2026 examines the outlook for Australian real estate across residential, commercial and alternative sectors. The report identifies Australia as a stable, mature market for cross-border investors with billionaire wealth forecast to grow 77% over five years. Brisbane is highlighted as a next-tier global luxury market driven by the 2032 Olympics, infrastructure investment, and wealth migration from interstate.","sector":"Mixed/Cross-Sector","market":"Australia","primeYield":null,"primeRent":null,"url":"https://www.knightfrank.com.au/research","id":119},{"publishDate":"2026-05-07","firm":"Knight Frank","title":"Asia-Pacific Q1 2026 Office Highlights \u2014 Australia Focus","summary":"Knight Frank's APAC Office Highlights found Australia and India are leading the regional office recovery, with annual prime net face rent growth in Sydney at 8.6% and Brisbane at 8.2% \u2014 the second and third strongest rates in APAC after Bengaluru and Tokyo respectively. APAC-wide prime net face rents rose 0.8% in Q1 2026, with 18 of 24 monitored cities recording stable or increasing rents despite geopolitical uncertainty.","sector":"Office","market":"Australia","primeYield":null,"primeRent":"Sydney: +8.6% YoY prime net face rent; Brisbane: +8.2% YoY","url":"https://kfmap.asia/research/asia-pacific-q1-2026-office-highlights/4875","id":120},{"publishDate":"2026-05-05","firm":"Knight Frank","title":"Central Leads Hong Kong Island Office Recovery \u2014 Q1 2026","summary":"Premium Central continued to outperform the broader Hong Kong office market with 5.1% QoQ rental growth in Q1 2026, with Traditional Central and Admiralty also rising 5.7% and 2.6% respectively. Finance sector demand \u2014 particularly from traditional securities houses, asset management firms, and Middle Eastern banks \u2014 drove the recovery. Knight Frank expects leasing momentum to strengthen further in Q2 2026, broadening beyond Premium Central to include Traditional Central, Admiralty and Wan Chai.","sector":"Office","market":"Hong Kong","primeYield":null,"primeRent":"Premium Central: +5.1% QoQ; Traditional Central: +5.7% QoQ; Admiralty: +2.6% QoQ","url":"https://realestateasia.com/commercial-office/news/central-leads-hong-kong-island-office-recovery-strong-q1-rent-growth","id":121},{"publishDate":"2026-04-06","firm":"Knight Frank","title":"Singapore Investment Market Q1 2026 \u2014 Record First Quarter","summary":"Singapore logged S$15.4 billion in real estate investment sales in Q1 2026, a new first-quarter record representing a 166.5% YoY and 10% QoQ increase. The strong performance was driven by a low interest rate environment and key deals including Asia Square Tower 1's injection into a private fund (~S$4.1 billion), sale of 78 Shenton Way (~S$615 million), and Bukit Panjang Plaza's divestment (S$428 million). Knight Frank maintained its full-year 2026 forecast at approximately S$30 billion.","sector":"Investment","market":"Singapore","primeYield":null,"primeRent":null,"url":"https://www.businesstimes.com.sg/property/singapore-property-investment-sales-hit-record-s15-4-billion-q1-iran-war-could-derail-momentum","id":122},{"publishDate":"2026-04-09","firm":"Knight Frank","title":"Singapore Investment Market Update Q1 2026 (Full Report)","summary":"Knight Frank Singapore's comprehensive Q1 2026 Investment Market Update reports on investment sales reaching S$15.4 billion \u2014 the highest first-quarter figure on record. Commercial property led all sectors with S$6.3 billion in transactions despite a 17.2% QoQ decline, while industrial activity rose sharply to S$3.1 billion. Outbound investment from Singapore rose 7.8% QoQ to S$10.3 billion as entities sought stable markets and income resilience.","sector":"Investment","market":"Singapore","primeYield":null,"primeRent":null,"url":"https://www.knightfrank.com.sg/research","id":123},{"publishDate":"2026-05-04","firm":"Knight Frank","title":"Australian Retail Review \u2014 April 2026 (Detailed Analysis)","summary":"Australia's retail property sector delivered the strongest total return of all commercial property sectors in 2025 at 9.2% \u2014 the best result since 2017 \u2014 supported by years of subdued development activity and rising tenant turnover. Around A$3.6 billion of retail transactions occurred in Q1 2026. Despite near-term uncertainty from the Middle East conflict, medium-term fundamentals remain supportive given a constrained development pipeline, elevated construction costs, and limited new supply feasibility.","sector":"Retail","market":"Australia","primeYield":null,"primeRent":null,"url":"https://retailworldmagazine.com.au/australian-retail-sector-carries-momentum-into-a-new-period-of-uncertainty/","id":124}];</script>

// Live data fetch from GitHub — overrides the static injected data if successful
(function() {
  var GITHUB_URL = "https://raw.githubusercontent.com/nickchanon/re_apac_research/main/data/publications.json";
  window.__APAC_GITHUB_URL__ = GITHUB_URL;
  // Attempt live fetch; if it succeeds within 3s, replace window.__APAC_DATA__
  // The React app checks window.__APAC_DATA__ after mount, so this races cleanly.
  fetch(GITHUB_URL + "?t=" + Date.now(), { cache: "no-cache" })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (Array.isArray(data) && data.length > 0) {
        window.__APAC_DATA__ = data;
        console.log("[APAC] Live data loaded from GitHub:", data.length, "publications");
        // Dispatch event so React app can re-render if already mounted
        window.dispatchEvent(new CustomEvent("apac-data-updated", { detail: data }));
      }
    })
    .catch(function(e) {
      console.warn("[APAC] GitHub fetch failed, using static data:", e.message);
    });
})();
</script>
