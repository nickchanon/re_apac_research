name: Daily APAC Research Agents

on:
  # Runs at 07:00 BST (06:00 UTC) every weekday morning
  schedule:
    - cron: "0 6 * * 1-5"

  # Also allows manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      agent:
        description: "Run a specific agent (leave blank for all)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - cbre
          - jll
          - savills
          - knightfrank

jobs:
  run-agents:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit publications.json back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openai

      - name: Configure git identity
        run: |
          git config user.name "APAC Research Agent"
          git config user.email "agents@re-apac-research.auto"

      - name: Run CBRE agent
        if: ${{ github.event.inputs.agent == '' || github.event.inputs.agent == 'cbre' }}
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: python agents/cbre_agent.py

      - name: Run JLL agent
        if: ${{ github.event.inputs.agent == '' || github.event.inputs.agent == 'jll' }}
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: python agents/jll_agent.py

      - name: Run Savills agent
        if: ${{ github.event.inputs.agent == '' || github.event.inputs.agent == 'savills' }}
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: python agents/savills_agent.py

      - name: Run Knight Frank agent
        if: ${{ github.event.inputs.agent == '' || github.event.inputs.agent == 'knightfrank' }}
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: python agents/knightfrank_agent.py

      - name: Commit and push any changes
        run: |
          git add data/publications.json
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "[auto] Daily refresh — $(date -u +%Y-%m-%d)" && \
            git push
