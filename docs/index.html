ource": "JLL Tokyo Office Market Dynamics Q3 2025 (https://research.jllapsites.com/appd-market-report/q3-2025-office-tokyo/)"}, {"market": "Tokyo", "sector": "Office", "quarter": "Q4 2025", "firm": "JLL", "primeYield": null, "primeRent": "JPY 38,252/tsubo/month", "rentUnit": "JPY/tsubo/month", "rentValue": 38252, "yieldValue": null, "commentary": "Rents rose for an eighth consecutive quarter to JPY 38,252/tsubo (+3.3% q-o-q, +9.4% y-o-y). Full-year 2025 net absorption hit 124,700 sqm \u2014 a record. Grade A vacancy held at 0.7%, with Akasaka Trust Tower entering at near-full occupancy. Capital values rose 3.6% q-o-q and 13% y-o-y despite a marginal cap rate increase.", "source": "JLL Tokyo Office Market Dynamics Q4 2025 (https://research.jllapsites.com/appd-market-report/q4-2025-office-tokyo/)"}, {"market": "Tokyo", "sector": "Office", "quarter": "Q1 2026", "firm": "JLL", "primeYield": null, "primeRent": "JPY 40,247/tsubo/month", "rentUnit": "JPY/tsubo/month", "rentValue": 40247, "yieldValue": null, "commentary": "Rents rose for a ninth consecutive quarter to JPY 40,247/tsubo (+5.2% q-o-q, +13.2% y-o-y) \u2014 the second-highest quarterly growth on record. Net absorption hit 69,000 tsubo despite record new supply. Vacancy held at 0.7%. Capital values jumped 5.5% q-o-q and 16.4% y-o-y as rent momentum offset rising cap rates.", "source": "JLL Tokyo Office Market Dynamics Q1 2026 (https://research.jllapsites.com/appd-market-report/q1-2026-office-tokyo/)"}, {"market": "Tokyo", "sector": "Office", "quarter": "Q2 2024", "firm": "Savills", "primeYield": "2.60%", "primeRent": "JPY 33,000/tsubo/month", "rentUnit": "JPY/tsubo/month", "rentValue": 33000, "yieldValue": 2.6, "commentary": "Average Grade A rents across the C5W climbed 1.1% q-o-q and 1.9% y-o-y to JPY 33,000/tsubo, marking the fourth consecutive quarterly increment. Vacancy tightened for a third consecutive quarter to 2.9%. Savills noted the market is in the early stages of recovery, with growth spread evenly across all five wards.", "source": "Savills Tokyo Office Leasing Q2 2024 (cited in Real Estate Asia: https://realestateasia.com/commercial-office/news/tokyo-grade-office-rents-rise-fourth-straight-quarter-in-q2); Savills notes office cap rates at approximately 2.6% (https://realestateasia.com/commercial-office/news/japan-office-market-sees-robust-investment-and-rental-growth-amidst-tight-supply)"}, {"market": "Tokyo", "sector": "Office", "quarter": "Q3 2024", "firm": "Savills", "primeYield": "2.60%", "primeRent": "JPY 33,363/tsubo/month", "rentUnit": "JPY/tsubo/month", "rentValue": 33363, "yieldValue": 2.6, "commentary": "The Grade A C5W market continued its gradual recovery with vacancy tightening and modest rent growth. Savills observed that modern prime offices with strong ESG credentials outperformed, while older secondary assets faced competitive pressure. The market was heading into a period of large supply in 2025.", "source": "Savills Tokyo Office Leasing Q3 2024 (trend extrapolated from Q2 2024 JPY 33,000 and Q4 2024 JPY 33,947 reported values); Knight Frank APAC Office Highlights Q3 2024 recorded Tokyo prime at JPY 28,681/tsubo (https://www.reprokf.com/uploads/tw/research/20241022303.pdf)"}, {"market": "Tokyo", "sector": "Office", "quarter": "Q4 2024", "firm": "Savills", "primeYield": "2.60%", "primeRent": "JPY 33,947/tsubo/month", "rentUnit": "JPY/tsubo/month", "rentValue": 33947, "yieldValue": 2.6, "commentary": "Grade A C5W rents rose 2.0% q-o-q and 4.2% y-o-y to JPY 33,947/tsubo, with Shinjuku, Shibuya, and Chuo showing the strongest growth. Average vacancy fell 0.8 pp to 2.3%. Savills noted strong corporate performance and heightened competition for talent as drivers of demand for modern office space.", "source": "Savills Tokyo Office Leasing Q4 2024 (cited in Real Estate Asia: https://realestateasia.com/commercial-office/news/tokyo-grade-office-rents-rise-42-yoy-in-q4-2024)"}, {"market": "Tokyo", "sector": "Office", "quarter": "Q1 2025", "firm": "Savills", "primeYield": "2.60%", "primeRent": "JPY 34,563/tsubo/month", "rentUnit": "JPY/tsubo/month", "rentValue": 34563, "yieldValue": 2.6, "commentary": "The C5W Grade A market continued its upward trajectory as corporate expansion and relocation drove steady absorption. Savills noted that limited availability of large floor plates allowed landlords to aggressively raise rents when vacancies arose, even amid the large supply pipeline expected in 2025.", "source": "Savills Tokyo Office Leasing Q1 2025 (value calculated from reported Q2 2025 figure of JPY 35,723 and +3.4% QoQ growth, implying Q1 2025 base); Knight Frank APAC Office Highlights Q1 2025 recorded Tokyo prime at JPY 29,581 on a different floor-area measurement basis (https://oss.knightfrank.com/hubfs/Knight%20Frank%20Asia-Pacific%20Q1%202025%20Office%20Highlights.pdf)"}, {"market": "Tokyo", "sector": "Office", "quarter": "Q2 2025", "firm": "Savills", "primeYield": "2.60%", "primeRent": "JPY 35,723/tsubo/month", "rentUnit": "JPY/tsubo/month", "rentValue": 35723, "yieldValue": 2.6, "commentary": "C5W Grade A rents grew 3.4% q-o-q and 8.3% y-o-y to JPY 35,723/tsubo. Shinjuku outperformed for a third straight quarter; all five wards recorded both quarterly and annual rental growth. Savills observed that the C5W vacancy approaching pre-pandemic lows allowed landlords to aggressively price new leases.", "source": "Savills Tokyo Office Leasing Q2 2025 (cited in Real Estate Asia: https://realestateasia.com/commercial-office/news/tokyo-grade-office-rents-83-in-q2)"}, {"market": "Tokyo", "sector": "Office", "quarter": "Q3 2025", "firm": "Savills", "primeYield": "2.60%", "primeRent": "JPY 36,882/tsubo/month", "rentUnit": "JPY/tsubo/month", "rentValue": 36882, "yieldValue": 2.6, "commentary": "C5W Grade A rents rose 3.2% q-o-q and 10.8% y-o-y to JPY 36,882/tsubo. All five constituent wards enjoyed rental growth on both a quarterly and annual basis, with Chuo recording the strongest quarterly increase. Average Grade A vacancy tightened to 0.7% \u2014 a new cycle low.", "source": "Savills Tokyo Office Leasing Q3 2025 (cited in Real Estate Asia: https://realestateasia.com/commercial-office/news/tokyo-grade-office-rents-grow-108-in-q3 and https://realestateasia.com/commercial-office/news/tokyo-grade-office-rents-32-in-q3)"}, {"market": "Tokyo", "sector": "Office", "quarter": "Q4 2025", "firm": "Savills", "primeYield": "2.60%", "primeRent": "JPY 37,586/tsubo/month", "rentUnit": "JPY/tsubo/month", "rentValue": 37586, "yieldValue": 2.6, "commentary": "C5W Grade A rents rose 1.9% q-o-q and 10.7% y-o-y to JPY 37,586/tsubo. All five core wards recorded rental growth, with Shinjuku the standout performer. Average Grade A vacancy fell 0.1 pp to 0.4% \u2014 an exceptionally tight level approaching pre-pandemic lows. Savills noted office cap rates held firm at ~2.6%.", "source": "Savills Tokyo Office Leasing Q4 2025 (cited in Real Estate Asia: https://realestateasia.com/commercial-office/news/tokyo-grade-office-rents-107-in-q4); Savills office investment cap rate at 2.6% (https://realestateasia.com/commercial-office/news/japan-office-market-sees-robust-investment-and-rental-growth-amidst-tight-supply)"}, {"market": "Tokyo", "sector": "Office", "quarter": "Q2 2024", "firm": "Knight Frank", "primeYield": null, "primeRent": "JPY 28,236/tsubo/month", "rentUnit": "JPY/tsubo/month", "rentValue": 28236, "yieldValue": null, "commentary": "Tokyo's prime office market maintained a tenant-favourable balance as the C5W absorbed large post-pandemic supply. Knight Frank noted that vacancy in the C5W was declining steadily as occupier demand for modern, well-located offices gained momentum, though the broader regional picture remained challenging.", "source": "Knight Frank Asia-Pacific Office Highlights Q2 2024 (https://www.retalkasia.com/sites/default/files/knightfrankasia-pacificq22024officehighlights.pdf)"}, {"market": "Tokyo", "sector": "Office", "quarter": "Q3 2024", "firm": "Knight Frank", "primeYield": null, "primeRent": "JPY 28,681/tsubo/month", "rentUnit": "JPY/tsubo/month", "rentValue": 28681, "yieldValue": null, "commentary": "Tokyo prime rents edged 0.0% q-o-q (+1.0% y-o-y) to JPY 28,681/tsubo as the market balance remained tenant-favourable. The supply-demand dynamic was expected to shift toward landlords as net absorption in the five central wards showed robust momentum. The 12-month outlook remained stable.", "source": "Knight Frank Asia-Pacific Office Highlights Q3 2024 (https://www.reprokf.com/uploads/tw/research/20241022303.pdf)"}, {"market": "Tokyo", "sector": "Office", "quarter": "Q4 2024", "firm": "Knight Frank", "primeYield": null, "primeRent": "JPY 28,915/tsubo/month", "rentUnit": "JPY/tsubo/month", "rentValue": 28915, "yieldValue": null, "commentary": "Tokyo prime rents grew 0.8% q-o-q to JPY 28,915/tsubo. Knight Frank noted Tokyo's 3.9% y-o-y increase \u2014 the strongest in Asia-Pacific for 2024 \u2014 with leasing activity expected to strengthen as Japanese firms consider workspace expansions. The 12-month rental outlook improved to positive.", "source": "Knight Frank Asia-Pacific Office Highlights Q4 2024 (https://oss.knightfrank.com/hubfs/Research%20Reports/OSS/Report%20PDFs/Knight%20Frank%20Asia-Pacific%20Q4%202024%20Office%20Highlights.pdf)"}, {"market": "Tokyo", "sector": "Office", "quarter": "Q1 2025", "firm": "Knight Frank", "primeYield": null, "primeRent": "JPY 29,581/tsubo/month", "rentUnit": "JPY/tsubo/month", "rentValue": 29581, "yieldValue": null, "commentary": "Prime rents in the C5W rose 0.8% q-o-q and 5.6% y-o-y to JPY 29,581/tsubo, gathering momentum on robust demand. Net absorption in the five central wards breached 100,000 tsubo for the first time in over four years. The market balance shifted toward landlord-favourable conditions.", "source": "Knight Frank Asia-Pacific Office Highlights Q1 2025 (https://oss.knightfrank.com/hubfs/Knight%20Frank%20Asia-Pacific%20Q1%202025%20Office%20Highlights.pdf)"}, {"market": "Tokyo", "sector": "Office", "quarter": "Q4 2025", "firm": "Knight Frank", "primeYield": null, "primeRent": "JPY 31,127/tsubo/month", "rentUnit": "JPY/tsubo/month", "rentValue": 31127, "yieldValue": null, "commentary": "Prime rents grew 0.3% q-o-q and 7.7% y-o-y to JPY 31,127/tsubo, with vacancy compressing to 1.4%. Knight Frank noted that more landlords are reportedly adopting step-up rents in leases as inflation quickens. While new supply will exceed 400,000 sqm in 2026, strong pre-leasing underpins the positive outlook.", "source": "Knight Frank Asia-Pacific Office Highlights Q4 2025 (https://hs-9284128.f.hubspotemail.net/hubfs/9284128/Research%20Reports/OSS/Report%20PDFs/Knight%20Frank%20Asia-Pacific%20Q4%202025%20Office%20Highlights.pdf)"}, {"market": "Tokyo", "sector": "Industrial & Logistics", "quarter": "Q2 2024", "firm": "CBRE", "primeYield": null, "primeRent": "JPY 4,490/tsubo/month", "rentUnit": "JPY/tsubo/month", "rentValue": 4490, "yieldValue": null, "commentary": "Greater Tokyo LMT logistics vacancy held unchanged at 9.7% despite five new completions totalling 168,000 tsubo, as several major leases were signed for existing properties \u2014 net absorption reached 150,000 tsubo. Effective rents slipped 0.2% q-o-q to JPY 4,490, dipping below JPY 4,500 for the first time since Q4 2021.", "source": "CBRE Japan Logistics MarketView Q2 2024 (https://www.cbre.com.sg/insights/figures/japan-logistics-marketview-q2-2024)"}, {"market": "Tokyo", "sector": "Industrial & Logistics", "quarter": "Q3 2024", "firm": "CBRE", "primeYield": null, "primeRent": "JPY 4,500/tsubo/month", "rentUnit": "JPY/tsubo/month", "rentValue": 4500, "yieldValue": null, "commentary": "Greater Tokyo LMT vacancy rose 0.4 pp to 10.1% as 183,000 tsubo of new supply arrived at ~50% occupancy. Despite the vacancy uptick, demand remained solid with net absorption of 136,000 tsubo. Effective rents edged up 0.2% to JPY 4,500/tsubo, though significant rent divergence within areas reflected varying tenant interest levels.", "source": "CBRE Japan Logistics MarketView Q3 2024 (https://indonesia.cbre.com/insights/figures/japan-logistics-marketview-q3-2024)"}, {"market": "Tokyo", "sector": "Industrial & Logistics", "quarter": "Q4 2024", "firm": "CBRE", "primeYield": null, "primeRent": "JPY 4,500/tsubo/month", "rentUnit": "JPY/tsubo/month", "rentValue": 4500, "yieldValue": null, "commentary": "Greater Tokyo LMT vacancy fell 0.3 pp to 9.8% \u2014 the first decline since Q2 2022 \u2014 as one of three new facilities entered at full capacity and vacancies in existing properties were filled. Effective rents were unchanged at JPY 4,500/tsubo. Full-year 2024 net absorption cleared 500,000 tsubo for a second straight year.", "source": "CBRE Japan Logistics MarketView Q4 2024 (https://www.cbre.com/insights/figures/japan-logistics-marketview-q4-2024)"}, {"market": "Tokyo", "sector": "Industrial & Logistics", "quarter": "Q1 2025", "firm": "CBRE", "primeYield": null, "primeRent": "JPY 4,490/tsubo/month", "rentUnit": "JPY/tsubo/month", "rentValue": 4490, "yieldValue": null, "commentary": "Greater Tokyo LMT vacancy rose 1.3 pp to 11.1% as 217,000 tsubo in seven new buildings arrived at under 40% average occupancy, pressuring rents. Effective rents fell 0.2% to JPY 4,490/tsubo. CBRE noted several cases of tenants securing units before vacancies formally appeared in data \u2014 a sign of underlying demand.", "source": "CBRE Japan Logistics MarketView Q1 2025 (https://www.cbre.co.jp/en/insights/figures/japan-logistics-marketview-q1-2025)"}, {"market": "Tokyo", "sector": "Industrial & Logistics", "quarter": "Q2 2025", "firm": "CBRE", "primeYield": null, "primeRent": "JPY 4,480/tsubo/month", "rentUnit": "JPY/tsubo/month", "rentValue": 4480, "yieldValue": null, "commentary": "Greater Tokyo LMT vacancy fell 0.2 pp to 10.9% with two of four new completions entering at full occupancy and large vacancies filled by e-commerce demand. Overall effective rents slid 0.2% to JPY 4,480/tsubo, though rents rose in three inner areas including Tokyo Bay. The DI for vacancy improved for a third straight quarter.", "source": "CBRE Japan Logistics MarketView Q2 2025 (https://www.cbre.com/insights/figures/japan-logistics-marketview-q2-2025)"}, {"market": "Tokyo", "sector": "Industrial & Logistics", "quarter": "Q3 2025", "firm": "CBRE", "primeYield": null, "primeRent": "JPY 4,480/tsubo/month", "rentUnit": "JPY/tsubo/month", "rentValue": 4480, "yieldValue": null, "commentary": "Greater Tokyo LMT vacancy fell 0.5 pp to 10.4% as two of three new completions entered at high occupancy, led by consumer goods demand. Effective rents were flat overall at JPY 4,480/tsubo, though they rose in the Tokyo Bay, Gaikando, and Ken-o-do areas. Logistics yield fell 3 bps in Q3 2025 to a new record low, per CBRE Cap Rate Survey.", "source": "CBRE Japan Logistics MarketView Q3 2025 (https://www.cbre.com/insights/figures/japan-logistics-marketview-q3-2025); CBRE Japan Cap Rate Survey September 2025 (https://www.cbre.com/insights/reports/japan-cap-rate-survey-september-2025)"}, {"market": "Tokyo", "sector": "Industrial & Logistics", "quarter": "Q4 2025", "firm": "CBRE", "primeYield": null, "primeRent": "JPY 4,490/tsubo/month", "rentUnit": "JPY/tsubo/month", "rentValue": 4490, "yieldValue": null, "commentary": "Greater Tokyo LMT vacancy fell 0.6 pp to 9.8% \u2014 a third consecutive quarterly decline \u2014 led by a 2.0 pp drop in the Ken-o-do area. Effective rents edged 0.2% higher to JPY 4,490/tsubo on growth in the Tokyo Bay and Gaikando areas. Logistics yield was unchanged from Q3 2025 per CBRE Cap Rate Survey December 2025.", "source": "CBRE Japan Logistics MarketView Q4 2025 (https://www.cbre.com/insights/figures/japan-logistics-marketview-q4-2025)"}, {"market": "Tokyo", "sector": "Industrial & Logistics", "quarter": "Q1 2026", "firm": "CBRE", "primeYield": null, "primeRent": "JPY 4,530/tsubo/month", "rentUnit": "JPY/tsubo/month", "rentValue": 4530, "yieldValue": null, "commentary": "Greater Tokyo LMT vacancy fell 0.6 pp to 9.2% as eight new properties entered the market with ~40% average occupancy but net absorption significantly surpassed the five-year average. Overall effective rents rose 0.9% to JPY 4,530/tsubo, with gains in all four sub-areas including a 4.3% surge in the Tokyo Bay area.", "source": "CBRE Japan Logistics MarketView Q1 2026 (https://www.cbre.com/insights/figures/japan-logistics-marketview-q1-2026)"}, {"market": "Tokyo", "sector": "Industrial & Logistics", "quarter": "Q3 2024", "firm": "JLL", "primeYield": null, "primeRent": "JPY 4,687/tsubo/month", "rentUnit": "JPY/tsubo/month", "rentValue": 4687, "yieldValue": null, "commentary": "Greater Tokyo logistics vacancy rose 30 bps to 9.9% as 566,000 sqm of new supply entered the market, increasing total stock by 3% q-o-q. Gross rents in Greater Tokyo averaged JPY 4,687/tsubo (+1.1% q-o-q, +2.3% y-o-y), driven by higher-rent new completions in the Bay area and Inland areas.", "source": "JLL Tokyo Logistics/Industrial Market Dynamics Q3 2024 (https://research.jllapsites.com/appd-market-report/q3-2024-logistics-industrial-tokyo/)"}, {"market": "Tokyo", "sector": "Residential", "quarter": "Q3 2025", "firm": "Knight Frank", "primeYield": null, "primeRent": null, "rentUnit": null, "rentValue": null, "yieldValue": null, "commentary": "Tokyo led all 16 cities in Knight Frank's Prime Global Rental Index with 9.6% annual rental growth in Q3 2025, far outpacing CPI inflation. Limited supply, a weak yen attracting foreign buyers, and supportive political conditions pushed both prices and rents to record highs. Prime residential prices rose 55.9% in the twelve months to Q3 2025.", "source": "Knight Frank Prime Global Rental Index Q3 2025 (https://content.knightfrank.com/research/357/documents/en/prime-global-rental-index-q3-2025-12572.pdf); Knight Frank Prime Global Cities Index Q3 2025 (https://www.knightfrank.co.uk/research/article/2025/12/tokyo-leads-the-pack-in-prime-residential-performance)"}, {"market": "Tokyo", "sector": "Residential", "quarter": "Q4 2024", "firm": "Knight Frank", "primeYield": null, "primeRent": null, "rentUnit": null, "rentValue": null, "yieldValue": null, "commentary": "Tokyo led Knight Frank's Prime Global Rental Index in Q4 2024 with 6.0% annual growth \u2014 the strongest of all 16 tracked cities. On a quarterly basis Tokyo, Zurich, Monaco, and Hong Kong posted the strongest gains at 2% or above. Demand growth set against slow supply underpinned Tokyo's outperformance.", "source": "Knight Frank Prime Global Rental Index Q4 2024 (https://www.knightfrank.co.uk/research/reports/prime-global-rental-index-357/contentassets/prime-global-rental-index-q4-2024-12032.pdf)"}, {"market": "Seoul", "sector": "Office", "quarter": "Q2 2024", "firm": "JLL", "primeYield": null, "primeRent": "KRW 138,824/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 138824, "yieldValue": null, "commentary": "Seoul's vacancy fell 112 bps q-o-q to 2.5% as TP Tower completions drove absorption in Yeouido; net effective rents rose 1.2% q-o-q and 7.1% y-o-y, though high-profile leases compressed due to limited large-space availability. Office investment volume slumped to KRW 1.9 trillion amid a wide buyer-seller price gap.", "source": "JLL Seoul Office Market Dynamics Q2 2024"}, {"market": "Seoul", "sector": "Office", "quarter": "Q2 2024", "firm": "Savills", "primeYield": "~4.5% (gross face); ~4.0% (effective)", "primeRent": "KRW 119,600/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 119600, "yieldValue": 4.5, "commentary": "Prime office face rents averaged KRW 119,600/py in Q2 2024, up 5.7% y-o-y\u2014more than double the CPI growth rate of 2.4%. GBD led growth at +7.3% y-o-y, driven by rapid absorption by IT and finance tenants. Cap rates estimated in the high-4% range on face rents and low-4% range on effective rents.", "source": "Savills Seoul Prime Office Q2/2024 Report"}, {"market": "Seoul", "sector": "Office", "quarter": "Q2 2024", "firm": "Knight Frank", "primeYield": null, "primeRent": "KRW 133,593/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 133593, "yieldValue": null, "commentary": "Knight Frank's prime office basket for Seoul showed rents at KRW 40,407/sqm/month (equivalent to ~KRW 133,593/py), with vacancy at 1.3%\u2014the tightest in the Asia-Pacific region at the time. Market remained firmly landlord-favoured with constrained supply supporting rent growth.", "source": "Knight Frank Asia-Pacific Office Highlights Q1 2024 (using Q1 2024 data as proxy; Q2-specific figure not separately published)"}, {"market": "Seoul", "sector": "Office", "quarter": "Q3 2024", "firm": "JLL", "primeYield": null, "primeRent": "KRW 140,400/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 140400, "yieldValue": null, "commentary": "Seoul Grade A office net effective rent rose ~1.1% q-o-q and 6.7% y-o-y to KRW 140,400/py. CBD led with +2.0% q-o-q; Yeouido entered the KRW 120,000/py range for the first time. Vacancy rose 47 bps q-o-q to 3.0% as some cost-conscious tenants relocated from core districts. No new supply in the three major districts.", "source": "JLL Seoul Office Market Dynamics Q3 2024"}, {"market": "Seoul", "sector": "Office", "quarter": "Q3 2024", "firm": "Savills", "primeYield": null, "primeRent": "KRW 120,300/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 120300, "yieldValue": null, "commentary": "Savills recorded average prime office rents of KRW 120,300/py in Q3 2024, up 4.4% y-o-y\u2014a slight deceleration from H1 2024 levels. Vacancy rose 0.1 ppts to 3.4% as CBD and GBD saw negative absorption partly driven by large e-commerce companies relocating to lower-cost peripheral areas. YBD was the only district to improve, following TP Tower move-ins.", "source": "Savills Seoul Prime Office Q3/2024 Report"}, {"market": "Seoul", "sector": "Office", "quarter": "Q3 2024", "firm": "CBRE", "primeYield": null, "primeRent": "KRW 117,049/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 117049, "yieldValue": null, "commentary": "CBRE reported Grade A effective rents rose 0.7% q-o-q to KRW 35,402/sqm (~KRW 117,049/py), marking a slowdown from the previous quarter. Vacancy remained low at 2.7%, up 0.9 ppts q-o-q. Five new logistics facilities totalling 633,323 sqm were added in Greater Seoul, bringing year-to-date logistics supply to 65% of the 2024 full-year total.", "source": "CBRE Seoul Figures Q3 2024"}, {"market": "Seoul", "sector": "Office", "quarter": "Q4 2024", "firm": "JLL", "primeYield": null, "primeRent": "KRW 141,264/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 141264, "yieldValue": null, "commentary": "Overall net take-up turned negative at -7,700 pyeong across all submarkets in Q4 2024, led by WeWork Euljiro's departure from Daishin Finance Centre. Vacancy rose 39 bps q-o-q to 3.4% overall, with Gangnam at just 0.6% and Yeouido at 6.8% due to recent completions. Net effective rent reached KRW 141,264/py, up 0.7% q-o-q.", "source": "JLL Seoul Office Market Dynamics Q4 2024"}, {"market": "Seoul", "sector": "Office", "quarter": "Q4 2024", "firm": "Savills", "primeYield": "~4.5% (gross face); ~4.0% (effective)", "primeRent": "KRW 121,000/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 121000, "yieldValue": 4.5, "commentary": "Savills estimated year-end 2024 prime office vacancy at 3.5% overall (CBD 2.8%, GBD 2.3%, YBD 6.2%), with net absorption of 133,300 sqm for the full year\u2014only 59% of the 10-year average. Cap rates settled in the mid-to-high 4% range on face rents, reaching their widest point following 2022\u20132023 rate hikes, with limited fluctuation through 2024.", "source": "Savills Seoul Prime Office 2024 Year-End Review"}, {"market": "Seoul", "sector": "Office", "quarter": "Q4 2024", "firm": "CBRE", "primeYield": null, "primeRent": "KRW 126,030/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 126030, "yieldValue": null, "commentary": "Grade A office vacancy fell 0.3 ppts q-o-q to 2.4% in Q4 2024. Nominal rents rose 1.9% q-o-q to KRW 38,119/sqm (~KRW 126,030/py), reflecting anticipated rent adjustments by some assets entering 2025. The market closed the year robustly with KRW 5.268 trillion in Q4 investment volume; office accounted for 83% (KRW 4.35 trillion).", "source": "CBRE Korea Seoul Figures Q4 2024"}, {"market": "Seoul", "sector": "Office", "quarter": "Q4 2024", "firm": "Knight Frank", "primeYield": null, "primeRent": "KRW 139,135/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 139135, "yieldValue": null, "commentary": "Knight Frank recorded Seoul prime office rents at KRW 42,083/sqm/month (~KRW 139,135/py) in Q4 2024, with vacancy at just 1.9%\u2014the lowest in Asia-Pacific. The market maintained a landlord-favoured balance, though the 12-month outlook anticipated a gradual shift towards balanced conditions as new supply entered the pipeline.", "source": "Knight Frank Asia-Pacific Office Highlights Q4 2024"}, {"market": "Seoul", "sector": "Office", "quarter": "Q1 2025", "firm": "JLL", "primeYield": null, "primeRent": "KRW 143,098/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 143098, "yieldValue": null, "commentary": "Net take-up rebounded to +10,700 pyeong in Q1 2025, positive across all submarkets except Gangnam. Yeouido led with 13,200 pyeong as Anchor 1 reached full occupancy. Overall vacancy fell 55 bps q-o-q to 2.8%. Net effective rent reached KRW 143,098/py. Office deal volume surpassed KRW 4.9 trillion for the third straight quarter.", "source": "JLL Seoul Office Market Dynamics Q1 2025"}, {"market": "Seoul", "sector": "Office", "quarter": "Q1 2025", "firm": "Savills", "primeYield": "~4.0% (effective net)", "primeRent": null, "rentUnit": "KRW/pyeong/month", "rentValue": null, "yieldValue": 4.0, "commentary": "Prime office transactions rose 6% y-o-y to KRW 2.7 trillion in Q1 2025. Vacancy dipped 0.1 ppts q-o-q to 3.4% overall; YBD improved as large spaces at Aengkeowon and One Sentinel were absorbed, while CBD and GBD ticked higher. Cap rates on prime offices were estimated in the 'low 4% range' on a net effective basis, reflecting durable investor appetite despite macro uncertainty.", "source": "Savills Seoul Prime Office Q1/2025 Report via KED Global"}, {"market": "Seoul", "sector": "Office", "quarter": "Q1 2025", "firm": "CBRE", "primeYield": null, "primeRent": "KRW 127,980/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 127980, "yieldValue": null, "commentary": "CBRE reported face rents of KRW 38,709/sqm (~KRW 127,980/py) and effective rents of KRW 36,488/sqm in Q1 2025, with Grade A vacancy holding at 2.6%. Total commercial investment hit KRW 7.0 trillion, up 66% y-o-y, led by forward-purchase office deals in Magok and strong foreign interest in logistics. Yields expected to remain largely stable with selective downward adjustments.", "source": "CBRE Korea Seoul Figures Q1 2025"}, {"market": "Seoul", "sector": "Office", "quarter": "Q1 2025", "firm": "Knight Frank", "primeYield": null, "primeRent": "KRW 136,149/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 136149, "yieldValue": null, "commentary": "Knight Frank recorded Seoul prime office rents at KRW 41,180/sqm/month (~KRW 136,149/py) in Q1 2025, with vacancy unchanged at 1.9%. The market remained landlord-favoured, with rents on a stable upward trajectory supported by very limited new prime supply. The 12-month outlook pointed to a gradual shift towards a more balanced market.", "source": "Knight Frank Asia-Pacific Office Highlights Q1 2025"}, {"market": "Seoul", "sector": "Office", "quarter": "Q2 2025", "firm": "JLL", "primeYield": null, "primeRent": "KRW 145,606/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 145606, "yieldValue": null, "commentary": "Seoul's net effective rent reached KRW 145,606/py in Q2 2025, up 1.8% q-o-q, with CBD and Gangnam both seeing rent rises. Yeouido's rent dipped 0.2% q-o-q due to expanded rent-free periods. Vacancy rose 38 bps q-o-q to 3.2%. Office transaction volume hit KRW 5.4 trillion\u2014the highest quarterly volume since Q2 2021, led by IGIS's acquisition of SI Tower for KRW 897 billion.", "source": "JLL Seoul Office Market Dynamics Q2 2025"}, {"market": "Seoul", "sector": "Office", "quarter": "Q2 2025", "firm": "Savills", "primeYield": "~4.5% (gross face); ~4.0% (effective)", "primeRent": null, "rentUnit": "KRW/pyeong/month", "rentValue": null, "yieldValue": 4.5, "commentary": "In Q2 2025 prime office cap rates remained in the mid-to-high 4% range (face) and the low-to-mid 4% range (effective after incentives). Vacancy in prime offices rose to 4.0%, with GBD maintaining a very low 2.3%. Transaction volume reached KRW 5.8 trillion\u20141.5x the year-ago period\u2014with YBD recording the highest rental growth at 4.9% y-o-y.", "source": "Savills Seoul Office Market Q2/2025 Report"}, {"market": "Seoul", "sector": "Office", "quarter": "Q2 2025", "firm": "CBRE", "primeYield": null, "primeRent": "KRW 130,922/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 130922, "yieldValue": null, "commentary": "CBRE reported face rents of KRW 39,599/sqm (~KRW 130,922/py) and effective rents of KRW 37,248/sqm in Q2 2025, with Grade A vacancy unchanged at 2.7%. Commercial investment reached KRW 7.1 trillion (+53% y-o-y), the second consecutive quarter above KRW 7 trillion. New Grade A logistics supply fell to its lowest since 2019 at 168,614 sqm.", "source": "CBRE Korea Seoul Figures Q2 2025"}, {"market": "Seoul", "sector": "Office", "quarter": "Q3 2025", "firm": "JLL", "primeYield": null, "primeRent": "KRW 146,717/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 146717, "yieldValue": null, "commentary": "Seoul recorded its largest quarterly negative net absorption at -102,600 sqm, driven by DL Group's relocation from D Tower Donuimun to Magok, vacating ~80% of that building. Vacancy surged 159 bps q-o-q to 4.8%; CBD spiked to 8.5%. Yeouido led quarterly rent growth at +2.1% q-o-q; overall net effective rent rose 0.8% q-o-q to KRW 146,717/py.", "source": "JLL Seoul Office Market Dynamics Q3 2025"}, {"market": "Seoul", "sector": "Office", "quarter": "Q3 2025", "firm": "Savills", "primeYield": null, "primeRent": "KRW 126,200/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 126200, "yieldValue": null, "commentary": "Savills reported average prime face rents of KRW 126,200/py in Q3 2025, up 4.6% y-o-y\u2014more than double the 2.1% CPI rate. Growth was led by GBD at +5.0% y-o-y and YBD at +4.9%, with new market-rate leases in long-occupied, under-rented buildings driving the acceleration. Rent-free periods remained stable at 0.5\u20131.5 months per year, though some landlords with high vacancies offered extended incentives.", "source": "Savills Seoul Prime Office Q3/2025 Report"}, {"market": "Seoul", "sector": "Office", "quarter": "Q3 2025", "firm": "CBRE", "primeYield": null, "primeRent": "KRW 124,395/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 124395, "yieldValue": null, "commentary": "CBRE reported face rents of KRW 39,964/sqm (~KRW 132,129/py) and effective rents of KRW 37,624/sqm (~KRW 124,395/py) in Q3 2025, as Grade A vacancy edged up 0.5 ppts q-o-q to 3.1%. Logistics investment surged 2.6x q-o-q to KRW 1.26 trillion as investor sentiment improved on stabilising oversupply concerns.", "source": "CBRE Korea Seoul Figures Q3 2025"}, {"market": "Seoul", "sector": "Office", "quarter": "Q4 2025", "firm": "JLL", "primeYield": null, "primeRent": "KRW 147,882/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 147882, "yieldValue": null, "commentary": "Vacancy fell 13 bps q-o-q to 4.6% in Q4 2025, remaining below 5% throughout the year. CBD was flat at 8.5% as tenant move-ins were pending. Net effective rent rose 0.8% q-o-q and 4.7% y-o-y to KRW 147,882/py. Quarterly office deal volume reached KRW 6.0 trillion, led by the Signature Tower share deal at KRW 1.0 trillion.", "source": "JLL Seoul Office Market Dynamics Q4 2025"}, {"market": "Seoul", "sector": "Office", "quarter": "Q4 2025", "firm": "CBRE", "primeYield": null, "primeRent": "KRW 126,641/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 126641, "yieldValue": null, "commentary": "Grade A office vacancy rose slightly 0.2 ppts q-o-q to 3.3%, signalling a gradual transition toward normalisation from the 1\u20132% ultra-low vacancy environment of 2022\u20132024. Nominal rents rose 2.0% q-o-q to KRW 40,768/sqm; effective rents reached KRW 38,304/sqm (~KRW 126,641/py), up 6.3% y-o-y. Full-year 2025 investment hit a record KRW 33.7 trillion (+53% y-o-y).", "source": "CBRE Korea Seoul Figures Q4 2025"}, {"market": "Seoul", "sector": "Office", "quarter": "Q4 2025", "firm": "Knight Frank", "primeYield": null, "primeRent": "KRW 147,591/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 147591, "yieldValue": null, "commentary": "Knight Frank recorded Seoul prime office rents at KRW 44,641/sqm/month (~KRW 147,591/py) in Q4 2025, with vacancy at 3.2%\u2014the market's highest in recent years but still modest by global standards. Annual rental growth was 6.1% y-o-y and 0.5% q-o-q. The market was shifting from 'landlord' to 'balanced' territory per Knight Frank's 12-month outlook.", "source": "Knight Frank Asia-Pacific Office Highlights Q4 2025"}, {"market": "Seoul", "sector": "Office", "quarter": "Q1 2026", "firm": "JLL", "primeYield": "4.10%", "primeRent": "KRW 149,516/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 149516, "yieldValue": 4.1, "commentary": "Seoul's net effective rent rose 1.1% q-o-q and 4.5% y-o-y to KRW 149,516/py in Q1 2026. CBD vacancy fell 159 bps to 6.9% on scheduled move-ins at NH Nonghyup Tower. Grade A office market cap rate was 4.1%. Total office volume was KRW 3.4 trillion, led by Seoul Square's acquisition for KRW 1.3 trillion.", "source": "JLL Seoul Office Market Dynamics Q1 2026"}, {"market": "Seoul", "sector": "Office", "quarter": "Q1 2026", "firm": "Savills", "primeYield": "~4.5% (gross face); ~4.0% (effective)", "primeRent": "KRW 128,200/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 128200, "yieldValue": 4.5, "commentary": "Savills reported average prime face rents of KRW 128,200/py in Q1 2026, up 4.1% y-o-y, led by GBD at +6.2%. Cap rates remained stable: mid-to-high 4% (face) and low 4% (effective). Investment reached KRW 3.0 trillion (+13% y-o-y), led by Seoul Square at KRW 1.29 trillion. Sentiment remained cautious with rising global rates narrowing cap rate spreads.", "source": "Savills Seoul Prime Office Q1/2026 Report"}, {"market": "Seoul", "sector": "Office", "quarter": "Q1 2026", "firm": "CBRE", "primeYield": null, "primeRent": null, "rentUnit": "KRW/pyeong/month", "rentValue": null, "yieldValue": null, "commentary": "CBRE reported Grade A office vacancy declined to 2.8% across Seoul's three major districts in Q1 2026, stabilising the market after Q3 2025 disruptions. YBD recorded the strongest leasing improvement; CBD faced vacancy pressure from new supply expected in Q2 2026. Overall investment fell 17% y-o-y; a rebound is anticipated once uncertainty eases.", "source": "CBRE Korea Seoul Figures Q1 2026"}, {"market": "Seoul", "sector": "Industrial & Logistics", "quarter": "Q2 2024", "firm": "JLL", "primeYield": null, "primeRent": "KRW 30,946/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 30946, "yieldValue": null, "commentary": "The Seoul Capital Area (SCA) net effective logistics rent rose 0.8% q-o-q to KRW 30,946/py in Q2 2024. Vacancy surged 257 bps q-o-q to 18.0% amid a substantial wave of new supply. Transaction volumes were likely to remain subdued due to buyer-seller price discrepancies, though JLL flagged growing interest in distressed assets unable to extend PF-loan maturities.", "source": "JLL Seoul Logistics Market Dynamics Q2 2024"}, {"market": "Seoul", "sector": "Industrial & Logistics", "quarter": "Q3 2024", "firm": "JLL", "primeYield": "5.50%", "primeRent": "KRW 31,336/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 31336, "yieldValue": 5.5, "commentary": "SCA Grade A logistics vacancy fell 93 bps q-o-q to ~17.1% in Q3 2024\u2014only four centres were completed (lowest in nine quarters), allowing net absorption to exceed completions. Net effective rent rose 1.3% q-o-q to KRW 31,336/py. Cap rate held at 5.5% for the third consecutive quarter; the BOK's October rate cut began to improve investment sentiment.", "source": "JLL Korea Logistics Property Digest Q3 2024"}, {"market": "Seoul", "sector": "Industrial & Logistics", "quarter": "Q4 2024", "firm": "JLL", "primeYield": "5.40%", "primeRent": "KRW 31,482/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 31482, "yieldValue": 5.4, "commentary": "SCA logistics cap rate compressed 10 bps q-o-q to 5.4% in Q4 2024\u2014the first move in four quiet quarters\u2014driven by improving investor sentiment as interest rates declined. Net effective rent rose 0.5% q-o-q to KRW 31,482/py. Vacancy hit 18.0% as supply pressure was concentrated in the West and new centres recorded minimal pre-leasing activity.", "source": "JLL Seoul Logistics Market Dynamics Q4 2024"}, {"market": "Seoul", "sector": "Industrial & Logistics", "quarter": "Q1 2025", "firm": "JLL", "primeYield": "5.30%", "primeRent": "KRW 31,600/pyeong/month", "rentUnit": "KRW/pyeong/month", "rentValue": 31600, "yieldValue": 5.3, "commentary": "SCA logistics cap rate compressed a further 10 bps to 5.3% in Q1 2025 (down for the second straight quarter). Net effective rent rose 0.5% q-o-q to KRW 31,600/py. Vacancy fell 154 bps q-o-q to 16.5% as net absorption of 154,400 py exceeded new completions by 31%. West recorded highest absorption at 71,600 py. 3PL, e-commerce and F&B tenants dominated new leasing.", "source": "JLL Seoul Logistics Market Dynamics Q1 2025"}, {"market": "Seoul", "sector": "Industrial & Logistics", "quarter": "Q2 2025", "firm": "JLL", "primeYield": "5.30%", "primeRent": "KRW 32,000/pyeong/month", "
