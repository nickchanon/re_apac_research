ver 2025 (back-calculated: Q4 2024 ~$718/sqm). Prime yields ended 2024 at approximately 6.52% (softened ~24 bps y-o-y), with the Q1 2025 report noting yields softened 6 bps q-o-q to 6.58% in Q1. Australian CBD average prime yields rose just 4 bps q-o-q to 6.60% nationally in Q4.", "source": "Knight Frank Melbourne CBD Office State of the Market Q1 2025; CBRE Australian CBD Office Figures Q4 2024"}, {"market": "Australia", "sector": "Office", "quarter": "Q1 2025", "firm": "Knight Frank", "primeYield": "6.58%", "primeRent": "AUD 720/sqm/year", "rentUnit": "AUD/sqm/year (net face, est.)", "rentValue": 720, "yieldValue": 6.58, "commentary": "Prime yields softened 6 bps q-o-q to 6.58% (selective precincts). Prime net effective rents fell 1.0% q-o-q to $381/sqm after prime incentives rose 80 bps to 47.8%. Strong lease enquiry at start of year; 62 briefs came to market in Q1 at an average size of 1,407 sqm. Flight-to-quality trend firmly established.", "source": "Knight Frank Melbourne CBD Office State of the Market Q1 2025 (content.knightfrank.com)"}, {"market": "Australia", "sector": "Office", "quarter": "Q2 2025", "firm": "Knight Frank", "primeYield": "6.70%", "primeRent": "AUD 735/sqm/year", "rentUnit": "AUD/sqm/year (net face)", "rentValue": 735, "yieldValue": 6.7, "commentary": "Melbourne CBD office recorded its strongest quarterly prime rental growth since Q2 2024, with prime net face rents up 2.1% q-o-q to $735/sqm. Growth driven by the Eastern Core where rents surged 6.2% to $972/sqm. Prime incentives fell for the first time since Q1 2023, marginally to 47.7%. Prime yields softened 12 bps q-o-q to 6.70%.", "source": "Knight Frank Melbourne CBD Office Market August 2025; Commo.com.au (July 2025)"}, {"market": "Australia", "sector": "Office", "quarter": "Q3 2025", "firm": "Knight Frank", "primeYield": "6.70%", "primeRent": "AUD 755/sqm/year", "rentUnit": "AUD/sqm/year (net face, est.)", "rentValue": 755, "yieldValue": 6.7, "commentary": "Prime and secondary yields remained flat across Melbourne CBD in Q3 at 6.7% and 7.7% respectively. Most growth concentrated in the East with prime rents averaging $1,010/sqm, up 3.9% q-o-q and 11.1% y-o-y. Prime incentives remained elevated at 47.7%, unchanged over Q3 after falling 0.1% in Q2.", "source": "Knight Frank Melbourne CBD Office State of the Market Q3 2025 (content.knightfrank.com)"}, {"market": "Australia", "sector": "Office", "quarter": "Q4 2025", "firm": "Knight Frank", "primeYield": "6.76%", "primeRent": "AUD 756/sqm/year", "rentUnit": "AUD/sqm/year (net face)", "rentValue": 756, "yieldValue": 6.76, "commentary": "Prime net face rents virtually unchanged q-o-q, up $1/sqm to average $756/sqm; annual growth 5.2%. Incentives averaged 47.6% for prime. Prime yields softened 3 bps q-o-q to 6.76%, secondary yields softened 15 bps to 7.82%. Total market vacancy at 17.9%, forecast to rise to 18.9% in 2026. Eastern Core rents rose 10.4% over 2025.", "source": "Knight Frank Melbourne CBD Office State of the Market Q4 2025 (content.knightfrank.com); Australian Office Indicators Q4 2025"}, {"market": "Australia", "sector": "Office", "quarter": "Q1 2026", "firm": "Knight Frank", "primeYield": "6.89%", "primeRent": "AUD 767/sqm/year", "rentUnit": "AUD/sqm/year (net face)", "rentValue": 767, "yieldValue": 6.89, "commentary": "Melbourne was the outlier among CBD markets in Q1 2026, with prime yields rising to 6.9%. Prime net face rents grew 1.4% q-o-q and 6.6% y-o-y to $767/sqm. Net effective rents grew 6.8% y-o-y. Incentives steady at 47.7%. Flight-to-quality persists; Eastern Core and East have seen 16.1% net effective rent growth over the past year.", "source": "Knight Frank Australian Office Indicators Q1 2026 (content.knightfrank.com)"}, {"market": "Australia", "sector": "Office", "quarter": "Q4 2025", "firm": "JLL", "primeYield": "6.03% (est., stable)", "primeRent": "AUD 1,540/sqm/year", "rentUnit": "AUD/sqm/year (net face, Core)", "rentValue": 1540, "yieldValue": 6.03, "commentary": "Sydney CBD Core prime net face rents grew 1.5% over Q4 2025 and 6.5% over the year to average AUD 1,540/sqm p.a. Prime incentives reduced marginally to 32.8%. Prime yields were unchanged over the quarter in the CBD market; compression expected to commence in 2026. Strong absorption with eighth straight quarter of positive demand.", "source": "JLL Sydney Office Market Dynamics Q4 2025 (research.jllapsites.com)"}, {"market": "Australia", "sector": "Office", "quarter": "Q1 2026", "firm": "JLL", "primeYield": "5.70% (est., Core)", "primeRent": "AUD 1,540/sqm/year", "rentUnit": "AUD/sqm/year (net face)", "rentValue": 1540, "yieldValue": 5.7, "commentary": "Sydney office prime gross effective rents grew 3.9% over Q1 2026, driven by high-quality stock in the Sydney CBD as tenants look to upgrade. Vacancy rate remained flat at 21.5% (all-Sydney). Prime yields compressed in the Sydney CBD Core driven by sales evidence of best-in-class stock; yield estimated ~5.70% for Core. Non-CBD yield profile unchanged. KF confirmed 5.70% yield for Sydney in Q1 2026.", "source": "JLL Sydney Office Market Dynamics Q1 2026 (research.jllapsites.com; jll.com)"}, {"market": "Australia", "sector": "Office", "quarter": "Q3 2024", "firm": "CBRE", "primeYield": "6.71%", "primeRent": "AUD 1,467/sqm/year", "rentUnit": "AUD/sqm/year (net face, est.)", "rentValue": 1467, "yieldValue": 6.71, "commentary": "Prime yields softened 12 bps in Q3 2024 nationally; Sydney CBD approaching trough. Cap rates increased marginally in Q3, but appear to be nearing their peak. Despite continued face rental growth, increases to incentives in vacancy-challenged precincts resulted in CBD average net effective rental rate declining in Q3. Net absorption strongest quarterly result since Q2 2015 at 53,600 sqm.", "source": "CBRE Australian Office Figures Q3 2024; CBRE Sydney CBD Office Figures Q3 2024 (cbre.com.au)"}, {"market": "Australia", "sector": "Office", "quarter": "Q2 2025", "firm": "CBRE", "primeYield": "6.68%", "primeRent": "AUD 1,497/sqm/year", "rentUnit": "AUD/sqm/year (net face, est.)", "rentValue": 1497, "yieldValue": 6.68, "commentary": "Australian CBD prime effective rents climbed 1.2% q-o-q and 5.1% y-o-y in Q2 2025. Prime yields relatively stable across most Australian CBD markets in Q2. Sydney CBD average prime rent ~$1,249/sqm (all precincts) to $1,538/sqm (Core). National average effective rent growing steadily. Sublease vacancy rates declined; face rents continuing upward trajectory. Note: CBRE yield figures represent national CBD weighted average; Sydney Core prime yield lower (approx. 5.88%\u20136.03% per Q1 2024 data).", "source": "CBRE Australian CBD Office Figures Q2 2025 (cbre.com.au)"}, {"market": "Australia", "sector": "Industrial & Logistics", "quarter": "Q2 2024", "firm": "Savills", "primeYield": "5.30%", "primeRent": "AUD 155/sqm/year", "rentUnit": "AUD/sqm/year (net face, blended)", "rentValue": 155, "yieldValue": 5.3, "commentary": "Average prime net face rents in Melbourne industrial were broadly stable. Prime market yields held at 5.3% for prime and 6.0% for secondary. In Melbourne West, rents held steady; Melbourne East fringe saw 13.4% q-o-q growth but from a small base. Vacancy rose from 2.7% in March to 3.0% in July 2024 as new supply entered the market.", "source": "Savills Industrial Shed Briefing July 2024 (propertymarkets.news)"}, {"market": "Australia", "sector": "Industrial & Logistics", "quarter": "Q3 2024", "firm": "Savills", "primeYield": "5.30%", "primeRent": "AUD 155/sqm/year", "rentUnit": "AUD/sqm/year (net face, blended)", "rentValue": 155, "yieldValue": 5.3, "commentary": "Melbourne West, Melbourne West and Brisbane Southside average prime net face rents remained unchanged in Q3 2024. Market yields stable at 5.3% for prime, 6.0% secondary. Blended year-on-year growth of 10.2% y-o-y as per Savills. Incentive stabilisation aids investor confidence and preserves reversionary value accumulated over the prior three years.", "source": "Savills Industrial Shed Briefing Q3 2024 (theindustrialist.com.au)"}, {"market": "Australia", "sector": "Industrial & Logistics", "quarter": "Q4 2024", "firm": "Knight Frank", "primeYield": "5.58%", "primeRent": "AUD 144/sqm/year", "rentUnit": "AUD/sqm/year (net face, blended excl. Fringe)", "rentValue": 144, "yieldValue": 5.58, "commentary": "Prime yields held firm in Q4 2024 at 5.58% for Melbourne (blended across precincts). Prime net face rents averaged $144/sqm (excl. Fringe); 6.7% net face rental growth y-o-y. Southeast ($139/sqm) and North ($138/sqm) ahead of West ($132/sqm). Effective rents at $121/sqm; incentives rising, averaging 19.5% in West Melbourne.", "source": "Knight Frank Australian Industrial Review Q1 2025 (content.knightfrank.com) \u2014 data for Q4 2024"}, {"market": "Australia", "sector": "Industrial & Logistics", "quarter": "Q1 2025", "firm": "Knight Frank", "primeYield": "5.58%", "primeRent": "AUD 145/sqm/year", "rentUnit": "AUD/sqm/year (net face, blended)", "rentValue": 145, "yieldValue": 5.58, "commentary": "Prime net face rents rose 0.7% q-o-q to average $145/sqm. Prime incentives rose 1.4% q-o-q to 17.5% on average. Prime and secondary yields remained flat q-o-q at 5.6% (5.58%) and 6.3%. Southeast the only precinct with prime rental growth in Q1 (+3.6% to $144/sqm). West rents flat at $132/sqm. JLL noted national prime net face rents increased 2.6% q-o-q to AUD 209/sqm nationally in Q1.", "source": "Knight Frank Melbourne Industrial State of the Market Q1 2025 (content.knightfrank.com)"}, {"market": "Australia", "sector": "Industrial & Logistics", "quarter": "Q1 2025", "firm": "CBRE", "primeYield": "5.50%", "primeRent": "AUD 255/sqm/year", "rentUnit": "AUD/sqm/year (net face, Outer West Sydney)", "rentValue": 255, "yieldValue": 5.5, "commentary": "Outer West Sydney prime net face rents rose 3.5% q-o-q and 7.1% y-o-y to $255/sqm in Q1 2025. Super prime and prime midpoint yields tightened 13 bps q-o-q to 5.3% and 5.5% respectively. Positive rental growth recorded over the quarter, albeit at a slower pace. Nationally, super prime net face rents up 4.9% y-o-y.", "source": "CBRE Sydney Industrial and Logistics Q1 2025; Dexus Australian Real Asset Review Q2 2025"}, {"market": "Australia", "sector": "Industrial & Logistics", "quarter": "Q2 2025", "firm": "CBRE", "primeYield": "5.50%", "primeRent": "AUD 255/sqm/year", "rentUnit": "AUD/sqm/year (net face, est.)", "rentValue": 255, "yieldValue": 5.5, "commentary": "Prime midpoint yields unchanged q-o-q at 5.5% in Q2 2025; super prime midpoint yields tightened 8 bps to 5.25%. Rental growth edged higher with super prime grade net face rents up 6% y-o-y, though on a net effective basis declined due to rising incentives. Sydney was the only market to record prime yield compression nationally this quarter.", "source": "CBRE Figures Sydney Industrial and Logistics Q2 2025 (cbre.com.au)"}, {"market": "Australia", "sector": "Industrial & Logistics", "quarter": "Q3 2025", "firm": "Knight Frank", "primeYield": "5.58%", "primeRent": "AUD 151/sqm/year", "rentUnit": "AUD/sqm/year (net face, blended)", "rentValue": 151, "yieldValue": 5.58, "commentary": "Prime net face rents rose 2.7% q-o-q to $151/sqm, having increased 5.6% over 2025 YTD. Prime incentives averaged 20.0% across all precincts, highest in the West at 26.4%. Prime industrial yields remained flat at 5.58% for seven consecutive quarters. CBRE confirmed yields held stable across all grades and precincts in Q3 2025 for Melbourne. Net effective rents declined 1.9% due to rising incentives.", "source": "Knight Frank Melbourne Industrial State of the Market Q3 2025 (content.knightfrank.com); CBRE Melbourne Industrial Q3 2025"}, {"market": "Australia", "sector": "Industrial & Logistics", "quarter": "Q3 2025", "firm": "CBRE", "primeYield": "5.50%", "primeRent": "AUD 255/sqm/year", "rentUnit": "AUD/sqm/year (net face, est.)", "rentValue": 255, "yieldValue": 5.5, "commentary": "Positive rental growth recorded over Q3, albeit at a slower pace. Super prime net face rents up 4.8% y-o-y. Super prime midpoint yields tightened 6 bps q-o-q to 5.19%; prime and secondary midpoint yields unchanged at 5.5% and 5.81% respectively. National average midpoint yield for super prime grade assets compressed to 5.7%.", "source": "CBRE Sydney Industrial and Logistics Q3 2025 (cbre.com.au)"}, {"market": "Australia", "sector": "Industrial & Logistics", "quarter": "Q4 2025", "firm": "JLL", "primeYield": "5.50% (est., tightening)", "primeRent": "AUD 255/sqm/year", "rentUnit": "AUD/sqm/year (net face, est.)", "rentValue": 255, "yieldValue": 5.5, "commentary": "Average prime net face rents remained broadly unchanged across all precincts in Q4 2025, limited by the volume of executed leasing deals. Yields tightening in Sydney; yield compression cycle commenced in H1 2025 and continued. Moderate rental growth of 2.5%\u20133.0% expected over next 12 months. Transaction volumes dipped q-o-q but investor demand remains positive.", "source": "JLL Sydney Industrial and Logistics Market Q4 2025 (research.jllapsites.com)"}, {"market": "Australia", "sector": "Industrial & Logistics", "quarter": "Q4 2025", "firm": "CBRE", "primeYield": "5.66%", "primeRent": "AUD 258/sqm/year", "rentUnit": "AUD/sqm/year (net face, est.)", "rentValue": 258, "yieldValue": 5.66, "commentary": "National average midpoint yield for super prime grade assets marginally compressed to 5.66% in Q4 2025, with yield compression recorded in most markets. Gross take-up in 2025 exceeded the 2024 level by just over 10%, supported by strong leasing activity in Sydney and Adelaide markets. Incentives remained elevated at ~17\u201318%.", "source": "CBRE Australia Industrial and Logistics Figures Q4 2025 (cbre.com.au)"}, {"market": "Australia", "sector": "Industrial & Logistics", "quarter": "Q1 2026", "firm": "Knight Frank", "primeYield": "5.85%", "primeRent": "AUD 153/sqm/year", "rentUnit": "AUD/sqm/year (net face, blended)", "rentValue": 153, "yieldValue": 5.85, "commentary": "Prime industrial yields softened 25 bps in Q1 2026 to average 5.85% \u2014 prime yields soften for the first time since Q2 2024 in Melbourne, attributed to RBA rate rises in Q1 and anticipated further rises. Annual prime rental growth 5.5% to $153/sqm (blended including fringe). Southeast sub-precinct yields among the tightest at 3.88% despite softening 38 bps. Prime capital values steady at $2,621/sqm.", "source": "Knight Frank Melbourne Industrial State of the Market Q1 2026; Knight Frank Australian Industrial Review Q1 2026 (content.knightfrank.com)"}, {"market": "Australia", "sector": "Industrial & Logistics", "quarter": "Q1 2025", "firm": "JLL", "primeYield": "5.77%", "primeRent": "AUD 209/sqm/year", "rentUnit": "AUD/sqm/year (net face, national weighted avg)", "rentValue": 209, "yieldValue": 5.77, "commentary": "Five of Sydney's six tracked precincts experienced tightening average prime midpoint yields in Q1 2025; national weighted prime midpoint yield compressed 6 bps to 5.77%. National prime average weighted net face rents increased 2.6% q-o-q to AUD 209/sqm p.a. Annual growth slowed to 7.6%, lowest since Q4 2021. National prime net face rents expected to increase 4.2% in 2025 and 3.1% in 2026.", "source": "JLL Australia Industrial National Overview Q1 2025 (theindustrialist.com.au)"}, {"market": "Australia", "sector": "Industrial & Logistics", "quarter": "Q2 2025", "firm": "Knight Frank", "primeYield": "5.58%", "primeRent": "AUD 147/sqm/year", "rentUnit": "AUD/sqm/year (net face, blended)", "rentValue": 147, "yieldValue": 5.58, "commentary": "Prime net face rents rose 0.9% q-o-q to $147/sqm; secondary rents up 1.0% to $122/sqm. Prime incentives rose for the third consecutive quarter, up 1.0% to average 18.5%. Prime and secondary yields remained flat q-o-q at 5.6% and 6.3% respectively. CBRE's national super prime yield compressed to 5.85% nationally as only Sydney recorded yield compression.", "source": "Knight Frank Melbourne Industrial State of the Market Q2 2025 (content.knightfrank.com)"}, {"market": "Australia", "sector": "Industrial & Logistics", "quarter": "Q4 2025", "firm": "Knight Frank", "primeYield": "5.58%", "primeRent": "AUD 151/sqm/year", "rentUnit": "AUD/sqm/year (net face, blended)", "rentValue": 151, "yieldValue": 5.58, "commentary": "Prime net face rents remained flat q-o-q averaging $151/sqm but rose 4.4% y-o-y. Prime incentives remain elevated at 20.3%\u2014their highest level since Q3 2017. Prime industrial yields remained flat at 5.6% for the seventh consecutive quarter. National average midpoint yield for super prime assets compressed to 5.66% nationally per CBRE. Capital values average $2,700/sqm, up 4.4% y-o-y.", "source": "Knight Frank Melbourne Industrial State of the Market Q4 2025 (content.knightfrank.com)"}, {"market": "Australia", "sector": "Industrial & Logistics", "quarter": "Q2 2024", "firm": "CBRE", "primeYield": "5.90%", "primeRent": "AUD 140/sqm/year", "rentUnit": "AUD/sqm/year (net face, est.)", "rentValue": 140, "yieldValue": 5.9, "commentary": "Australia industrial and logistics Q4 2024 report notes national average midpoint yield for super prime grade at 5.9%. Melbourne prime yields held around 5.58% through to Q4 (Knight Frank) and 5.3% (Savills blended). Back-calculating from Q4 2024 confirmed values and known rental growth of 6.7% y-o-y by Q4, Q2 2024 Melbourne was approximately $135\u2013140/sqm.", "source": "CBRE Australia Industrial and Logistics Figures Q4 2024; CBRE Australian Market Comparisons (NZ Outlook 2025)"}, {"market": "Australia", "sector": "Office", "quarter": "Q2 2024", "firm": "CBRE", "primeYield": "6.68%", "primeRent": "AUD 1,449/sqm/year", "rentUnit": "AUD/sqm/year (net face, est. from Q1 2024 base)", "rentValue": 1449, "yieldValue": 6.68, "commentary": "Australian CBD average prime yields softened by 8 bps in Q1 2024 to average 6.68% (Sydney core 5.88% in Q1 2024 from Scribd data); national yields 6.63% by Q2 2024. Sydney CBD Core net face rent at $1,449/sqm in Q1 2024. National weighted average prime yield for Q2 2024 was 6.63% per Colliers. Positive effective rental growth of 1.0% in Q2 2024\u2014strongest since Q3 2023. Note: CBRE yield figures represent national CBD weighted average; Sydney Core prime yield lower (approx. 5.88%\u20136.03% per Q1 2024 data).", "source": "CBRE/Colliers Australian CBD Office Q1 2024 (Scribd); CBRE Australian CBD Office Figures Q1 2025"}, {"market": "Australia", "sector": "Office", "quarter": "Q4 2024", "firm": "CBRE", "primeYield": "6.60%", "primeRent": "AUD 1,479/sqm/year", "rentUnit": "AUD/sqm/year (net face, est.)", "rentValue": 1479, "yieldValue": 6.6, "commentary": "Australian CBD prime average effective rent increased 0.7% q-o-q and 5.5% y-o-y in Q4 2024. National CBD average prime yields rose just 4 bps q-o-q to 6.60% in Q4\u2014prime yields starting to stabilise off recent transactions. Sydney market entering improved sentiment phase. Cap rates neared their peak according to CBRE research.", "source": "CBRE Australian CBD Office Figures Q4 2024 (cbre.com.au)"}, {"market": "Australia", "sector": "Office", "quarter": "Q1 2025", "firm": "CBRE", "primeYield": "6.68%", "primeRent": "AUD 1,488/sqm/year", "rentUnit": "AUD/sqm/year (net face, est.)", "rentValue": 1488, "yieldValue": 6.68, "commentary": "Australian CBD average prime yields softened by 8 bps in Q1 2024 to average 6.68% (national). Average effective rent for prime Australian CBD office rose 0.4% q-o-q and 4.9% y-o-y in Q1 2025. The national average cap rate has softened 176 bps from peak of mid-2022. National effective rent national average at $624/sqm by Q3 2025 (up from lower base). Note: CBRE yield figures represent national CBD weighted average; Sydney Core prime yield lower (approx. 5.88%\u20136.03% per Q1 2024 data).", "source": "CBRE Australian CBD Office Figures Q1 2025 (cbre.com.au)"}, {"market": "Australia", "sector": "Office", "quarter": "Q3 2025", "firm": "CBRE", "primeYield": "6.68%", "primeRent": "AUD 1,508/sqm/year", "rentUnit": "AUD/sqm/year (net face, est.)", "rentValue": 1508, "yieldValue": 6.68, "commentary": "Australian CBD average prime yields tightened 3 bps in Q3 2025 to average 6.68%\u2014the first indication of tightening cap rates since early 2022 for the Australian office market. Average effective rent for prime Australian CBD office rose 2.3% q-o-q and 4.8% y-o-y. National average effective rent $624/sqm now above the previous peak of December 2019. Note: CBRE yield figures represent national CBD weighted average; Sydney Core prime yield lower (approx. 5.88%\u20136.03% per Q1 2024 data).", "source": "CBRE Australian CBD Office Figures Q3 2025 (cbre.com.au)"}, {"market": "Australia", "sector": "Industrial & Logistics", "quarter": "Q4 2024", "firm": "CBRE", "primeYield": "5.90%", "primeRent": "AUD 250/sqm/year", "rentUnit": "AUD/sqm/year (net face, super prime, est.)", "rentValue": 250, "yieldValue": 5.9, "commentary": "National average midpoint yield for super prime grade assets stands at 5.9% in Q4 2024. Sydney was the only market to record rental growth over Q4 2024. Super prime, prime and secondary net face rents (supply-weighted) increased by 8%, 6% and 7% respectively for CY2024. Incentives rose 6% over the year for super prime. Super prime rents ~$250/sqm in outer west, higher in South Sydney.", "source": "CBRE Australia Industrial and Logistics Figures Q4 2024 (cbre.ca; cbre.com.au)"}, {"market": "Australia", "sector": "Industrial & Logistics", "quarter": "Q4 2024", "firm": "Savills", "primeYield": "5.30%", "primeRent": "AUD 144/sqm/year", "rentUnit": "AUD/sqm/year (net face, blended)", "rentValue": 144, "yieldValue": 5.3, "commentary": "Melbourne prime industrial yields held at 5.3% for prime in Q4 per Savills shedding analysis. Average prime net face rents averaged approximately $144/sqm consistent with Knight Frank data. Incentives rose, vacancy stable at ~3.09% in Melbourne heading into year-end. Market rebalancing as rental growth moderates from cycle highs.", "source": "Savills Industrial Shed Briefing Q4 2024 (propertycouncil.com.au)"}, {"market": "Hong Kong", "sector": "Office", "quarter": "Q2 2024", "firm": "Knight Frank", "primeYield": null, "primeRent": "HKD 93/sqft/month", "rentUnit": "HKD/sqft/month", "rentValue": 93.0, "yieldValue": null, "commentary": "Hong Kong SAR prime office rent (Central equivalent) fell further amid weak leasing momentum. Recentralisation and flight-to-quality moves by occupiers were the key themes, as vacancy reached 12.0% market-wide. Beijing, Shanghai, Hong Kong and Guangzhou were the worst performers in the region with YoY rent declines of 8.8\u201311.1%.", "source": "Knight Frank Asia Pacific Q2 2024 Office Highlights"}, {"market": "Hong Kong", "sector": "Office", "quarter": "Q2 2024", "firm": "CBRE", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Citywide Grade A office vacancy reached 16.9% in H1 2024. Central vacancy rose to 14.0% \u2014 the first time since June 2004 that Central vacancy exceeded 14%. Overall rents fell 1.6% QoQ in Q2 2024 (accelerating from -0.6% in Q1), with Central rents falling least at -0.5% QoQ. Rents expected to fall a further 5\u201310% for the full year.", "source": "CBRE Hong Kong H1 2024 Market Review"}, {"market": "Hong Kong", "sector": "Office", "quarter": "Q3 2024", "firm": "Knight Frank", "primeYield": null, "primeRent": "HKD 91.3/sqft/month", "rentUnit": "HKD/sqft/month", "rentValue": 91.3, "yieldValue": null, "commentary": "Prime Grade A office rent (Central, Hong Kong Island) stood at HKD 91.3 psf/month in Q3 2024, with vacancy at 14.4%. Rents continued to decline amid weak leasing momentum; backfill spaces from recentralisation and flight-to-quality moves kept overall sentiment downbeat.", "source": "Knight Frank Asia Pacific Q3 2024 Office Highlights"}, {"market": "Hong Kong", "sector": "Office", "quarter": "Q3 2024", "firm": "CBRE", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Overall Grade A office rents declined 2.6% QoQ in Q3 2024, the 21st consecutive quarter of decline, bringing the YTD fall to -4.7%. Greater Central rents dropped 2.8% QoQ due to vacancy pressure from new stock; Kowloon East rents fell 4.7% QoQ, the sharpest drop since Q3 2020. Central vacancy eased marginally to 13.1% from 13.3% at end-June.", "source": "CBRE Hong Kong Q3 2024 Market Review"}, {"market": "Hong Kong", "sector": "Office", "quarter": "Q4 2024", "firm": "Knight Frank", "primeYield": null, "primeRent": "HKD 90.5/sqft/month", "rentUnit": "HKD/sqft/month", "rentValue": 90.5, "yieldValue": null, "commentary": "Prime Grade A office rent (Central, Hong Kong Island) at HKD 90.5 psf/month in Q4 2024. Vacancy was 13.6% market-wide. Overall Grade A rents declined 7.9% for full-year 2024. Central's vacancy rose significantly due to new supply completions.", "source": "Knight Frank Asia Pacific Q4 2024 Office Highlights"}, {"market": "Hong Kong", "sector": "Office", "quarter": "Q4 2024", "firm": "JLL", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Overall Grade A office vacancy rose to 13.1% in 2024, a 25-year high. Market-wide rents declined 8.6% for full year, with Central experiencing a 12.0% drop due to competition from new supply. JLL expected overall rents to decline a further 5\u201310% in 2025. High Street retail rents increased 1.3% for the year while Prime shopping centre rents decreased 2.3%.", "source": "JLL Hong Kong Real Estate Market Outlook 2025"}, {"market": "Hong Kong", "sector": "Office", "quarter": "Q4 2024", "firm": "Savills", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Overall Grade A office rents fell 7.9% in full-year 2024, with a forecasted further 9% decline in 2025. High-street shop rents rose 3.1% in 2024. Warehouse rents fell 5.5% for the year. Savills expected rents to drop further by 5\u201310% in 2025. Vacancy remained elevated market-wide.", "source": "Savills Hong Kong Research Market Update Q4 2024"}, {"market": "Hong Kong", "sector": "Office", "quarter": "Q1 2025", "firm": "Knight Frank", "primeYield": null, "primeRent": "HKD 89.9/sqft/month", "rentUnit": "HKD/sqft/month", "rentValue": 89.9, "yieldValue": null, "commentary": "Prime Grade A office rent (Central, Hong Kong Island) at HKD 89.9 psf/month in Q1 2025, with vacancy at 13.6%. Prime rents fell 0.9% QoQ in Q1 2025, a steeper decline than the 0.4% drop in Q4 2024. The market continued to grapple with ample supply pipeline while demand remained concentrated in premium-grade buildings.", "source": "Knight Frank Asia Pacific Q1 2025 Office Highlights"}, {"market": "Hong Kong", "sector": "Office", "quarter": "Q1 2025", "firm": "JLL", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Overall Grade A office vacancy rose to 13.7% in Q1 2025, with Kowloon East increasing to 21.3%. Rents declined 1.3% QoQ overall, with Hong Kong East recording the steepest drop at -3.4%. Core districts Central and Tsimshatsui saw modest improvements in occupancy. JLL maintained a -5% to -10% full-year 2025 rent forecast.", "source": "JLL Hong Kong Q1 2025 Preliminary Market Summary"}, {"market": "Hong Kong", "sector": "Office", "quarter": "Q2 2025", "firm": "Knight Frank", "primeYield": null, "primeRent": "HKD 86.5/sqft/month", "rentUnit": "HKD/sqft/month", "rentValue": 86.5, "yieldValue": null, "commentary": "Overall Central net effective rent stood at HKD 86.5 psf/month in Q2 2025, down 1.3% QoQ and 6.9% YoY. Premium Central commanded HKD 101.1 psf/month (-0.7% QoQ, -6.6% YoY). Vacancy in Central was 13.5%. Jane Street's significant pre-commitment at Harbourfront Site 3 (223,000 sq ft) was a positive signal for Central landlords. Flight-to-quality remains the dominant theme.", "source": "Knight Frank Hong Kong Market Report Q2 2025"}, {"market": "Hong Kong", "sector": "Office", "quarter": "Q2 2025", "firm": "CBRE", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Overall vacancy fell marginally by 0.1 ppt to 17.4% in Q2 2025. Overall rents dropped 0.6% QoQ and 2.8% YTD. Rents in Central remained stable QoQ \u2014 the only major submarket without a decline in Q2. Greater Central reported 155,400 sq ft net absorption, strongest half-year total since H2 2015, supported by major pre-commitment from Jane Street. Industrial warehouse vacancy rose to 10.3%.", "source": "CBRE Hong Kong H1 2025 Market Review"}, {"market": "Hong Kong", "sector": "Office", "quarter": "Q3 2025", "firm": "Knight Frank", "primeYield": null, "primeRent": "HKD 85.7/sqft/month", "rentUnit": "HKD/sqft/month", "rentValue": 85.7, "yieldValue": null, "commentary": "Overall Central net effective rent was HKD 85.7 psf/month in Q3 2025, down 1.0% QoQ and 5.9% YoY. Premium Central held at HKD 101.3 psf/month (+0.2% QoQ). Total Grade A vacancy stood at 14.5% with take-up of +311,437 sq ft. Financial sector demand for premium Central Grade A drove positive absorption; non-core offices faced heightened competitive pressure.", "source": "Knight Frank Hong Kong Market Report Q3 2025"}, {"market": "Hong Kong", "sector": "Office", "quarter": "Q3 2025", "firm": "CBRE", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Citywide net absorption reached 691,800 sq ft in Q3 2025, the highest quarterly total since Q3 2018, with all major submarkets recording positive absorption for the first time since Q2 2015. Vacancy fell 0.3 ppt to 17.1%, the largest quarterly decline since Q3 2018. Rents declined 0.7% QoQ overall (YTD -3.4%), though Greater Tsim Sha Tsui rents held firm. Warehouse vacancy rose to a record 11.8%.", "source": "CBRE Hong Kong Q3 2025 Market Review"}, {"market": "Hong Kong", "sector": "Office", "quarter": "Q3 2025", "firm": "JLL", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Total net absorption rebounded 137.5% QoQ to 646,000 sq ft in Q3 2025. Overall office vacancy declined from 13.6% in June to 13.4% in September. Central and Kowloon East vacancy rates fell 0.8 ppt each. Overall office rents declined 0.8% QoQ; Central rents fell only 0.3%. Industrial prime warehouse rents declined 2.1% in Q3 2025 (after -2.4% in Q2); vacancy rose to 9.3%.", "source": "JLL Hong Kong Q3 2025 Preliminary Market Summary"}, {"market": "Hong Kong", "sector": "Office", "quarter": "Q4 2025", "firm": "Knight Frank", "primeYield": null, "primeRent": "HKD 88.1/sqft/month", "rentUnit": "HKD/sqft/month", "rentValue": 88.1, "yieldValue": null, "commentary": "Overall Central net effective rent rose to HKD 88.1 psf/month in Q4 2025 (+2.0% QoQ, -2.7% YoY). Premium Central reached HKD 105.8 psf/month (+2.9% QoQ, +3.0% YoY) \u2014 first positive YoY growth in years. Total Grade A vacancy was 15.6%, take-up +880,125 sq ft. Banking, finance and law firms drove premium Central demand; Traditional Central and peripheral markets continued to underperform.", "source": "Knight Frank Hong Kong Market Report Q4 2025"}, {"market": "Hong Kong", "sector": "Office", "quarter": "Q4 2025", "firm": "CBRE", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Overall rents edged up 0.6% QoQ in Q4 2025 \u2014 first growth since Q2 2019. Central rents rose 3.7% QoQ and Tsim Sha Tsui +1.7% QoQ. For full-year 2025, overall rents contracted 2.9% YoY (smallest full-year decline since 2019); Central rents were broadly flat (-0.1%). Citywide vacancy rose to 17.3%; Central vacancy declined for a fourth consecutive quarter to 11.1%. Warehouse vacancy reached a record 13% (+1.3 ppt QoQ); warehouse rents fell 2.0% QoQ (full-year -8.4%).", "source": "CBRE Hong Kong Commercial Real Estate Market Outlook 2026"}, {"market": "Hong Kong", "sector": "Office", "quarter": "Q4 2025", "firm": "JLL", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Hong Kong's Grade A office market turned a corner in Q4 2025, with Central and Tsimshatsui leading the rebound posting rental growth of 0.5% and 0.2% respectively in H2 2025. Overall rents declined 1.5% for full-year 2025, led by a 10% drop in Hong Kong East while Central saw only a mild 0.4% decrease. Central vacancy rate fell to 10.9% in H2 2025. Prime warehouse vacancy reached a decade-high of 10.1% at end-2025 with rents down 7.2%.", "source": "JLL 2026: Hong Kong's office and housing markets lead recovery"}, {"market": "Hong Kong", "sector": "Office", "quarter": "Q4 2025", "firm": "Savills", "primeYield": null, "primeRent": "HKD 85/sqft/month", "rentUnit": "HKD/sqft/month", "rentValue": 85.0, "yieldValue": null, "commentary": "Overall Grade A office vacancy rose to 15.5% in December 2025, up 0.9 ppt YoY, but Central vacancy declined 1.9 ppt to 11.3%, reinforcing Central's safe haven status. Average rents in Central held at approximately HKD 85 psf/month. Premium Grade A buildings in Central (Two IFC, Chater House, The Henderson) maintained occupancy above 88%. Savills forecasts premium office rents in Central and Tsim Sha Tsui to rise 5\u20137% in 2026.", "source": "Savills Hong Kong Office Market 2025 Review (via Real Estate Asia)"}, {"market": "Hong Kong", "sector": "Office", "quarter": "Q1 2026", "firm": "Knight Frank", "primeYield": null, "primeRent": "HKD 92.8/sqft/month", "rentUnit": "HKD/sqft/month", "rentValue": 92.8, "yieldValue": null, "commentary": "Overall Central net effective rent reached HKD 92.8 psf/month in Q1 2026 (+5.4% QoQ, +5.9% YoY). Premium Central surged to HKD 111.2 psf/month (+5.1% QoQ, +9.2% YoY). Total Grade A vacancy stood at 14.5%, take-up +563,633 sq ft. JP Morgan Chase committed to 246,000 sq ft at Artist Square Tower in West Kowloon. Traditional Central (+5.7% QoQ) and Admiralty (+2.6% QoQ) also strengthened.", "source": "Knight Frank Hong Kong Market Report Q1 2026"}, {"market": "Hong Kong", "sector": "Office", "quarter": "Q1 2026", "firm": "CBRE", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Overall Grade A office rents rose 1.6% QoQ in Q1 2026 \u2014 the strongest growth since Q3 2018. Central rents surged 5.9% QoQ; Grade A1 buildings in Central rose 12.1% QoQ, the fastest rental growth since Q3 2010. Citywide vacancy declined 0.4 ppt to 16.8%, the biggest quarterly decline since Q2 2015. New leasing volume was 682,800 sq ft (+17.4% YoY). Industrial warehouse vacancy narrowed 0.3 ppt to 12.8% but rents fell 1.2% QoQ (9th consecutive quarterly decline).", "source": "CBRE Hong Kong Q1 2026 Market Review"}, {"market": "Hong Kong", "sector": "Industrial & Logistics", "quarter": "Q2 2024", "firm": "CBRE", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Industrial warehouse vacancy rose to 7.9% in Q2 2024, up sharply from 5.5% in Q1 2024. CBRE had expected a mild correction in H1 2024 due to sluggish leasing demand and rising shadow space. Rents declined as landlords placed greater emphasis on occupancy over maximising income.", "source": "CBRE Hong Kong H1 2024 Market Review"}, {"market": "Hong Kong", "sector": "Industrial & Logistics", "quarter": "Q3 2024", "firm": "CBRE", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Warehouse vacancy rose to 8.4% in Q3 2024 (from 7.9% at end-Q2). Warehouse rents declined 1.0% QoQ. Landlords prioritised keeping occupancy rates high rather than maximising rental income.", "source": "CBRE Hong Kong Q3 2024 Market Review"}, {"market": "Hong Kong", "sector": "Industrial & Logistics", "quarter": "Q4 2024", "firm": "CBRE", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Warehouse rents fell 1.1% QoQ in Q4 2024, bringing the full-year rental decline to -4.6% YoY \u2014 the sharpest annual fall since 2020. Landlords continued prioritising occupancy over rental income. Overall warehouse rents contracted 5.5% for full-year 2024 with a forecasted further 4% decline in 2025.", "source": "CBRE Hong Kong Industrial Q4 2024 Figures"}, {"market": "Hong Kong", "sector": "Industrial & Logistics", "quarter": "Q1 2025", "firm": "CBRE", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Prolonged and elevated vacancy contributed to a 2.1% QoQ decline in warehouse rents in Q1 2025, marking a fifth consecutive quarterly drop. Landlords continued to soften leasing terms to maintain occupancy amid ongoing supply-demand imbalance.", "source": "CBRE Hong Kong Industrial Q1 2025 Figures"}, {"market": "Hong Kong", "sector": "Industrial & Logistics", "quarter": "Q2 2025", "firm": "CBRE", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Warehouse vacancy increased to 10.3% by end of Q2 2025 (+0.4 ppt QoQ). Rents fell 0.8% QoQ in Q2 2025, the sixth consecutive quarterly drop, bringing the YTD decline to 2.9%. Leasing activity was largely driven by relocations with potential downsizing. Notable large deals included 100,000 sq ft at Cainiao Smart Gateway and 92,000 sq ft at China Merchants Logistics Centre.", "source": "CBRE Hong Kong H1 2025 Market Review"}, {"market": "Hong Kong", "sector": "Industrial & Logistics", "quarter": "Q2 2025", "firm": "JLL", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Prime warehouse vacancy rate rose to 9.1% in Q2 2025. Prime warehouse rents declined 2.4% QoQ. Geopolitical tensions and uncertain trade policies in H1 2025 prompted a more cautious approach from occupiers. Limited new commitments drove the vacancy increase.", "source": "JLL Hong Kong H1 2025 Market Review"}, {"market": "Hong Kong", "sector": "Industrial & Logistics", "quarter": "Q3 2025", "firm": "Knight Frank", "primeYield": null, "primeRent": "HKD 16.4/sqft/month", "rentUnit": "HKD/sqft/month", "rentValue": 16.4, "yieldValue": null, "commentary": "Modern logistics prime rent declined to HKD 16.4 psf/month in Q3 2025 (-2.0% QoQ, -6.7% YoY). Modern logistics vacancy rose to 13.3% (+0.6 ppt QoQ). General industrial rents averaged HKD 12.2 psf/month (-1.6% QoQ, -4.6% YoY) with vacancy at 8.5%. Primary leasing activity was dominated by renewals; warehouse landlords offered unprecedented rent-free periods to attract tenants.", "source": "Knight Frank Hong Kong Industrial Summary Q3 2025"}, {"market": "Hong Kong", "sector": "Industrial & Logistics", "quarter": "Q3 2025", "firm": "JLL", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Prime warehouse vacancy rose to 9.3% in Q3 2025 from 9.1% in Q2 2025. Prime warehouse rents declined 2.1% QoQ. Local supply chain and trading firms remained weak tenants; PRC firms expanding into Hong Kong provided some demand. Structural headwinds from route reconfiguration and retailer consolidation continued.", "source": "JLL Hong Kong Q3 2025 Preliminary Market Summary"}, {"market": "Hong Kong", "sector": "Industrial & Logistics", "quarter": "Q4 2025", "firm": "CBRE", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Warehouse vacancy reached a record high of 13.0% in Q4 2025 (+1.3 ppt QoQ). Warehouse rents fell 2.0% QoQ, bringing the full-year 2025 decline to -8.4% \u2014 the worst year since peak. Total contraction from Q4 2023 peak reached -12.7%. Leasing volume improved 55% QoQ to 1.1 million sq ft in Q4. Negative yield carry persisted across commercial property sectors.", "source": "CBRE Hong Kong Industrial Q4 2025 Figures"}, {"market": "Hong Kong", "sector": "Industrial & Logistics", "quarter": "Q4 2025", "firm": "JLL", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Prime warehouse vacancy reached a decade-high of 10.1% at end-2025. Prime warehouse rents declined 7.2% for full-year 2025. Capital values for prime warehouses fell 10.3% in 2025. Structural changes including greater use of routes bypassing Hong Kong, retailer consolidation, and global supply chain reconfiguration are key headwinds. JLL forecasts further 5\u201310% decline in rents and capital values in 2026.", "source": "JLL 2026: Hong Kong's office and housing markets lead recovery"}, {"market": "Hong Kong", "sector": "Industrial & Logistics", "quarter": "Q1 2026", "firm": "CBRE", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Warehouse vacancy narrowed 0.3 ppt QoQ to 12.8% in Q1 2026 \u2014 positive net absorption of 135,800 sq ft marking the end of four consecutive quarters of net withdrawal. However, warehouse rents fell a further 1.2% QoQ as landlords cut rates to improve occupancy. This was the ninth consecutive quarterly rental decline, with total contraction from Q4 2023 peak reaching -13.7%. New leasing volume rose 17.4% YoY with electronics-sector logistics companies accounting for 31%.", "source": "CBRE Hong Kong Q1 2026 Market Review"}, {"market": "Hong Kong", "sector": "Industrial & Logistics", "quarter": "Q1 2026", "firm": "JLL", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Prime warehouse vacancy hit 10.5% in Q1 2026, with slight vacancy improvement from Q4 2025 levels. JLL noted logistics demand remains structurally challenged but emerging electronics demand and pre-leasing for high-spec facilities provide selective support. Rents expected to fall a further 5\u201310% in 2026 per December 2025 forecast.", "source": "JLL Hong Kong Industrial Market Dynamics Q1 2026"}, {"market": "Hong Kong", "sector": "Retail", "quarter": "Q2 2024", "firm": "CBRE", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "High street shop vacancy across four core retail districts was 6.8% in Q2 2024, unchanged from end-Q1. Overall high street rents increased 1.0% QoQ in Q3 2024. Total retail sales in July 2024 fell 11.8% YoY, reflecting weak consumer sentiment. Retail leasing was resilient in core districts despite soft macro backdrop.", "source": "CBRE Hong Kong Q3 2024 Market Review"}, {"market": "Hong Kong", "sector": "Retail", "quarter": "Q3 2024", "firm": "CBRE", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "High street shop rents increased 1.0% QoQ in Q3 2024 while Prime Shopping Mall rents rose 2.0% QoQ. Vacancy for high street shops in core districts held at 6.8%. Overall high-street shop rents increased 3.1% for full-year 2024.", "source": "CBRE Hong Kong Q3 2024 Market Review"}, {"market": "Hong Kong", "sector": "Retail", "quarter": "Q4 2024", "firm": "JLL", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "High Street shop vacancy rate was 10.5% at end-2024 (slightly decreased from 11.6% at end-2023). Prime shopping centre vacancy stood at 8.9%. Rental values of High Street shops increased 1.3% for full-year 2024; Prime shopping centres decreased 2.3% for the year. JLL expected retail rents to decline 0\u20135% in 2025.", "source": "JLL Hong Kong Real Estate Market Outlook 2025"}, {"market": "Hong Kong", "sector": "Retail", "quarter": "Q4 2024", "firm": "Savills", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "High-street shop rents rose 3.1% for full-year 2024, showing resilience despite weak retail sales. Savills forecasted high-street rents to grow mildly by 0\u20135% in 2025 and noted core prime street shops approaching the bottom of the rental cycle.", "source": "Savills Hong Kong Research Market Update Q4 2024"}, {"market": "Hong Kong", "sector": "Retail", "quarter": "Q2 2025", "firm": "JLL", "primeYield": null, "primeRent": "HKD 206/sqft/month", "rentUnit": "HKD/sqft/month", "rentValue": 206.0, "yieldValue": null, "commentary": "Net effective rent for overall prime shopping centre and high street retail markets stood at HKD 206 psf/month in Q2 2025, down 3.9% YoY. Rent downtrend persisted amid retailer cost-consciousness. Overall Prime shopping centre rents declined 3.1% QoQ while Premium Prime declined 2.7%. High street vacancy edged up to 10.5% by end-June; Prime shopping centre vacancy also rose to 10.5% in H1 2025.", "source": "JLL Hong Kong Retail Market Q2 2025 Insights (via Scribd)"}, {"market": "Hong Kong", "sector": "Retail", "quarter": "Q2 2025", "firm": "CBRE", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Core retail district vacancy declined 0.7 ppt to 7.1% in Q2 2025. Central retail vacancy remained stable at 6.6%. Rents increased 0.9% QoQ in Q2 (matching Q1 pace), bringing H1 2025 growth to 1.9% \u2014 driven by lower vacancy in core districts and mild demand. Retail sales rose 2.4% YoY in May (first positive month in 14 months), supported by mainland Golden Week visitors.", "source": "CBRE Hong Kong H1 2025 Market Review"}, {"market": "Hong Kong", "sector": "Retail", "quarter": "Q3 2025", "firm": "JLL", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "High Street shop rents declined 1.4% QoQ in Q3 2025, standing 52.6% below the Q2 2019 peak. Prime Shopping Centre rents fell 3.3% QoQ; Premium Prime Shopping Centre rents declined 3.8% QoQ. High street vacancy improved to 9.7% by end of Q3 (from 10.7% in Q2). Causeway Bay, Central and Tsimshatsui core streets recorded QoQ declines within 1%.", "source": "JLL Hong Kong Q3 2025 Preliminary Market Summary"}, {"market": "Hong Kong", "sector": "Retail", "quarter": "Q3 2025", "firm": "CBRE", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Retail vacancy edged up 0.9 ppt QoQ to 8.0% in Q3 2025; Central retail was the only district reporting a slight vacancy decrease. Positive leasing activity concentrated in core streets. High-spec retail units along prime thoroughfares in Central and Causeway Bay continued to attract quality F&B and luxury brands.", "source": "CBRE Hong Kong Q3 2025 Market Review"}, {"market": "Hong Kong", "sector": "Retail", "quarter": "Q4 2025", "firm": "Knight Frank", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Prime street shop rents are expected to grow 5\u201310% in 2026, reflecting improving sentiment. Key Q4 2025 retail lettings included: Longbridge Securities at 58 Russell Street, Causeway Bay at HKD 164 psf/month; Lactose at 12 Pedder Street, Central at HKD 200 psf/month; Insta360 at 22-36 Paterson Street, Causeway Bay at HKD 250 psf/month. Retail landscape remains polarised between luxury and budget segments.", "source": "Knight Frank Hong Kong Market Report Q4 2025"}, {"market": "Hong Kong", "sector": "Retail", "quarter": "Q4 2025", "firm": "CBRE", "primeYield": null, "primeRent": null, "rentUnit": "HKD/sqft/month", "rentValue": null, "yieldValue": null, "commentary": "Vacancy rate for high street shops in four core ht Frank", "summary": "Knight Frank highlights South Korea as a two-way bridge for private credit capital, with domestic institutions allocating to global funds while foreign investors target approximately US$325 million in local real estate credit opportunities. Korea's commercial real estate market enters a mild correction phase in 2026 after a record 2025, but prime office assets remain the core of transaction activity. Data centres, hotels and alternative living sectors are broadening the investable universe for domestic and international capital.", "source": "Seoul Capital Markets & Private Credit Outlook 2026"}]}]}, {"country": "Singapore", "sectors": [{"sector": "Office", "savillsView": {"summary": "Savills Singapore revised its 2026 office rental growth forecast from 2% to 3%\u20135% YoY, citing persistently low vacancy levels and landlords' pricing power. CBD Grade A rents hit S$10.02 per sq ft \u2014 highest since Q4 2019 \u2014 while Grade AAA vacancy tightened to 5.1%. Shorter lease renewal terms are becoming more common among technology firms as companies navigate economic uncertainty. Prime yield: N/A. Prime rent: N/A.", "primeYield": "N/A", "primeRent": "N/A", "outlook": "positive"}, "competitorIntel": [{"firm": "JLL", "summary": "JLL's city-level report on Singapore's CBD office market. Positive leasing momentum from 2025 carried into Q1 2026, with vacancy tightening more significantly for prime properties. There were no major office completions during the quarter. Office rent growth continued, though quarter-on-quarter gains fell back to the sub-1% region. The Marina Bay submarket led the drop in vacancy rates, and some spaces were re-let before the current occupants vacated, reflecting strong demand for premium space.", "source": "Singapore Office Market Dynamics Q1 2026"}, {"firm": "Knight Frank", "summary": "Singapore office rents in the Central Region declined marginally by 0.2% QoQ in Q1 2026 per URA data, though prime Grade A CBD rents continued their recovery with islandwide office vacancy falling to 10.8% \u2014 its fourth consecutive quarter of improvement. Total available shadow space decreased by 2.3% to 422,000 sq ft NLA. The market continues to exhibit a flight-to-quality dynamic with premium Grade A buildings maintaining pricing power.", "source": "Singapore Office Market Update Q1 2026"}]}, {"sector": "Industrial & Logistics", "savillsView": {"summary": "Strata industrial sales in Singapore declined 17.5% QoQ to 335 deals in Q1 2026, the lowest quarterly total since 2020, amid a more cautious business environment. Buyer preferences shifted sharply toward longer land tenures, with freehold industrial assets rising 2.9% QoQ to S$876 per sq ft and 60-year leasehold assets up 1.4% QoQ to S$569 per sq ft, while 30-year leasehold assets dipped 0.6% QoQ to S$353 per sq ft. Prime warehouse and logistics rents increased 0.4% QoQ to S$1.83 per sq ft per month. Prime yield: N/A. Prime rent: N/A.", "primeYield": "N/A", "primeRent": "N/A", "outlook": "cautious"}, "competitorIntel": [{"firm": "JLL", "summary": "JLL's Q1 2026 report on Singapore's industrial and logistics sector. Demand held firm, with higher-specification logistics and warehouse premises remaining sought after. Islandwide average rents and capital values rose QoQ for the first time after six consecutive quarters of stability\u2014ending a prolonged period of flat metrics. Yields were kept unchanged. Notable Q1 2026 deals included UI Boustead REIT acquiring three logistics assets for SGD 138.8 million and CapitaLand Ascendas REIT purchasing a facility for SGD 504.2 million. Capital value growth could outpace rental growth and tighten yields by year-end.", "source": "Singapore Industrial/Logistics Market Dynamics Q1 2026"}, {"firm": "Knight Frank", "summary": "Singapore's industrial sector saw property prices grow at a slower pace in Q1 2026, led by multiple-user factories which posted a 1.7% quarterly increase. Demand for higher-specification logistics and warehouse premises remained healthy, underpinned by logistics service providers and e-commerce firms. The sector outlook remains supported by continual investor demand for quality logistics assets and Singapore's attractiveness as a safe investment haven.", "source": "Singapore Industrial and Logistics Market Update Q1 2026"}]}, {"sector": "Retail", "savillsView": {"summary": "Singapore's retail vacancy rate held steady at 6.3% in Q1 2026, despite softer leasing demand and rising tenant churn, as the constrained supply pipeline (427,000 sq ft projected for 2026) contained vacancy. Prime Orchard Area mall rents edged up 0.1% QoQ to S$23.60 per sq ft, while suburban rents rose 0.2% QoQ to S$14.90 per sq ft. The market is bifurcating, with well-located prime malls maintaining occupancy while secondary locations face growing leasing challenges. Prime yield: N/A. Prime rent: N/A.", "primeYield": "N/A", "primeRent": "N/A", "outlook": "positive"}, "competitorIntel": [{"firm": "JLL", "summary": "Singapore's retail market saw occupier demand soften in Q4 2025 as the challenging operating environment and shifting consumer behaviours led retailers to seek more affordable options, though the Formula One race and year-end festivities provided a temporary boost. Islandwide vacancy rose quarter-on-quarter but remained contained as landlords prioritised occupancy, while prime floor space rents held stable on continued demand from quality-seeking occupiers. The suburban submarket recorded the highest vacancy increase of 0.1 percentage points driven by closures of underperforming stores at non-prime locations.", "source": "Singapore Retail Market Dynamics Q4 2025 (APPD Report)"}, {"firm": "Knight Frank", "summary": "Islandwide retail occupancy held steady in Q1 2026 despite several high-profile store closures, with vacancies quickly backfilled by new and existing brands. The retail sector continues to benefit from strong household spending, tourism recovery, and the flight of shoppers back to prime malls and street-level retail. Supply constraints continue to underpin rental stability in well-located assets.", "source": "Singapore Retail Market Update Q1 2026"}]}, {"sector": "Residential", "savillsView": {"summary": "Singapore developers launched approximately 1,844 new private units in Q1 2026, down ~30% QoQ and 41.3% YoY, while sales totalled ~2,025 units as demand outpaced new supply for a second consecutive quarter. Strong take-up was seen at River Modern (410 of 455 sold), Pinery Residences (537 of 588), and Newport Residences (184 of 246). Private residential prices rose 0.3% QoQ, moderating from 0.6% in Q4 2025. Prime yield: N/A. Prime rent: N/A.", "primeYield": "N/A", "primeRent": "N/A", "outlook": "positive"}, "competitorIntel": [{"firm": "JLL", "summary": "Singapore's prime non-landed residential market saw sales volume contract in Q4 2025, with October front-loaded by the launch of the 666-unit Skye at Holland. Prime resale non-landed home capital values rose on improved macro conditions and buyer preference for Prime assets as capital preservation vehicles. Luxury Prime rents fell amid weaker leasing demand while Typical Prime rents grew as cost-conscious tenants sought more affordable prime-district options.", "source": "Singapore Residential Market Dynamics Q4 2025 (APPD Report)"}, {"firm": "Knight Frank", "summary": "Private home prices rose at a faster pace in Q1 2026, though overall sales activity softened. Rental prices rebounded marginally from a 0.5% QoQ drop in Q4 2025 to a 0.3% increase in Q1 2026. Executive Condominiums were the standout performer, with transaction volume tripling to approximately 1,500 units, while District 10 median prices surged over 40% driven by large-format freehold resale demand.", "source": "Singapore Residential Market Update Q1 2026"}]}, {"sector": "Capital Markets", "savillsView": {"summary": "Savills Singapore reported that investment sales in Q4 2025 rose 44.4% year-on-year to approximately S$11 billion, marking a three-year high and driven by commercial and industrial transactions. Full-year 2025 investment sales totalled S$34.12 billion, up 27% from the prior year. Savills attributed the strong close to improved investor sentiment, lower financing costs, and capital recycling by developers and REITs. Prime yield: N/A. Prime rent: N/A.", "primeYield": "N/A", "primeRent": "N/A", "outlook": "positive"}, "competitorIntel": [{"firm": "CBRE", "summary": "CBRE notes that Singapore's real estate investment appetite has improved amid lower interest rates, with Singapore ranking among the top three APAC investment destinations and investors deploying core-plus strategies given significant debt cost reductions that have taken the 3M SORA to approximately 1.2% in late 2025. A healthy pipeline of investment-grade assets alongside sustained rental growth across key sectors should support growth in transaction volumes in 2026. The report flags that Singapore's Core CBD Grade A vacancy compressed to record lows in late 2025, reinforcing landlord pricing power.", "source": "2026 Singapore Real Estate Market Outlook \u2013 Economy and Investment Overview"}, {"firm": "Knight Frank", "summary": "Knight Frank Singapore's quarterly bulletin reports on real estate investment in Singapore with insights into the latest transaction trends. The Q1 2026 edition covers a period when Singapore recorded its highest quarterly investment volume on record according to JLL data, and where cross-border capital from Southeast Asian and global investors is actively deploying into prime commercial and residential assets.", "source": "Singapore Investment Market Update \u2013 Q1 2026"}]}]}, {"country": "Australia", "sectors": [{"sector": "Office", "savillsView": {"summary": "Savills research in progress. Our latest data indicates prime yield at N/A and prime rent at N/A. Full sector commentary will be published in the next research cycle.", "primeYield": "N/A", "primeRent": "N/A", "outlook": "stable"}, "competitorIntel": [{"firm": "CBRE", "summary": "Brisbane CBD prime gross face rents grew 3.7% QoQ and 9.2% YoY in Q1 2026, among the strongest performances in Australia, with incentives declining 50 bps to average 38.9%. Prime CBD yields tightened slightly by 2 bps to 7.02%, reflecting late 2025 transaction activity. Market sentiment is noticeably improved year-on-year, with more tenants engaging with the market, though rising bond rates and the cash rate are creating some near-term investment uncertainty.", "source": "Brisbane CBD Office Figures Q1 2026"}, {"firm": "JLL", "summary": "JLL's Q1 2026 city-level report on Sydney's office market. The Sydney office vacancy rate remained flat over the quarter. One completion was recorded across all Sydney markets totalling 4,500 sqm. Office transactions were concentrated in the metro markets, with strong CBD leasing activity fuelled by occupier expansions and a continued flight-to-quality trend. The market is underpinned by very limited new construction and low pipeline supply.", "source": "Sydney Office Market Dynamics Q1 2026"}, {"firm": "Knight Frank", "summary": "Net effective rents in Sydney CBD rose 10.2% and Melbourne CBD rose 6.8% over the 12 months to end-March 2026 \u2014 the fastest post-pandemic growth rates. Brisbane CBD led with 11.7% annual net effective rental growth. Core precincts outperformed significantly: Sydney Core surged 14.3% and Melbourne Eastern Core jumped 16.1% YoY, creating a 54% and 93% premium respectively over non-core CBD locations.", "source": "Australian Office Indicators Q1 2026"}]}, {"sector": "Industrial & Logistics", "savillsView": {"summary": "Savills Australia's Western Sydney Industrial and Logistics team reported a slight increase in vacancy to 4.96% in Q1 2026, while average rents increased to AUD $248.96 per sq m net \u2014 up 13.66% year-on-year. The snapshot highlighted continued flight to quality among occupiers and ongoing demand for modern, well-located logistics facilities despite broader market normalisation from the post-pandemic peak. Prime yield: N/A. Prime rent: N/A.", "primeYield": "N/A", "primeRent": "N/A", "outlook": "stable"}, "competitorIntel": [{"firm": "CBRE", "summary": "Gross take-up in Australia's industrial and logistics market moderated to approximately 680,000 sqm in Q1 2026, with approximately 700,000 sqm delivered as the development pipeline remains elevated. National super prime midpoint yields expanded marginally to 5.7%, reflecting higher interest rates and elevated bond yields, while effective rents returned to growth as face rental growth began to offset elevated incentives. Close to 40% of the 2026-2027 supply pipeline is pre-committed, with investment sales for income-producing assets totalling close to A$1 billion.", "source": "Australia Industrial and Logistics Figures Q1 2026"}, {"firm": "JLL", "summary": "JLL's comprehensive industrial vacancy and supply update for Australia. Vacancy was broadly stable in Sydney, Melbourne, and Brisbane in Q1 2026. Sydney recorded 5.8% vacancy across 23.5 million sqm, Melbourne 5.2% across 30.6 million sqm (Australia's largest market), Brisbane 5.3% across 13.8 million sqm, and Perth the lowest nationally at 2.0%. Sub-lease vacancy decreased in Sydney (to 1.1%) and Melbourne (to 1.0%). The 45,000+ sqm cohort was the tightest nationally at 2.9% vacancy.", "source": "Industrial Real Estate Market Analysis Q1 2026: Latest Industrial Vacancy Rates Across Australia"}, {"firm": "Knight Frank", "summary": "East coast industrial vacancy edged up marginally to 3.9% in Q1 2026, with Sydney recording the tightest rate at 2.9%. New supply is contracting sharply \u2014 2026 completions are forecast to fall a further 20% following a 19% decline in 2025, totalling 1.66 million sq m. Brisbane leads on annual prime effective rent growth at 9.2%, and the thinning development pipeline is expected to drive stronger absorption and rental gains across east coast markets.", "source": "Australian Industrial Review Q1 2026"}]}, {"sector": "Retail", "savillsView": {"summary": "Australian retail investment volumes reached approximately A$4 billion in Q1 2026, the second consecutive quarter above that threshold, bringing rolling annual turnover to A$13.2 billion \u2014 up from A$9.9 billion a year earlier. Institutional capital accounted for 54% of acquisitions, while private and syndicated investors rose to 44%. Regional centres dominated at A$1.8 billion (nearly four times YoY), and neighbourhood centres rose 54% YoY, though large format retail was more selective. Prime yield: N/A. Prime rent: N/A.", "primeYield": "N/A", "primeRent": "N/A", "outlook": "cautious-recovery"}, "competitorIntel": [{"firm": "CBRE", "summary": "Net face rents grew across all retail sectors in Australia in Q1 2026, with CBD secondary and super prime assets recording the highest growth of 2.3% and 2.2% QoQ respectively. Shopping centre and large format yields continued to compress, with large format centres compressing 4 bps QoQ, while there were 32 retail transactions exceeding A$5 million totalling c.A$1.67 billion. Consumer sentiment declined significantly, with the Westpac-Melbourne Institute Index falling 12.5% to 80.1 in April amid global uncertainty.", "source": "Australia Retail Figures Q1 2026"}, {"firm": "JLL", "summary": "JLL's Q1 2026 report on Melbourne's retail market. Non-discretionary spending increased 5% annually, double the discretionary spending growth of 2.7%, reflecting the ongoing polarisation in consumer spending. Six retail projects were completed in Q1 2026, up from the previous year. Eleven retail sales transactions occurred in Melbourne during the quarter. The market showed resilience in prime locations while secondary retail faced continued headwinds.", "source": "Melbourne Retail Market Dynamics Q1 2026"}, {"firm": "Knight Frank", "summary": "Australia's retail property sector delivered the strongest total return of all commercial property sectors in 2025 at 9.2% \u2014 the best result since 2017 \u2014 supported by years of subdued development activity and rising tenant turnover. Around A$3.6 billion of retail transactions occurred in Q1 2026. Despite near-term uncertainty from the Middle East conflict, medium-term fundamentals remain supportive given a constrained development pipeline, elevated construction costs, and limited new supply feasibility.", "source": "Australian Retail Review \u2014 April 2026 (Detailed Analysis)"}]}, {"sector": "Data Centre", "savillsView": {"summary": "Savills Australia identified data centres as a standout sector within the industrial and alternative asset space for 2026, driven by AI adoption and data localisation demands. The Spotlight on 2026 report noted that competition for land and grid capacity was intensifying, while AI was unlocking record levels of capital. Savills expected data centre investment to remain strong, with industrial logistics and data centres as priority targets for institutional and cross-border investors. Prime yield: N/A. Prime rent: N/A.", "primeYield": "N/A", "primeRent": "N/A", "outlook": "positive"}, "competitorIntel": []}, {"sector": "Residential", "savillsView": {"summary": "The first edition of Savills Australia's new monthly residential research update covering Australia's housing markets. The May 2026 edition focuses on the drivers behind Perth's continued price growth, Sydney's bifurcated market conditions, and key themes ahead of the Federal Budget. It serves as a regular pulse check bringing together data and on-the-ground market insight across Australia's increasingly uneven residential markets. Prime yield: N/A. Prime rent: N/A.", "primeYield": "N/A", "primeRent": "N/A", "outlook": "positive"}, "competitorIntel": [{"firm": "CBRE", "summary": "CBRE's 2026 Pacific Market Outlook highlights Australia's living sector facing a structural supply shortfall, with apartment completions forecast at approximately 60,000 units annually\u2014well below the long-run demand of 75\u201385k. Capital city vacancy is expected to decline from 1.8% in 2025 to 1.1% by 2030, with rents projected to grow +24% and capital values +28% over 2025\u20132030. Student accommodation and senior living remain under-penetrated, presenting significant investment opportunities amid demographic shifts and affordability pressures.", "source": "CBRE Australia Pacific Market Outlook 2026 \u2013 Residential Sector"}, {"firm": "JLL", "summary": "JLL's Q1 2026 city-level report on Melbourne's residential market. Apartment completions in Melbourne's inner precinct were just over 2,000 in 2025\u2014a 10-year low. Median apartment sale prices in Melbourne remained largely stagnant at AUD 615,000 since early 2023. Apartment rents saw some modest growth. Buyer activity was increasing, supported by the constrained supply pipeline, with developers expected to deliver fewer new projects in the near term.", "source": "Melbourne Residential Market Dynamics Q1 2026"}]}, {"sector": "Capital Markets", "savillsView": {"summary": "Savills research in progress. Our latest data indicates prime yield at N/A and prime rent at N/A. Full sector commentary will be published in the next research cycle.", "primeYield": "N/A", "primeRent": "N/A", "outlook": "stable"}, "competitorIntel": [{"firm": "Knight Frank", "summary": "Knight Frank Australia's monthly capital markets monitor breaks down the key indicators shaping the Australian capital markets environment. The report tracks investment activity across all major asset classes, noting that total Australian CRE investment volumes reached A$53.6 billion in 2025, the third strongest on record. Office transactions are rising, driven by end-user demand and growing investor interest, while the retail sector was a standout performer in 2025 with A$14.6 billion transacted.", "source": "Australian Capital View \u2013 February 2026"}]}]}, {"country": "Hong Kong", "sectors": [{"sector": "Office", "savillsView": {"summary": "Savills forecasts prime Central office rents in Hong Kong to rise 5\u20137% in 2026, supported by tightening vacancy in the core Central submarket. Central Grade A rents rose approximately 3.5% in Q1 2026, with Central vacancy falling to around 9.9% by February \u2014 the lowest since 2023. Non-residential investment in Hong Kong was boosted by office and hotel deals, and investors explored hotel-to-student-accommodation repositioning opportunities. Prime yield: N/A. Prime rent: N/A.", "primeYield": "N/A", "primeRent": "N/A", "outlook": "positive"}, "competitorIntel": [{"firm": "CBRE", "summary": "Hong Kong Grade A office rents increased 1.6% QoQ in Q1 2026 \u2014 the strongest growth since Q3 2018 \u2014 driven primarily by Central (+5.9% QoQ) and Greater Tsim Sha Tsui (+0.9% QoQ), with Grade A1 buildings in Central recording their strongest gains since Q3 2010 at +12.1% QoQ. No new supply was delivered this quarter, and with positive net absorption of 375,400 sq. ft. (a fourth consecutive positive quarter), overall vacancy fell 0.4 pp to 16.8%, the biggest single-quarter decline since Q2 2015. Over the past four quarters, cumulative net absorption has totalled 2.7 million sq. ft.", "source": "Hong Kong Figures \u2013 Office Q1 2026"}, {"firm": "JLL", "summary": "JLL's Q1 2026 analysis of Hong Kong's office market. Total net absorption reached 614,300 sqft but fell 59.7% QoQ from the elevated Q4 2025 base. The overall office vacancy rate stood at 13.5% at end-March; Central vacancy dropped 1.4 ppts QoQ to 9.6%\u2014single-digit for the first time since 2023, driven by financial sector demand. Overall office rent rose 1.5% QoQ, with Central leading at +3.8% QoQ. Grade A capital values dipped 0.4% QoQ. Rents are projected to decline moderately by 0\u20135% in full-year 2026.", "source": "Hong Kong Office Market Dynamics Q1 2026"}, {"firm": "Knight Frank", "summary": "Premium Central continued to outperform the broader Hong Kong office market with 5.1% QoQ rental growth in Q1 2026, with Traditional Central and Admiralty also rising 5.7% and 2.6% respectively. Finance sector demand \u2014 particularly from traditional securities houses, asset management firms, and Middle Eastern banks \u2014 drove the recovery. Knight Frank expects leasing momentum to strengthen further in Q2 2026, broadening beyond Premium Central to include Traditional Central, Admiralty and Wan Chai.", "source": "Central Leads Hong Kong Island Office Recovery \u2014 Q1 2026"}]}, {"sector": "Industrial & Logistics", "savillsView": {"summary": "Savills Hong Kong's logistics market outlook noted continued pressure in the sector despite some improvement in overall trade performance. The vacancy rate for high-quality warehouses reached approximately 11.2% in Q4 2025 \u2014 a post-pandemic high \u2014 while rents declined a further 3.4% quarter-on-quarter. Overall logistics property rents were forecast to decrease by approximately 7% in full-year 2026 amid persistent weak leasing demand. Prime yield: N/A. Prime rent: N/A.", "primeYield": "N/A", "primeRent": "N/A", "outlook": "cautious"}, "competitorIntel": [{"firm": "CBRE", "summary": "Industrial leasing in Hong Kong remained sluggish in Q1 2026, with total leasing volume of 682,800 sq. ft. representing a 35% QoQ decline, though still up 17% YoY from a low base. Despite positive net absorption of 135,800 sq. ft. \u2014 ending four consecutive quarters of net withdrawal \u2014 overall warehouse rents fell a further 1.2% QoQ as landlords cut rates to improve occupancy, marking the ninth consecutive quarterly rental decline. Overall warehouse vacancy narrowed slightly by 0.3 pp to 12.8%.", "source": "Hong Kong Figures \u2013 Industrial Q1 2026"}, {"firm": "JLL", "summary": "JLL's Q1 2026 report on Hong Kong's industrial market. New lease activity remained constrained, supported primarily by the construction and semiconductor industries. Prime warehouse vacancy reached 10.5% in Q1 2026. Net absorption was negative for the ninth consecutive quarter, and there were no completions in Q1 2026. Investment activity was underpinned by an en-bloc transaction at Kodak House I and acquisitions by the Urban Renewal Authority, with mainland Chinese investors accounting for approximately 15.6% of total investment volume.", "source": "Hong Kong Industrial/Logistics Market Dynamics Q1 2026"}, {"firm": "Knight Frank", "summary": "Demand for Hong Kong industrial leasing remained steady in Q1 2026 despite external headwinds, driven primarily by logistics and e-commerce companies. Vacancy rates for both general industrial properties and modern logistics improved slightly. The Kowloon East submarket faces rising vacancies as narrowing rental differentials between industrial and office space prompt tenants to consolidate into offices.", "source": "Hong Kong Industrial Leasing Q1 2026"}]}, {"sector": "Retail", "savillsView": {"summary": "Hong Kong's Tsim Sha Tsui retained its title as Asia's most expensive luxury retail location in the Savills ninth annual Global Luxury Retail Outlook, with annual rents of US$22,000 (approximately \u00a316,160) per sq m \u2014 ranking as the world's second most expensive luxury retail strip after London's Bond Street (\u00a319,228 per sq m). Hong Kong remained among the world's most active markets for new luxury store openings. The report noted slower rent growth in Hong Kong in 2025 compared to 2024's rebound. Prime yield: N/A. Prime rent: N/A.", "primeYield": "N/A", "primeRent": "N/A", "outlook": "positive"}, "competitorIntel": [{"firm": "CBRE", "summary": "Leasing volume in Hong Kong's core retail districts totalled 213,800 sq. ft. in Q1 2026, declining QoQ due to seasonal factors but rising YoY; fashion brands were the second most active trade at 22% of volume, their highest share since Q4 2016. Low vacancy in prime areas pushed high street shop rents up 0.9% QoQ \u2014 the fifteenth consecutive quarterly increase \u2014 with vacancy for core retail districts rising slightly to 6.8%, still near its lowest since early 2024. Mainland Chinese tea and coffee shops continued to expand across the market.", "source": "Hong Kong Figures \u2013 Retail Q1 2026"}, {"firm": "JLL", "summary": "JLL's Q1 2026 analysis of Hong Kong's retail property market. Retail leasing activity remained steady during the quarter. Prime shopping centre vacancy rose to 12.6% in Q1 2026. Investment volume dropped compared to Q4 2025, though the market has moved past its trough with retail sales recording sustained growth and high-street rents stabilising. Ongoing tenant reshuffling continued, with fresh concepts and F&B operators leading activity.", "source": "Hong Kong Retail Market Dynamics Q1 2026"}]}, {"sector": "Residential", "savillsView": {"summary": "Savills research in progress. Our latest data indicates prime yield at N/A and prime rent at N/A. Full sector commentary will be published in the next research cycle.", "primeYield": "N/A", "primeRent": "N/A", "outlook": "stable"}, "competitorIntel": [{"firm": "CBRE", "summary": "Hong Kong's residential property market recorded a significant broad-based rebound in April 2026, with total home sales value jumping 50.9% YoY to HK$63.7 billion and transaction volume rising 29.4% YoY to 7,368 units. The luxury segment surged with 87 units priced above HK$100 million transacted as of mid-April, representing approximately 135% YoY growth. CBRE projects full-year 2026 residential prices to rise approximately 8% to 10%, supported by easing supply pressures and developer confidence.", "source": "Hong Kong Residential Insights May 2026"}, {"firm": "JLL", "summary": "JLL's Q1 2026 overview of Hong Kong's residential market. Residential transaction volume rose 54.0% YoY in Q1 2026, with three residential sites tendered during the quarter. Luxury leasing and investment activity strengthened on the back of a broad market recovery, supported by easing financing conditions (HIBOR declining from 3.1% to 2.2%). The successful MTR Kam Sheung Road Phase Two tender reflected continued developer confidence in the Northern Metropolis.", "source": "Hong Kong Residential Market Dynamics Q1 2026"}, {"firm": "Knight Frank", "summary": "Hong Kong prime residential prices slipped 2.1% in 2025 per the PIRI 100, yet super-prime activity surged with 81 US$10 million+ transactions in Q4 \u2014 second globally only to Dubai. Morgan Stanley raised its 2026 Hong Kong home-price growth estimate to 12%, citing strong sell-through rates, declining inventory, and falling land supply. Momentum is driven by a resurgent IPO market, mainland Chinese wealth inflows, and expanded talent visa schemes.", "source": "Hong Kong's Prime Market Turns a Corner"}]}, {"sector": "Capital Markets", "savillsView": {"summary": "Savills research in progress. Our latest data indicates prime yield at N/A and prime rent at N/A. Full sector commentary will be published in the next research cycle.", "primeYield": "N/A", "primeRent": "N/A", "outlook": "stable"}, "competitorIntel": [{"firm": "Knight Frank", "summary": "Knight Frank's monthly Hong Kong Investment Yield Guide provides a monthly update on prime yields across all commercial sectors and current market sentiment. The January 2026 edition reflects the market conditions entering 2026, covering office, retail, industrial and residential prime yield benchmarks across Hong Kong's key sub-markets including Central, Kowloon and the New Territories.", "source": "Investment Yield Guide \u2013 January 2026 (Hong Kong)"}]}]}]}];
