e rents in Tokyo's Central 5 Wards touching new highs. Japan's commercial real estate investment reached JPY2.043 trillion in Q1 2026, up 2% YoY and the highest first-quarter level on record. Cross-border capital flows concentrated heavily in Japan during the quarter.", "sector": "Office", "market": "Tokyo", "primeYield": null, "primeRent": null, "url": "https://www.savills.co.jp/research/japan/office-market.aspx", "id": 77}, {"publishDate": "2026-05-28", "firm": "Savills", "title": "Savills Impacts 2026 \u2013 AI's Implications for Real Estate", "summary": "Savills launched its Impacts 2026 research programme examining AI's broad implications for real estate demand and strategy. The report includes analysis of 'Deep Tech cities', whose economies grew 0.9 percentage points per year faster than their host countries over the past decade. Savills found that companies significantly using AI are about 4% more likely to expand headcount than shed staff, and that economic growth and business sentiment remain more significant drivers of office demand than AI displacement.", "sector": "Mixed/Cross-Sector", "market": "APAC", "primeYield": null, "primeRent": null, "url": "https://impacts.savills.com/technology/ais-implications-for-real-estate.html", "id": 88}, {"publishDate": "2026-05-27", "firm": "Knight Frank", "title": "Hong Kong's Resurgence Reflects a New Wealth Order", "summary": "Hong Kong overtook Switzerland as the world's largest cross-border booking centre in 2025, with cross-border wealth rising 10.7% to US$2.9 trillion driven by mainland China flows and surging IPO activity (US$36 billion raised via HKEX in 2025, up 218% YoY). Singapore and the UAE complete the top three global cross-border wealth hubs. Asia-Pacific's role in the AI supply chain and equity market performance in Hong Kong and Japan is rapidly expanding the region's financial wealth.", "sector": "Investment", "market": "Hong Kong", "primeYield": null, "primeRent": null, "url": "https://www.knightfra ning vacancy in the core Central submarket. Central Grade A rents rose approximately 3.5% in Q1 2026, with Central vacancy falling to around 9.9% by February \u2014 the lowest since 2023. Non-residential investment in Hong Kong was boosted by office and hotel deals, and investors explored hotel-to-student-accommodation repositioning opportunities.", "sector": "Office", "market": "Hong Kong", "primeYield": null, "primeRent": null, "url": "https://www.savills.com.hk/research/hong-kong/office-market.aspx", "id": 82}, {"publishDate": "2026-05-12", "firm": "Savills", "title": "Global Luxury Retail Outlook 2026 \u2013 Hong Kong (Tsim Sha Tsui)", "summary": "Hong Kong's Tsim Sha Tsui retained its title as Asia's most expensive luxury retail location in the Savills ninth annual Global Luxury Retail Outlook, with annual rents of US$22,000 (approximately \u00a316,160) per sq m \u2014 ranking as the world's second most expensive luxury retail strip after London's Bond Street (\u00a319,228 per sq m). Hong Kong remained among the world's most active markets for new luxury store openings. The report noted slower rent growth in Hong Kong in 2025 compared to 2024's rebound.", "sector": "Retail", "market": "Hong Kong", "primeYield": null, "primeRent": "US$22,000 per sq m per year (Tsim Sha Tsui)", "url": "https://www.savills.com/research_articles/255800/global-luxury-retail-outlook-2026", "id": 89}, {"publishDate": "2026-05-11", "firm": "Savills", "title": "Global Occupier Markets: Prime Office Costs \u2013 Q1 2026", "summary": "Global prime office occupier costs rose 0.7% in Q1 2026, bringing the 12-month increase to 5% and the two-year cumulative gain to 9.1%. Tokyo posted the sharpest quarterly rise of any APAC city ever recorded in the series (12.7% QoQ), driven by near-zero vacancy in top buildings and landlords raising headline rents. APAC overall saw a 0.4% increase, with Asian markets excluding China up 1.4% on average, while mainland Chinese hubs continued to decline 2%.", ains across east coast markets.", "sector": "Industrial & Logistics", "market": "Australia", "primeYield": null, "primeRent": "Brisbane: +9.2% annual prime effective rent growth (strongest on east coast)", "url": "https://www.knightfrank.com.au/blog/amp/2026/05/10/thinning-industrial-development-pipeline-will-aid-future-rental-growth-across-east-coast", "id": 100}, {"publishDate": "2026-05-08", "firm": "Savills", "title": "The Residential Review \u2013 May 2026 (Australia)", "summary": "The first edition of Savills Australia's new monthly residential research update covering Australia's housing markets. The May 2026 edition focuses on the drivers behind Perth's continued price growth, Sydney's bifurcated market conditions, and key themes ahead of the Federal Budget. It serves as a regular pulse check bringing together data and on-the-ground market insight across Australia's increasingly uneven residential markets.", "sector": "Residential", "market": "Australia", "primeYield": null, "primeRent": null, "url": "https://www.savills.com.au/research/residential-review-may-2026.aspx", "id": 84}, {"publishDate": "2026-05-07", "firm": "Knight Frank", "title": "Australian Office Indicators Q1 2026", "summary": "Net effective rents in Sydney CBD rose 10.2% and Melbourne CBD rose 6.8% over the 12 months to end-March 2026 \u2014 the fastest post-pandemic growth rates. Brisbane CBD led with 11.7% annual net effective rental growth. Core precincts outperformed significantly: Sydney Core surged 14.3% and Melbourne Eastern Core jumped 16.1% YoY, creating a 54% and 93% premium respectively over non-core CBD locations.", "sector": "Office", "market": "Australia", "primeYield": null, "primeRent": "Sydney: +8.6% YoY prime net face rent; Brisbane: +8.2% YoY; Melbourne: CBD NER +6.8% YoY", "url": "https://www.knightfrank.com.au/blog/amp/2026/05/15/australias-larger-cbds-recording-robust-office-rental-growth", "id": 99}, {"publishDate": "2026-05-07", "firm": "Knight Frank", "title": "Asia-Pacific Q1 2026 Office Highlights \u2014 Australia Focus", "summary": "Knight Frank's APAC Office Highlights found Australia and India are leading the regional office recovery, with annual prime net face rent growth in Sydney at 8.6% and Brisbane at 8.2% \u2014 the second and third strongest rates in APAC after Bengaluru and Tokyo respectively. APAC-wide prime net face rents rose 0.8% in Q1 2026, with 18 of 24 monitored cities recording stable or increasing rents despite geopolitical uncertainty.", "sector": "Office", "market": "Australia", "primeYield": null, "primeRent": "Sydney: +8.6% YoY prime net face rent; Brisbane: +8.2% YoY", "url": "https://kfmap.asia/research/asia-pacific-q1-2026-office-highlights/4875", "id": 120}, {"publishDate": "2026-05-06", "firm": "Knight Frank", "title": "Hong Kong's Prime Market Turns a Corner", "summary": "Hong Kong prime residential prices slipped 2.1% in 2025 per the PIRI 100, yet super-prime activity surged with 81 US$10 million+ transactions in Q4 \u2014 second globally only to Dubai. Morgan Stanley raised its 2026 Hong Kong home-price growth estimate to 12%, citing strong sell-through rates, declining inventory, and falling land supply. Momentum is driven by a resurgent IPO market, mainland Chinese wealth inflows, and expanded talent visa schemes.", "sector": "Residential", "market": "Hong Kong", "primeYield": null, "primeRent": null, "url": "https://www.knightfrank.co.uk/research/article/2026/5/hong-kongs-prime-market-turns-a-corner", "id": 97}, {"publishDate": "2026-05-05", "firm": "Savills", "title": "Seoul Prime Office Market Monitor Q1/2026 \u2013 Vacancy and Absorption", "summary": "Seoul's prime office market recorded negative net absorption of -26,900 sq m in Q1 2026, pushing average vacancy up 0.4 percentage points QoQ to 4.0%. The CBD bore the brunt, with net absorption of -22,100 sq m and vacancy rising to 5.5%, while the Gangnam Business District was the only major submarket to post positive net absorption with v ort 2026", "summary": "Knight Frank's 20th annual Wealth Report finds the global UHNW population reached 713,626 in 2026, with Asia-Pacific holding nearly 31% of the total. Tokyo led the PIRI 100 Prime International Residential Index with a 58.5% surge in prime residential prices in 2025, while Singapore's UHNW population is forecast to grow 46% by 2031 and Brisbane is identified as a next-tier global luxury market driven by the 2032 Olympics infrastructure pipeline. Australia's billionaire population is forecast to grow 77% over five years.", "sector": "Residential", "market": "APAC", "primeYield": null, "primeRent": "Tokyo prime new-build: +58.5% in 2025; Hong Kong prime: -2.1% in 2025; Singapore luxury residential: +7.9% in 2025", "url": "https://www.knightfrank.com/research", "id": 111}, {"publishDate": "2026-04-24", "firm": "Knight Frank", "title": "Prime International Residential Index (PIRI 100) \u2014 2025 Annual Results", "summary": "The PIRI 100 recorded 3.2% average price growth across 100 tracked luxury markets in 2025, with 73 markets seeing increases. Asia-Pacific averaged 3.6% growth, with Tokyo leading globally at +58.5% driven by yen weakness and prime supply scarcity. Hong Kong recorded a -2.1% annual decline in prime prices, though super-prime activity surged with 81 US$10 million+ transactions in Q4 2025. The report is published as part of The Wealth Report 2026.", "sector": "Residential", "market": "APAC", "primeYield": null, "primeRent": "Tokyo: +58.5%; Hong Kong: -2.1%; APAC average: +3.6% (all in 2025)", "url": "https://www.knightfrank.com/research", "id": 116}, {"publishDate": "2026-04-21", "firm": "Savills", "title": "Singapore Office Market Q1/2026", "summary": "Savills revised its Singapore office rental forecast for 2026 upward from 2% to 3%\u20135% YoY growth, supported by tight supply and sustained occupancy. CBD Grade A rents rose 0.6% QoQ to a post-2019 high of S$10.02 per sq ft (eighth consecutive quarter of gains), while Grade AAA ld": null, "primeRent": null, "id": 6}, {"publish_date": "2026-05-11", "firm": "CBRE", "title": "Japan Retail MarketView Q1 2026", "summary": "Average rents set new all-time highs in five of the ten surveyed high street areas in Q1 2026 \u2014 Ginza, Omotesando/Harajuku, Shibuya, Shinsaibashi, and Kyoto \u2014 driven by fashion sector demand and new brand store openings. Vacancy in both Ginza and Shibuya remained at 0.0%, reflecting extremely tight supply conditions. Multiple retailers competing for single available units has become increasingly common, and CBRE expects average rents to continue on an upward trend.", "sector": "Retail", "market": "Tokyo", "prime_yield": null, "prime_rent": "Ginza and Shibuya vacancy at 0.0%; rents at new all-time highs in these markets", "url": "https://www.cbre.co.jp/en/insights/figures/japan-retail-marketview-q1-2026", "publishDate": "2026-04-15", "primeYield": null, "primeRent": null, "id": 7}, {"publish_date": "2026-05-08", "firm": "CBRE", "title": "Asia Pacific Figures Q1 2026", "summary": "Asia Pacific commercial real estate investment volume fell 9% QoQ to US$46.2 billion in Q1 2026, pulling back from the prior quarter's record high, but was up 18% YoY on an annual basis. Asia-wide Grade A office net absorption totalled 17.3 million sq. ft. NFA, up 7.8% QoQ and broadly on track with 2025 levels, with occupier sentiment remaining resilient despite the onset of the Middle East conflict. Logistics leasing momentum slowed in Q1 2026 after a relatively robust previous quarter.", "sector": "Mixed/Cross-Sector", "market": "APAC", "prime_yield": null, "prime_rent": null, "url": "https://www.cbre.com/insights/figures/asia-pacific-figures-q1-2026", "publishDate": "2026-04-15", "primeYield": null, "primeRent": null, "id": 8}, {"publish_date": "2026-04-27", "firm": "CBRE", "title": "Japan Logistics MarketView Q1 2026", "summary": "The Greater Tokyo logistics vacancy rate decreased 0.6 pp QoQ to 9.2% in Q1 2026, with net absorption significantly surpassing the five-year quarterly average on strong demand for existing properties; effective rents rose 0.9% QoQ to JPY 4,530. Greater Osaka saw the vacancy rate fall sharply by 1.5 pp to 2.2%, with three new properties completing at full occupancy and effective rents rising 1.2% QoQ to JPY 4,350. Greater Nagoya vacancy increased to 16.8%, though effective rents still rose marginally to JPY 3,740.", "sector": "Industrial & Logistics", "market": "Tokyo", "prime_yield": null, "prime_rent": "Greater Tokyo effective logistics rent: JPY 4,530/tsubo (+0.9% QoQ); Greater Osaka: JPY 4,350/tsubo (+1.2% QoQ); Greater Nagoya: JPY 3,740/tsubo", "url": "https://www.cbre.co.jp/en/insights/figures/japan-logistics-marketview-q1-2026", "publishDate": "2026-04-15", "primeYield": null, "primeRent": null, "id": 11}, {"publish_date": "2026-04-24", "firm": "CBRE", "title": "Japan Office MarketView Q1 2026", "summary": "Tokyo's All-Grade office vacancy rate fell 0.1 pp QoQ to 1.5% in Q1 2026, with net absorption of 114,000 tsubo surpassing the new supply of 103,000 tsubo; Grade A and Grade A- rents both recorded their second-highest QoQ growth rates on record. In Osaka, the All-Grade vacancy rate declined to 2.0%, with Grade B rents surging 3.9% QoQ to JPY 16,150 \u2014 surpassing the previous peak set in Q1 2008. All-Grade rents rose in nine of the ten surveyed regional cities, with Sapporo, Saitama, Hiroshima, and Fukuoka continuing to set record highs.", "sector": "Office", "market": "Tokyo", "prime_yield": null, "prime_rent": "Tokyo Grade A rents: +5.4% QoQ (second-highest growth on record); Osaka Grade B rents: JPY 16,150 (new record high)", "url": "https://www.cbre.com/insights/figures/japan-office-marketview-q1-2026", "publishDate": "2026-04-15", "primeYield": null, "primeRent": null, "id": 12}, {"publish_date": "2026-04-23", "firm": "CBRE", "title": "Australia Retail Figures Q1 2026", "summary": "Net face rents grew across all retail sectors in Australia in Q1 2026, with CBD secondary and super prime assets recording the highest growth of 2.3% and 2.2% QoQ respectively. Shopping centre and large format yields continued to compress, with large format centres compressing 4 bps QoQ, while there were 32 retail transactions exceeding A$5 million totalling c.A$1.67 billion. Consumer sentiment declined significantly, with the Westpac-Melbourne Institute Index falling 12.5% to 80.1 in April amid global uncertainty.", "sector": "Retail", "market": "Australia", "prime_yield": "Regional centres compressing 1 bp QoQ; sub-regional 2 bps; large format 4 bps; CBD super prime expanded 5 bps QoQ", "prime_rent": "CBD super prime rents: +2.2% QoQ; CBD secondary: +2.3% QoQ", "url": "https://www.cbre.com.au/insights/figures/australia-retail-figures-q1-2026", "publishDate": "2026-04-15", "primeYield": null, "primeRent": null, "id": 13}, {"publish_date": "2026-04-17", "firm": "CBRE", "title": "Asia Pacific Office Trends Q1 2026", "summary": "Asia Pacific office leasing was broadly unaffected by the onset of the Middle East conflict in Q1 2026, though several Southeast Asian markets implemented work-from-home policies to reduce energy and fuel demand. Singapore's office market carried its positive momentum into 2026, underpinned by strong occupier demand and record-low vacancy, with the banking and financial sector \u2014 led by wealth management, hedge funds, and quant trading firms \u2014 remaining the key demand driver. Tokyo's office market remains exceptionally tight due to robust domestic demand, with more landlords incorporating CPI-linked clauses in lease contracts for annual rental adjustments.", "sector": "Office", "market": "APAC", "prime_yield": null, "prime_rent": null, "url": "https://www.cbre.com/insights/figures/asia-pacific-office-trends-q1-2026", "publishDate": "2026-04-15", "primeYield": null, "primeRent": null, "id": 15}, {"publish_date": "2026-04-17", "firm": "CBRE", "title": "Asia Pacific Industrial & Logistics Trends Q1 2026", "summary": "Recent oil price volatility has emerged as a key risk for the Asia Pacific industrial and logistics market, with higher transport costs and supply chain disruption weighing on occupier demand, though traditional 3PL operators continued to underpin leasing activity in Q1 2026. In Australia, 3PL operators are consolidating from older second-generation facilities into new super prime assets, while renewals drive the bulk of leasing activity due to tight availability and elevated fit-out costs. Japan's Greater Tokyo logistics market continues to recover from previous supply spikes with overall vacancy trending downward, while Greater Osaka saw robust leasing supported by domestic consumption.", "sector": "Industrial & Logistics", "market": "APAC", "prime_yield": null, "prime_rent": null, "url": "https://www.cbre.com/insights/figures/asia-pacific-industrial-logistics-trends-q1-2026", "publishDate": "2026-04-15", "primeYield": null, "primeRent": null, "id": 16}, {"publish_date": "2026-04-15", "firm": "CBRE", "title": "Seoul Figures Q1 2026", "summary": "Average Grade A office vacancy across Seoul's three major business districts declined to 2.8% in Q1 2026, stabilising the market, though new leasing volume fell both QoQ and YoY amid a wait-and-see stance ahead of anticipated Q2 CBD completions. Logistics supply in 2026 is forecast at a decade low, driving vacancy to continue declining from its 2024 peak with dry storage vacancy falling below 10%, while 3PL and e-commerce tenants accounted for 65% of new take-up. Overall Seoul investment volume declined 17% YoY, though strategic investor-led office acquisitions and selective prime logistics transactions continued.", "sector": "Mixed/Cross-Sector", "market": "Seoul", "prime_yield": null, "prime_rent": null, "url": "https://www.cbrekorea.com/en/insights/figures/seoul-figures-q1-2026", "publishDate": "2026-04-15", "primeYield": null, "primeRent": null, "id": 18}, {"publish_date": "2026-04-15", "firm": "CBRE", "title": "Brisbane CBD Office Figures Q1 2026", "summary": "Brisbane CBD prime gross face rents grew 3.7% QoQ and 9.2% YoY in Q1 2026, among the strongest performances in Australia, with incentives declining 50 bps to average 38.9%. Prime CBD yields tightened slightly by 2 bps to 7.02%, reflecting late 2025 transaction activity. Market sentiment is noticeably improved year-on-year, with more tenants engaging with the market, though rising bond rates and the cash rate are creating some near-term investment uncertainty.", "sector": "Office", "market": "Australia", "prime_yield": "Brisbane prime CBD office yield: 7.02% (tightened 2 bps QoQ)", "prime_rent": "Brisbane CBD prime gross face rent: +3.7% QoQ, +9.2% YoY in Q1 2026", "url": "https://www.cbre.com.au/insights/figures/brisbane-cbd-office-figures-q1-2026", "publishDate": "2026-04-15", "primeYield": null, "primeRent": null, "id": 19}, {"publish_date": "2026-04-14", "firm": "CBRE", "title": "Australia CBD Office Figures Q1 2026", "summary": "Australian CBD prime effective rents climbed 1.8% QoQ and 6.6% YoY in Q1 2026, the highest annual growth since early 2019, driven by the lowest new supply pipeline in over 30 years and improving leasing sentiment. Prime yields were stable at an average of 6.67% across Australian CBDs, with transaction activity reaching A$3.5 billion \u2014 a solid start to the year despite global headwinds from the Middle East conflict. No new office space was delivered to the Sydney CBD in 2026, and development is set to slow substantially going forward.", "sector": "Office", "market": "Australia", "prime_yield": "Australian CBD prime office yield: 6.67% average (stable in Q1 2026)", "prime_rent": "Australian CBD prime effective rents: +1.8% QoQ, +6.6% YoY in Q1 2026", "url": "https://www.cbre.com.au/insights/figures/australia-cbd-office-figures-q1-2026", "publishDate": "2026-04-15", "primeYield": null, "primeRent": null, "id": 20}, {"publish_date": "2026-04-14", "firm": "CBRE", "title": "Sydney CBD Office Figures Q1 2026", "summary": "CBRE received 141 leasing enquiries totalling 125,230 sqm in the Sydney CBD in Q1 2026, a 22% improvement vs Q1 2025 and a 122.7% improvement vs Q4 2025, reflecting notably stronger leasing sentiment. No new office space will be delivered to the Sydney CBD in 2026, and all four major precincts \u2014 Core, Midtown, Walsh Bay, and Western Corridor \u2014 recorded strong prime net effective rent growth. Investment volumes reached A$1.1 billion in the Sydney CBD in Q1 2026, with cap rates held stable despite global headwinds.", "sector": "Office", "market": "Australia", "prime_yield": null, "prime_rent": "Sydney CBD overall vacancy: 13.8% at H2 2025; all precincts recording strong prime net effective rent growth", "url": "https://www.cbre.com.au/insights/figures/sydney-cbd-office-figures-q1-2026", "publishDate": "2026-04-15", "primeYield": null, "primeRent": null, "id": 21}, {"publish_date": "2026-04-14", "firm": "CBRE", "title": "Hong Kong Figures \u2013 Office Q1 2026", "summary": "Hong Kong Grade A office rents increased 1.6% QoQ in Q1 2026 \u2014 the strongest growth since Q3 2018 \u2014 driven primarily by Central (+5.9% QoQ) and Greater Tsim Sha Tsui (+0.9% QoQ), with Grade A1 buildings in Central recording their strongest gains since Q3 2010 at +12.1% QoQ. No new supply was delivered this quarter, and with positive net absorption of 375,400 sq. ft. (a fourth consecutive positive quarter), overall vacancy fell 0.4 pp to 16.8%, the biggest single-quarter decline since Q2 2015. Over the past four quarters, cumulative net absorption has totalled 2.7 million sq. ft.", "sector": "Office", "market": "Hong Kong", "prime_yield": null, "prime_rent": "Hong Kong overall Grade A office rents: +1.6% QoQ; Central: +5.9% QoQ; Grade A1 Central: +12.1% QoQ", "url": "https://www.cbre.com.hk/insights/figures/hong-kong-figures-office-q1-2026", "publishDate": "2026-04-15", "primeYield": null, "primeRent": null, "id": 22}, {"publish_date": "2026-04-14", "firm": "CBRE", "title": "Hong Kong Figures \u2013 Retail Q1 2026", "summary": "Leasing volume in Hong Kong's core retail districts totalled 213,800 sq. ft. in Q1 2026, declining QoQ due to seasonal factors but rising YoY; fashion brands were the second most active trade at 22% of volume, their highest share since Q4 2016. Low vacancy in prime areas pushed high street shop rents up 0.9% QoQ \u2014 the fifteenth consecutive quarterly increase \u2014 with vacancy for core retail districts rising slightly to 6.8%, still near its lowest since early 2024. Mainland Chinese tea and coffee shops continued to expand across the market.", "sector": "Retail", "market": "Hong Kong", "prime_yield": null, "prime_rent": "Hong Kong high street rents: +0.9% QoQ (15th consecutive quarterly increase); core district vacancy: 6.8%", "url": "https://www.cbre.com.hk/insights/figures/hong-kong-figures-retail-q1-2026", "publishDate": "2026-04-15", "primeYield": null, "primeRent": null, "id": 23}, {"publish_date": "2026-04-14", "firm": "CBRE", "title": "Hong Kong Figures \u2013 Industrial Q1 2026", "summary": "Industrial leasing in Hong Kong remained sluggish in Q1 2026, with total leasing volume of 682,800 sq. ft. representing a 35% QoQ decline, though still up 17% YoY from a low base. Despite positive net absorption of 135,800 sq. ft. \u2014 ending four consecutive quarters of net withdrawal \u2014 overall warehouse rents fell a further 1.2% QoQ as landlords cut rates to improve occupancy, marking the ninth consecutive quarterly rental decline. Overall warehouse vacancy narrowed slightly by 0.3 pp to 12.8%.", "sector": "Industrial & Logistics", "market": "Hong Kong", "prime_yield": null, "prime_rent": "Hong Kong warehouse rents: -1.2% QoQ (9th consecutive quarterly decline); vacancy: 12.8%", "url": "https://www.cbre.com.hk/insights/figures/hong-kong-figures-industrial-q1-2026", "publishDate": "2026-04-15", "primeYield": null, "primeRent": null, "id": 24}, {"publish_date": "2026-04-14", "firm": "CBRE", "title": "Hong Kong Figures \u2013 Investment Q1 2026", "summary": "Commercial real estate investment volume in Hong Kong surged 105% YoY to HK$12.3 billion in Q1 2026, slightly above the 2025 quarterly average of HK$11.5 billion, despite a 43% QoQ decline from the prior quarter's exceptional high. End-users were the dominant buyers at 43% of total volume, with 14 of the 29 transactions involving financially stressed assets totalling HK$8.7 billion. Hotel investment gained traction as institutional investors targeted student hostel conversions.", "sector": "Investment", "market": "Hong Kong", "prime_yield": null, "prime_rent": null, "url": "https://www.cbre.com.hk/insights/figures/hong-kong-figures-investment-q1-2026", "publishDate": "2026-04-15", "primeYield": null, "primeRent": null, "id": 25}, {"publish_date": "2026-04-13", "firm": "CBRE", "title": "Australia Industrial and Logistics Figures Q1 2026", "summary": "Gross take-up in Australia's industrial and logistics market moderated to approximately 680,000 sqm in Q1 2026, with approximately 700,000 sqm delivered as the development pipeline remains elevated. National super prime midpoint yields expanded marginally to 5.7%, reflecting higher interest rates and elevated bond yields, while effective rents returned to growth as face rental growth began to offset elevated incentives. Close to 40% of the 2026-2027 supply pipeline is pre-committed, with investment sales for income-producing assets totalling close to A$1 billion.", "sector": "Industrial & Logistics", "market": "Australia", "prime_yield": "National super prime industrial midpoint yield: 5.7% (expanded marginally in Q1 2026)", "prime_rent": "Effective rents returned to growth in Q1 2026; Sydney super prime net face rent: +1.8% YoY", "url": "https://www.cbre.com.au/insights/figures/australia-industrial-and-logistics-figures-q1-2026", "publishDate": "2026-04-15", "primeYield": null, "primeRent": null, "id": 26}, {"publish_date": "2026-04-10", "firm": "CBRE", "title": "Singapore Figures Q1 2026", "summary": "Singapore's Core CBD Grade A office vacancy compressed to a record low of 3.3% in Q1 2026, down from 4.5% in Q4 2025, underpinned by strong occupier demand led by the banking and financial sector. Prime logistics rents were flat after 1.1% QoQ growth last quarter, while islandwide prime retail rents rose 0.5% QoQ with growth recorded across all submarkets. Real estate investment volumes surged to a record quarterly high of S$19.89 billion, nearly tripling YoY on several large-ticket portfolio deals and a REIT IPO.", "sector": "Mixed/Cross-Sector", "market": "Singapore", "prime_yield": null, "prime_rent": "Singapore Core CBD Grade A office vacancy: 3.3% (record low); prime retail rents: +0.5% QoQ; prime logistics rents: flat in Q1 2026", "url": "https://www.cbre.com.sg/insights/figures/singapore-figures-q1-2026", "publishDate": "2026-04-15", "primeYield": null, "primeRent": null, "id": 28}, {"publish_date": "2026-05-19", "firm": "JLL", "title": "Asia Pacific commercial real estate investment surges to record USD 47.0 billion in Q1 2026", "summary": "JLL's press release and data report covering APAC capital markets in Q1 2026. Total CRE investment reached USD 47.0 billion, a 31% YoY increase and the region's strongest first-quarter performance on record. Japan led at USD 13.2 billion, Singapore surged 433% to USD 11.5 billion (driven by mega-fund asset transfers), Australia recorded USD 5.7 billion (+49% YoY), Hong Kong rose 41% to USD 1.6 billion, and South Korea reached USD 4.8 billion. Cross-border capital flows hit an all-time quarterly high of USD 16.3 billion, up 87% YoY.", "sector": "Investment", "market": "APAC", "prime_yield": "Hong Kong distressed retail initial yields compressed from ~9.4% (Q4 2025) to ~6.4% (Q1 2026)", "prime_rent": null, "url": "https://www.jll.com/en-hk/newsroom/asia-pacific-commercial-real-estate-investment-surges-to-record-usd-47-billion-in-q1-2026", "publishDate": "2026 ": "2026-05-20", "firm": "JLL", "title": "Singapore Office Market Dynamics Q1 2026", "summary": "JLL's city-level report on Singapore's CBD office market. Positive leasing momentum from 2025 carried into Q1 2026, with vacancy tightening more significantly for prime properties. There were no major office completions during the quarter. Office rent growth continued, though quarter-on-quarter gains fell back to the sub-1% region. The Marina Bay submarket led the drop in vacancy rates, and some spaces were re-let before the current occupants vacated, reflecting strong demand for premium space.", "sector": "Office", "market": "Singapore", "prime_yield": null, "prime_rent": "CBD office rent growth: sub-1% q-o-q in Q1 2026; Core CBD vacancy tightened (Marina Bay leading decline)", "url": "https://research.jllapsites.com/appd-market-report/q1-2026-office-singapore/", "publishDate": "2026-04-15", "primeYield": null, "primeRent": null, "id": 36}, {"publish_date": "2026-05-18", "firm": "JLL", "title": "Hong Kong Office Market Dynamics Q1 2026", "summary": "JLL's Q1 2026 analysis of Hong Kong's office market. Total net absorption reached 614,300 sqft but fell 59.7% QoQ from the elevated Q4 2025 base. The overall office vacancy rate stood at 13.5% at end-March; Central vacancy dropped 1.4 ppts QoQ to 9.6%\u2014single-digit for the first time since 2023, driven by financial sector demand. Overall office rent rose 1.5% QoQ, with Central leading at +3.8% QoQ. Grade A capital values dipped 0.4% QoQ. Rents are projected to decline moderately by 0\u20135% in full-year 2026.", "sector": "Office", "market": "Hong Kong", "prime_yield": null, "prime_rent": "Overall Grade A office rent: +1.5% q-o-q in Q1 2026; Central rent: +3.8% q-o-q (Central vacancy: 9.6%)", "url": "https://research.jllapsites.com/appd-market-report/q1-2026-office-hong-kong/", "publishDate": "2026-04-15", "primeYield": null, "primeRent": null, "id": 37}, {"publish_date": "2026-05-07", "firm": "JLL", "title": "Sydney Office Market Dynamics Q1 2026", "summary": "JLL's Q1 2026 city-level report on Sydney's office market. The Sydney office vacancy rate remained flat over the quarter. One completion was recorded across all Sydney markets totalling 4,500 sqm. Office transactions were concentrated in the metro markets, with strong CBD leasing activity fuelled by occupier expansions and a continued flight-to-quality trend. The market is underpinned by very limited new construction and low pipeline supply.", "sector": "Office", "market": "Australia", "prime_yield": null, "prime_rent": null, "url": "https://www.jll.com/en-au/insights/market-dynamics/sydney-office", "publishDate": "2026-04-15", "primeYield": null, "primeRent": null, "id": 38}, {"publish_date": "2026-05-06", "firm": "JLL", "title": "Melbourne Office Market Dynamics Q1 2026", "summary": "JLL's Q1 2026 city-level report on Melbourne's office market. Net absorption was negative across the CBD, Fringe, and South East Suburban (S.E.S.) markets during the quarter. Headline vacancy remained elevated across all three markets. Leasing remained largely confined to prime-grade assets despite market-wide headwinds, reflecting the ongoing flight-to-quality trend across Australian office markets.", "sector": "Office", "market": "Australia", "prime_yield": null, "prime_rent": null, "url": "https://www.jll.com/en-au/insights/market-dynamics/melbourne-office", "publishDate": "2026-04-15", "primeYield": null, "primeRent": null, "id": 39}, {"publish_date": "2026-05-18", "firm": "JLL", "title": "Asia Pacific Industrial Market Dynamics Q1 2026", "summary": "JLL's regional industrial and logistics market update for Q1 2026. Net absorption slowed QoQ to majority Tier-1 cities, with notable improvements in Beijing, Shanghai, Tokyo, and Sydney. Vacancy continued to decline regionally, driven by a fall in completions, signalling market recovery from a high-vacancy environment. Rental growth was observed in select Tier-1 markets including Seoul, Singap nts and capital values rose QoQ for the first time after six consecutive quarters of stability\u2014ending a prolonged period of flat metrics. Yields were kept unchanged. Notable Q1 2026 deals included UI Boustead REIT acquiring three logistics assets for SGD 138.8 million and CapitaLand Ascendas REIT purchasing a facility for SGD 504.2 million. Capital value growth could outpace rental growth and tighten yields by year-end.", "sector": "Industrial & Logistics", "market": "Singapore", "prime_yield": "Yields unchanged in Q1 2026; capital value growth expected to tighten yields by year-end", "prime_rent": "Islandwide average rent: rose q-o-q in Q1 2026 (first increase after 6 consecutive stable quarters)", "url": "https://research.jllapsites.com/appd-market-report/q1-2026-logistics-industrial-singapore/", "publishDate": "2026-04-15", "primeYield": null, "primeRent": null, "id": 44}, {"publish_date": "2026-05-14", "firm": "JLL", "title": "Industrial Real Estate Market Analysis Q1 2026: Latest Industrial Vacancy Rates Across Australia", "summary": "JLL's comprehensive industrial vacancy and supply update for Australia. Vacancy was broadly stable in Sydney, Melbourne, and Brisbane in Q1 2026. Sydney recorded 5.8% vacancy across 23.5 million sqm, Melbourne 5.2% across 30.6 million sqm (Australia's largest market), Brisbane 5.3% across 13.8 million sqm, and Perth the lowest nationally at 2.0%. Sub-lease vacancy decreased in Sydney (to 1.1%) and Melbourne (to 1.0%). The 45,000+ sqm cohort was the tightest nationally at 2.9% vacancy.", "sector": "Industrial & Logistics", "market": "Australia", "prime_yield": null, "prime_rent": null, "url": "https://www.jll.com/en-au/insights/market-dynamics/latest-industrial-vacancy-rates-across-australia", "publishDate": "2026-04-15", "primeYield": null, "primeRent": null, "id": 45}, {"publish_date": "2026-05-20", "firm": "JLL", "title": "Sydney Industrial/Logistics Market Dynamics Q1 2026", "summary": "JLL's city-level Q1 2026 report on S  several high-profile store closures, with vacancies quickly backfilled by new and existing brands. The retail sector continues to benefit from strong household spending, tourism recovery, and the flight of shoppers back to prime malls and street-level retail. Supply constraints continue to underpin rental stability in well-located assets.", "sector": "Retail", "market": "Singapore", "primeYield": null, "primeRent": null, "url": "https://www.knightfrank.com.sg/research", "id": 105}, {"publishDate": "2026-04-15", "firm": "Knight Frank", "title": "Singapore Residential Market Update Q1 2026", "summary": "Private home prices rose at a faster pace in Q1 2026, though overall sales activity softened. Rental prices rebounded marginally from a 0.5% QoQ drop in Q4 2025 to a 0.3% increase in Q1 2026. Executive Condominiums were the standout performer, with transaction volume tripling to approximately 1,500 units, while District 10 median prices surged over 40% driven by large-format freehold resale demand.", "sector": "Residential", "market": "Singapore", "primeYield": null, "primeRent": "+0.3% QoQ residential rents in Q1 2026", "url": "https://www.knightfrank.com.sg/research", "id": 106}, {"publishDate": "2026-04-15", "firm": "Knight Frank", "title": "Singapore Auction Market Update Q1 2026", "summary": "Knight Frank's quarterly Singapore Auction Market Update for Q1 2026 reports on the performance of residential and commercial property auctions in Singapore. The report covers auction volumes, hammer rates, and key transactions across both residential and commercial sectors, providing insights into distressed and voluntary auction activity in the current market environment.", "sector": "Mixed/Cross-Sector", "market": "Singapore", "primeYield": null, "primeRent": null, "url": "https://www.knightfrank.com.sg/research", "id": 107}, {"publishDate": "2026-04-09", "firm": "Knight Frank", "title": "Singapore Investment Market Update Q1 2026 (Full Report)", "summary": "Knight Frank Singapore's comprehensive Q1 2026 Investment Market Update reports on investment sales reaching S$15.4 billion \u2014 the highest first-quarter figure on record. Commercial property led all sectors with S$6.3 billion in transactions despite a 17.2% QoQ decline, while industrial activity rose sharply to S$3.1 billion. Outbound investment from Singapore rose 7.8% QoQ to S$10.3 billion as entities sought stable markets and income resilience.", "sector": "Investment", "market": "Singapore", "primeYield": null, "primeRent": null, "url": "https://www.knightfrank.com.sg/research", "id": 123}, {"publishDate": "2026-04-07", "firm": "Knight Frank", "title": "Singapore Office Market Update Q1 2026", "summary": "Singapore office rents in the Central Region declined marginally by 0.2% QoQ in Q1 2026 per URA data, though prime Grade A CBD rents continued their recovery with islandwide office vacancy falling to 10.8% \u2014 its fourth consecutive quarter of improvement. Total available shadow space decreased by 2.3% to 422,000 sq ft NLA. The market continues to exhibit a flight-to-quality dynamic with premium Grade A buildings maintaining pricing power.", "sector": "Office", "market": "Singapore", "primeYield": null, "primeRent": "-0.2% QoQ (Central Region); Grade A CBD prime rents rising", "url": "https://www.knightfrank.com.sg/research", "id": 103}, {"publishDate": "2026-04-06", "firm": "Knight Frank", "title": "Singapore Investment Market Update Q1 2026", "summary": "Singapore real estate investment sales hit a record Q1 high of S$15.4 billion \u2014 up 166.5% YoY and 10% QoQ \u2014 driven by a low interest rate environment and key transactions including the injection of Asia Square Tower 1 into a private fund (~S$4.1 billion) and the sale of 78 Shenton Way (~S$615 million). Commercial sector led with S$6.3 billion, while industrial reached S$3.1 billion. Knight Frank maintained its full-year 2026 investment sales forecast at approximately S$30 billion.", "sector": "Investment", "market": "Singapore", "primeYield": null, "primeRent": null, "url": "https://www.knightfrank.com.sg/research", "id": 102}, {"publishDate": "2026-04-02", "firm": "Knight Frank", "title": "Data Centres Global Report 2026", "summary": "Knight Frank's global data centre report covers the rapidly expanding sector shaped by AI, hyperscale demand, and new financing models. The report forecasts data centre capacity growth of almost 25% over the next two years globally, with over 80% of 2026 APAC capacity already pre-let. Japan has seen the largest-ever data centre financing deal in the country, and the report notes US$15 billion invested in APAC data centres in 2025 alone.", "sector": "Data Centre", "market": "APAC", "primeYield": null, "primeRent": null, "url": "https://www.knightfrank.com/research", "id": 112}, {"publish_date": "2026-05-27", "firm": "CBRE", "title": "Japan 2026 Logistics Occupier Survey", "summary": "CBRE's 2026 Logistics Occupier Survey, conducted in March 2026, finds that Japanese logistics occupiers are increasingly focused on attracting and retaining staff and improving operational efficiency. A mandatory Chief Logistics Officer (CLO) appointment requirement under the revised Act on Advancement of Integration and Streamlining of Distribution Business, effective April 2026, is expected to accelerate efficiency measures. Appetite for relocation and expansion remains robust, with some occupiers renewing contracts multiple times at the same facility.", "sector": "Industrial & Logistics", "market": "Tokyo", "prime_yield": null, "prime_rent": null, "url": "https://www.cbre.co.jp/en/insights/reports/japan-2026-logistics-occupier-survey", "publishDate": "2026-04-01", "primeYield": null, "primeRent": null, "id": 1}, {"publish_date": "2026-05-21", "firm": "CBRE", "title": "2026 Asia Pacific Data Centre Trends & Outlook", "summary": "The Asia Pacific data centre market continues to experience an unprecedented boom, with demand expanding rapidly on the back of AI implementation, cloud adoption, and digitalisation. Global hyperscale demand is growing at a CAGR of 14%, and tech firms plan to increase CapEx on AI by 61% in 2026. Direct investment volume reached a record high of US$11.6 billion in 2025, with neocloud providers emerging as a new demand driver; power availability and elevated construction costs remain the two most pressing challenges to expansion.", "sector": "Data Centre", "market": "APAC", "prime_yield": null, "prime_rent": null, "url": "https://www.cbre.com/insights/reports/2026-asia-pacific-data-centre-trends-and-outlook", "publishDate": "2026-04-01", "primeYield": null, "primeRent": null, "id": 2}, {"publish_date": "2026-05-18", "firm": "CBRE", "title": "Japan Viewpoint: Shifting Domestic Consumption Patterns to Boost Demand for High Street Stores", "summary": "This viewpoint examines how shifting domestic consumption patterns in Japan are expected to generate stronger demand for high street retail space. CBRE notes that supply-demand conditions remain extremely tight, with several of the nine surveyed high street areas posting vacancy rates of 0%. Rents have exceeded pre-pandemic peaks in seven of the nine surveyed areas, and CBRE projects Ginza high street rents to reach JPY 299,500 per tsubo by end-2027.", "sector": "Retail", "market": "Tokyo", "prime_yield": null, "prime_rent": "Ginza high street rent projected to reach JPY 299,500/tsubo by end-2027", "url": "https://www.cbre.co.jp/en/insights/articles/japan-viewpoint-shifting-domestic-consumption-patterns-to-boost-demand-for-high-street-stores", "publishDate": "2026-04-01", "primeYield": null, "primeRent": null, "id": 4}, {"publish_date": "2026-05-13", "firm": "CBRE", "title": "2025 Tokyo Flexible Office Market", "summary": "The Tokyo flexible office market grew moderately by 5.0% YoY in 2025, with flexible space accounting for 3.3% of the total Tokyo office market. Operators are increasingly selecting high-grade buildings with strong amenities to support talent attraction and flexible work styles, with the share of new openings in Tokyo's five central wards increasing. Companies using flexible office space have been more successful in talent recruitment, and firms planning to increase usage significantly outnumber those planning to reduce it.", "sector": "Office", "market": "Tokyo", "prime_yield": null, "prime_rent": null, "url": "https://www.cbre.co.jp/en/insights/reports/2025-tokyo-flexible-office-market", "publishDate": "2026-04-01", "primeYield": null, "primeRent": null, "id": 5}, {"publish_date": "2026-05-29", "firm": "CBRE", "title": "The Leasing Gauge 2026", "summary": "CBRE's Leasing Gauge 2026 report for Australia examines commercial real estate leasing conditions across key property sectors, noting that supply constraints are intensifying across markets and rent growth is tracking above expectations. The report highlights that economic rents continue to sit 20-30% above market rents as construction costs remain elevated, favouring a buy-over-build strategy. Both office and retail sectors are showing stronger leasing fundamentals than anticipated at the start of the year.", "sector": "Mixed/Cross-Sector", "market": "Australia", "prime_yield": null, "prime_rent": null, "url": "https://www.cbre.com.au/insights/reports/the-leasing-gauge-2026", "publishDate": "2026-04-01", "primeYield": null, "primeRent": null, "id": 9}, {"publish_date": "2026-05-26", "firm": "CBRE", "title": "Retail Built to Endure: The Resilience of Australian Shopping Centres", "summary": "Australian shopping centres are delivering income stability in uncertain markets, benefiting from strong population growth, limited new supply, and improved tenant economics that position retail as a defensive asset class with resilient income-led returns. Shopping centre rents are forecast to rise in the mid-single digit range in 2026, with Perth outperforming and vacancy rates remaining below 5% across most submarkets. Development costs and land prices are constraining new supply pipelines, further underpinning the outlook for existing assets.", "sector": "Retail", "market": "Australia", "prime_yield": null, "prime_rent": "Shopping centre rents forecast to rise mid-single digits in 2026; Sydney and Perth pacing at +7% YoY", "url": "https://www.cbre.com.au/insights/articles/retail-built-to-endure-the-resilience-of-australian-shopping-centres", "publishDate": "2026-04-01", "primeYield": null, "primeRent": null, "id": 10}, {"publish_date": "2026-04-22", "firm": "CBRE", "title": "Hong Kong Viewpoint: Recovery Time \u2013 How Financial Sector Demand is Reviving Hong Kong's Grade A Office Market", "summary": "Strong capital market performance, increasing wealth inflows, and supportive government policies are reinforcing Hong Kong's status as a leading global financial hub and underpinning a rebound in office leasing demand, predominantly in the Central CBD. Financial sector demand \u2014 particularly from wealth management, insurance, and non-bank financial firms \u2014 is driving a sustained recovery in Central Grade A office rents and absorbing vacancy. CBRE identifies the financial sector as the key structural driver of Hong Kong's office market revival in 2026.", "sector": "Office", "market": "Hong Kong", "prime_yield": null, "prime_rent": null, "url": "https://www.cbre.com.hk/insights/articles/hong-kong-viewpoint-recovery-time-how-financial-sector-demand-is-reviving-hong-kongs-grade-a-office-market", "publishDate": "2026-04-01", "primeYield": null, "primeRent": null, "id": 14}, {"publish_date": "2026-04-16", "firm": "CBRE", "title": "Talking Property \u2013 The House View Q2 2026", "summary": "CBRE Australia's Head of Research Sameer Chopra and Phil Rowland discuss the rapidly shifting economic and geopolitical landscape, noting that office prime effective rents grew 8% YoY in Brisbane and Sydney \u2014 far ahead of year-start expectations \u2014 and industrial net effective rents declined approximately 2.5% in Sydney and Melbourne due to elevated incentives amid new supply. CBRE now expects transaction volumes to grow approximately 5% in 2026 (revised down from 10%), with cap rate expansion of 10-15 bps in office, 25-35 bps in industrial, and 10-15 bps in shopping centres. Supply constraints are intensifying across all sectors as construction cost forecasts have risen materially.", "sector": "Mixed/Cross-Sector", "market": "Australia", "prime_yield": "Office cap rate expansion: 10-15 bps; industrial: 25-35 bps; shopping centres: 10-15 bps in 2026", "prime_rent": "Office: Sydney +8% YoY, Brisbane +8% YoY, Perth +5%, Melbourne +3%; Retail: Sydney/Perth regional centres +7% YoY; Industrial: Sydney/Melbourne net effective rents -2.5%", "url": "https://www.cbre.com.au/insights/talking-property-with-cbre/the-house-view-q2-2026", "publishDate": "2026-04-01", "primeYield": null, "primeRent": null, "id": 17}, {"publish_date": "2026-04-13", "firm": "CBRE", "title": "Updated Pacific Market Outlook \u2013 April 2026 Edition", "summary": "CBRE Australia updated its January 2026 Pacific Market Outlook to reflect materially higher bond yields and construction cost forecasts, with cap rate expectations revised higher by 25-35 bps for super prime industrial, approximately 25 bps for prime office, and 20-25 bps for regional malls. Transaction volume growth expectations for 2026 were reduced, with total returns shifting away from cap rate compression towards rent growth. Construction costs are forecast to grow 18% between 2026 and 2027, further constraining future supply pipelines.", "sector": "Mixed/Cross-Sector", "market": "Australia", "prime_yield": "Super prime industrial cap rate expectations +25-35 bps; prime office +25 bps; regional malls +20-25 bps vs Jan 2026 forecast", "prime_rent": null, "url": "https://www.cbre.com/insights/reports/updated-pacific-market-outlook-april-2026-edition", "publishDate": "2026-04-01", "primeYield": null, "primeRent": null, "id": 27}, {"publish_date": "2026-05-13", "firm": "JLL", "title": "Asia Pacific Capital Tracker Spring 2026: The 'HALO' Effect \u2013 Heavy Assets, Low Obsolescence", "summary": "JLL's flagship APAC capital markets research report for Spring 2026. The report documents the strongest Q1 on record for APAC CRE investment at USD 47.0 billion (+31% YoY), with Japan at USD 13.2 billion, Singapore at USD 11.5 billion, Australia at USD 5.7 billion, Hong Kong at USD 1.6 billion, and South Korea at USD 4.8 billion. Key themes include the 'HALO' concept (Heavy Assets, Low Obsolescence), the emergence of owner-occupiers in office value-add acquisitions, intense competition for core logistics assets, and surging hospitality liquidity. Tokyo office and retail rents are rising fastest in the APAC region.", "sector": "Investment", "market": "APAC", "prime_yield": null, "prime_rent": "Tokyo Grade A office rents up 22% YoY (near-zero vacancy); Tokyo retail rents up +8% YoY", "url": "https://co.jll/4wcLXuc", "publishDate": "2026-04-01", "primeYield": null, "primeRent": null, "id": 31}, {"publish_date": "2026-05-15", "firm": "JLL", "title": "Relative Affordability Drives Australian Residential Prices", "summary": "JLL Research analysis of Australian residential price dynamics, showing how buyers priced out of expensive suburbs are fuelling strong growth in more affordable markets. Perth, Adelaide, and South East Queensland averaged over 11% per year in house price growth over five years, while Sydney averaged 8% per year. Melbourne lagged at around 3.3%. Salisbury (Adelaide's north) reached a median house price of AUD 758,000 (+16.5% per year). The report highlights relative affordability as the primary structural driver of price growth, especially as high Sydney prices push buyers west and to other cities.", "sector": "Residential", "market": "Australia", "prime_yield": null, "prime_rent": "Median house prices: Salisbury AUD 758,000 (+16.5%/yr); Mosman AUD 5,240,000 (+4.3%/yr); Perth/Adelaide/SE Qld avg ~AUD 1,505,000 (vs Sydney inner >AUD 2,250,000)", "url": "https://www.jll.com/en-au/insights/relative-affordability-drives-australian-residential-prices", "publishDate": "2026-04-01", "primeYield": null, "primeRent": null, "id": 56}, {"publish_date": "2026-05-21", "firm": "JLL", "title": "Foreign Investment Shapes Korea's Co-Living Market", "summary": "JLL Research analysis of Korea's emerging co-living sector. Shifting demographics\u2014including high home prices, risk of losing Jeonse deposits, high price-to-income ratios, growing single-person households, and long-term overseas visitors\u2014have drawn foreign capital to Korea's co-living market. ICG's partnership with Homes Company established a co-living fund worth approximately KRW 300 billion. New LTV restrictions (0% in regulated areas) introduced in late 2025 are reshaping financing structures for rental housing operators.", "sector": "Residential", "market": "Seoul", "prime_yield": null, "prime_rent": null, "url": "https://www.jll.com/en-hk/insights/foreign-investment-shapes-korea-s-co-living-market", "publishDate": "2026-04-01", "primeYield": null, "primeRent": null, "id": 60}, {"publish_date": "2026-05-06", "firm": "JLL", "title": "Asia Pacific Office Fit-Out Cost Guide 2026", "summary": "JLL's annual APAC office fit-out cost benchmark drawing on data from 27 cities across 14 countries. The regional average fit-out cost across APAC is USD 1,550/sqm, with 2\u20135% year-on-year local-currency increases. Tokyo is the highest-cost city in APAC; Singapore and major Australian cities (Sydney, Melbourne, Brisbane) follow closely. Seoul sits in the mid-range, while Hong Kong serves as the baseline for the city cost index. High-cost markets reflect labour shortages and high performance standards.", "sector": "Office", "market": "APAC", "prime_yield": null, "prime_rent": "APAC average office fit-out cost: USD 1,550/sqm (+2\u20135% y-o-y); Tokyo highest; Singapore and major Australian cities next; Seoul mid-range; Hong Kong = baseline index", "url": "https://www.jll.com/en-in/guides/apac-fit-out-costs-guide", "publishDate": "2026-04-01", "primeYield": null, "primeRent": null, "id": 61}, {"publishDate": "2026-04-01", "firm": "Knight Frank", "title": "Hong Kong Monthly \u2014 April 2026", "summary": "Hong Kong's Q1 2026 residential market strengthened with total transaction volumes rising 9% QoQ to 18,654 units, driven by a 13% increase in secondary sales. Prices rose 1.8% MoM in February and 1.4% MoM in March, supported by capital inflows and stronger buyer enquiries. Knight Frank raised its full-year 2026 residential price growth forecast to 8\u201310%, with luxury rents rising 11.2% year-on-year.", "sector": "Mixed/Cross-Sector", "market": "Hong Kong", "primeYield": null, "primeRent": null, "url": "https://www.knightfrank.com.hk/blog/amp/2026/05/29/hong-kong-monthly-report-may-2026", "id": 94}, {"publishDate": "2026-04-01", "firm": "Knight Frank", "title": "Australian Retail Review \u2014 April 2026", "summary": "Australia's retail property sector delivered the strongest total return of all commercial property sectors in 2025 at 9.2%, carrying momentum into 2026 with around A$3.6 billion of retail transactions in Q1. Household spending growth and tightening supply are driving outperformance, though new geopolitical pressures from the Middle East conflict introduce uncertainty. Prime centres continue to outperform, supported by stronger sales, higher foot traffic and resilient tenant demand.", "sector": "Retail", "market": "Australia", "primeYield": null, "primeRent": null, "url": "https://www.knightfrank.com.au/research", "id": 101}, {"publishDate": "2026-04-01", "firm": "Knight Frank", "title": "Mixed-use Developments: Conduits to Quality Living \u2014 Singapore", "summary": "This Singapore thought leadership report examines how larger mixed-use units are outpacing smaller ones on price growth, and how offices are increasingly choosing to buy rather than lease as part of a broader shift toward the 'Third Place' model that integrates offices, homes and communities under one development. The report reflects evolving tenant and owner preferences for amenity-rich, live-work-play environments.", "sector": "Mixed/Cross-Sector", "market": "Singapore", "primeYield": null, "primeRent": null, "url": "https://www.knightfrank.com.sg/research", "id": 108}, {"publishDate": "2026-04-01", "firm": "Knight Frank", "title": "Leading Indicators \u2014 April 2026", "summary": "Knight Frank's monthly Leading Indicators report for April 2026 tracks key economic and financial metrics impacting property markets globally and across Asia-Pacific. Published by Chief Economist Ben Burston, the report covers macro drivers including interest rate dynamics, inflation trends, GDP growth, and capital flow signals relevant to APAC real estate markets.", "sector": "Mixed/Cross-Sector", "market": "APAC", "primeYield": null, "primeRent": null, "url": "https://www.knightfrank.com.sg/research", "id": 110}, {"publishDate": "2026-04-01", "firm": "Knight Frank", "title": "Australian Horizon Report 2026", "summary": "Knight Frank's Australian Horizon Report for 2026 examines the outlook for Australian real estate across residential, commercial and alternative sectors. The report identifies Australia as a stable, mature market for cross-border investors with billionaire wealth forecast to grow 77% over five years. Brisbane is highlighted as a next-tier global luxury market driven by the 2032 Olympics, infrastructure investment, and wealth migration from interstate.", "sector": "Mixed/Cross-Sector", "market": "Australia", "primeYield": null, "primeRent": null, "url": "https://www.knightfrank.com.au/research", "id": 119}, {"publishDate": "2026-03-30", "firm": "JLL", "title": "Singapore's Office Vacancy Tightens at the Top-Tier \u2013 Q1 2026 Update", "market": "Singapore", "sector": "Office", "summary": "JLL's Q1 2026 Singapore office market update reports that the CBD investment grade office vacancy rate declined for the fourth consecutive quarter, led by the Marina Bay sub-market where vacancy fell from 7.2% to 6.0%\u2014its lowest since IOI Central Boulevard Towers opened in mid-2024. The average gross effective rent for CBD Grade A offices reached SGD 12.04 per sq ft per month in Q1 2026\u2014its highest level since Q1 2009\u2014though the pace of rental growth moderated amid renewed tariff uncertainties. JLL projects CBD office rent growth of 4\u20135% for 2026, supported by the lowest investment-grade office completions pipeline in three years.", "url": "https://www.jll.com/en-sea/newsroom/singapore-s-office-vacancy-tightens-at-the-top-tier", "primeYield": null, "primeRent": "SGD 12.04/sqft/month", "id": 185}, {"publishDate": "2026-03-26", "firm": "JLL", "title": "Hong Kong Residential Sales Market Dynamics \u2013 March 2026", "market": "Hong Kong", "sector": "Residential", "summary": "JLL's March 2026 residential sales market dynamics report examines Hong Kong's property market transition from a period of relatively abundant supply to a more constrained pipeline amid recalibrated demand. The report analyses declining land disposals signalling a supply low in 2027\u201328, and assesses implications for pricing resilience, developer land acquisition strategies and sales and marketing approaches. This inflection point is expected to have significant effects on the broader housing ecosystem in the years ahead.", "url": "https://www.jll.com/en-hk/insights/market-dynamics/hong-kong-residential-sales", "primeYield": null, "primeRent": null, "id": 184}, {"publishDate": "2026-03-18", "firm": "CBRE", "title": "Hong Kong Viewpoint \u2013 Moving Hong Kong's Logistics Real Estate up the Value Chain", "market": "Hong Kong", "sector": "Industrial & Logistics", "summary": "This CBRE viewpoint examines Hong Kong's transformation into an international smart logistics hub, arguing that occupiers must adopt automation technology and upgrade their real estate to improve operational efficiency. Amid ongoing trade uncertainty and declining warehouse rents, landlords are increasing flexibility on rents to enhance occupancy while high-spec facilities attract flight-to-quality pre-leasing activity. The report concludes that Hong Kong's logistics market must pivot from traditional warehousing toward high-value, technology-enabled facilities to remain competitive.", "url": "https://www.cbre.com.hk/insights", "primeYield": null, "primeRent": null, "id": 143}, {"publishDate": "2026-03-16", "firm": "CBRE", "title": "2026 Korea Investor Intentions Survey", "market": "Seoul", "sector": "Capital Markets", "summary": "Korean investor purchase intentions hit an all-time survey high in CBRE's 2026 Korea Investor Intentions Survey, reflecting strong sentiment across the domestic commercial real estate market. While 2026 investment volumes are forecast to moderate 5\u201310% from 2025's record KRW 34 trillion due to base effects, structural demand across office, data centres and logistics underpins resilient investor confidence. The survey highlights data centres strengthening as policy-driven strategic assets and prime office assets remaining the dominant transaction type.", "url": "https://www.cbrekorea.com/en/insights", "primeYield": null, "primeRent": null, "id": 142}, {"publishDate": "2026-03-11", "firm": "JLL", "title": "Japan Market Dynamics \u2013 Q4 2025", "market": "Tokyo", "sector": "Multi-sector", "summary": "JLL's comprehensive Q4 2025 Japan market dynamics report covers investment market trends alongside office, retail, logistics and hotel markets across Tokyo, Osaka and Fukuoka. The report documents record investment activity in Japan's real estate market in 2025, with annual volumes reaching JPY 41.4 billion and full-year investment up 14% year-on-year. Key themes include strong rental growth across all commercial sectors, tightening logistics vacancy in Greater Tokyo, and continued investor appetite from both domestic and foreign capital.", "url": "https://www.jll.com/en-jp/insights/market-dynamics/japan", "primeYield": null, "primeRent": null, "id": 183}, {"publishDate": "2026-03-10", "firm": "JLL", "title": "Singapore Office Market Set for Continued Growth in 2026", "market": "Singapore", "sector": "Office", "summary": "JLL's March 2026 report reviews Singapore's office market resilience in 2025, noting CBD investment-grade office rents climbed 3.8% and capital values rose 4.9%\u2014nearly triple 2024 growth. Office investment sales volume reached a three-year high of nearly SGD 4 billion in 2025, driven by the return of institutional investors after a three-year absence due to high interest rates. With new office supply across the island totalling only about 4 million sq ft from 2026 to 2030\u2014below historical average annual net take-up\u2014JLL projects continued stable to modest rental growth for 2026.", "url": "https://www.jll.com/en-au/insights/singapore-office-market-set-for-continued-growth", "primeYield": null, "primeRent": null, "id": 181}, {"publishDate": "2026-03-10", "firm": "JLL", "title": "Asia Pacific Data Centre Report Year-end 2025", "market": "APAC", "sector": "Data Centre", "summary": "JLL's APAC data centre year-end 2025 report finds that increasing hyperscale commitments are fuelling a multi-year growth cycle across the region, with Asia Pacific expected to deliver 4.8 GW of new supply by 2027, of which 78% is already pre-leased, keeping vacancy in the 6.5\u20137.0% range. APAC data centre capacity is projected to expand by 24 GW between 2025 and 2030, resulting in USD 286 billion of real estate value creation. Power availability is identified as a critical constraint, with grid connection wait times ranging from 24 months in emerging markets to over eight years in core markets, driving operators to explore behind-the-meter power options.", "url": "https://www.jll.com/en-hk/insights/market-dynamics/asia-pacific-data-centre", "primeYield": null, "primeRent": mmary": "CBRE notes that Singapore's real estate investment appetite has improved amid lower interest rates, with Singapore ranking among the top three APAC investment destinations and investors deploying core-plus strategies given significant debt cost reductions that have taken the 3M SORA to approximately 1.2% in late 2025. A healthy pipeline of investment-grade assets alongside sustained rental growth across key sectors should support growth in transaction volumes in 2026. The report flags that Singapore's Core CBD Grade A vacancy compressed to record lows in late 2025, reinforcing landlord pricing power.", "url": "https://www.cbre.com.sg/insights/reports/2026-singapore-real-estate-market-outlook", "primeYield": null, "primeRent": null, "id": 150}, {"publishDate": "2026-03-01", "firm": "Savills", "title": "APAC Data Centre Investment Outlook 2026", "market": "APAC", "sector": "Data Centre", "summary": "Savills reported that the Asia Pacific data centre sector continued to attract strong investor interest in early 2026, with the regional development pipeline reaching 19.37 GW and operational capacity rising to 13.76 GW at end-2024. Southeast Asia was identified as a key growth area, with Malaysia emerging not only as a Singapore offshoot but increasingly for domestic workloads as governments digitise their economies. AI-driven infrastructure demand supported hyperscaler capex commitments exceeding USD 400 billion globally for 2026.", "url": "https://prospects.savills.com/sectors-asia-data-centre.html", "primeYield": null, "primeRent": null, "id": 223}, {"publishDate": "2026-03-01", "firm": "Knight Frank", "title": "Hong Kong Market Report \u2013 Q1 2026", "market": "Hong Kong", "sector": "Multi-sector", "summary": "Knight Frank's quarterly Hong Kong market report examines the latest trends, highlights key transactions and provides a forecast of Hong Kong's property market across the office, retail and residential sectors. The Q1 2026 edition covers the recovery in transaction activity with primary sales volumes well above year-earlier levels and Grade-A office enquiry resilient in premium Central buildings, while the capital markets pipeline builds momentum on end-user office demand and growing institutional interest.", "url": "https://www.knightfrank.com.hk/research/hong-kong-market-report-2026-q1-12831.aspx", "primeYield": null, "primeRent": null, "id": 241}, {"publishDate": "2026-03-01", "firm": "Knight Frank", "title": "Hong Kong Industrial Summary \u2013 Q1 2026", "market": "Hong Kong", "sector": "Industrial & Logistics", "summary": "Knight Frank's quarterly summary analyses the performance of Hong Kong's industrial property markets. The report covers the logistics and warehousing sectors, tracking vacancy, rental and investment trends. Hong Kong's logistics sector is noted for its strategic relevance in the context of Knight Frank's Asia-Pacific Outlook 2026, which highlights Hong Kong's low-altitude economy and its impact on logistics demand across the territory.", "url": "https://www.knightfrank.com.hk/research/hong-kong-industrial-summary-q1-2026-12834.aspx", "primeYield": null, "primeRent": null, "id": 242}, {"publishDate": "2026-03-01", "firm": "Knight Frank", "title": "Leading Indicators \u2013 March 2026 (Singapore/Australia)", "market": "Singapore", "sector": "Multi-sector", "summary": "Knight Frank's Leading Indicators report for March 2026, authored by Chief Economist Ben Burston, tracks key economic and financial metrics impacting property markets across Singapore and Australia. The report monitors interest rate trajectories, employment conditions and real estate investment climate as central banks across the Asia-Pacific region near the end of their easing cycles.", "url": "https://www.knightfrank.com.sg/research/leading-indicators-march-2026-12730.aspx", "primeYield": null, "primeRent": null, "id": 243}, {"publishDate": "2026-03-01", "firm": "Knight Frank", "title": "Perth CBD Office Market Report \u2013 March 2026", "market": "Australia", "sector": "Office", "summary": "Knight Frank's Perth CBD Office Market report provides an overview of current and forecast conditions in the Perth office market. The March 2026 edition tracks the key indicators shaping the Perth market, where vacancy conditions remain relatively favourable compared to east coast cities and prime rents are expected to continue their upward trajectory as construction activity remains constrained.", "url": "https://www.knightfrank.com.au/research/perth-office-state-of-the-market-report-march-2026-12746.aspx", "primeYield": null, "primeRent": null, "id": 245}, {"publishDate": "2026-03-01", "firm": "Knight Frank", "title": "Adelaide Office Market Report \u2013 March 2026", "market": "Australia", "sector": "Office", "summary": "Knight Frank's Adelaide Office Market report provides an overview of the Adelaide office market including the CBD and CBD Fringe precincts. Economic rents have surged since 2021 as rising costs and market pressures constrain new office development, and the supply pipeline in Adelaide CBD remains relatively thin. The supply constraint is a key driver supporting rental growth for prime space.", "url": "https://www.knightfrank.com.au/research/adelaide-office-market-report-march-2026", "primeYield": null, "primeRent": null, "id": 246}, {"publishDate": "2026-03-01", "firm": "Knight Frank", "title": "Canberra Office Market Report \u2013 March 2026", "market": "Australia", "sector": "Office", "summary": "Knight Frank's Canberra Office Market report provides an overview of the Canberra office market encompassing the CBD and surrounding precincts. The report tracks vacancy, absorption and rental conditions in Australia's capital city market, noting how government-driven occupier demand underpins the city's distinctive office market dynamics.", "url": "https://www.knightfrank.com.au/research/canberra-office-market-march-2026", "primeYield": null, "primeRent": null, "id": 247}, {"publishDate": "2026-03-01", "firm": "Knight Frank", "title": "Asia-Pacific Office Highlights \u2013 Q1 2026", "market": "APAC", "sector": "Office", "summary": "Knight Frank's quarterly Asia-Pacific Prime Office Rental Index covers 24 cities and shows the index rose 0.8% quarter-on-quarter in Q1 2026, with 18 of 24 tracked cities recording stable or increasing rents. Tokyo office and retail rents rose fastest across the APAC region, with Tokyo office up 22% YoY as Grade-A vacancy has tightened to near-zero levels. Prime vacancy tightened to 14.1% across the region as supply pressures build in key developed markets.", "url": "https://apac.knightfrank.com/office-highlights", "primeYield": null, "primeRent": null, "id": 248}, {"publishDate": "2026-03-01", "firm": "Knight Frank", "title": "Australian Office Indicators \u2013 Q1 2026", "market": "Australia", "sector": "Office", "summary": "Knight Frank Australia's quarterly overview of key office markets across Australia captures upcoming trends and benchmarks key performance indicators including vacancy rates, net absorption and prime face rents. The Q1 2026 edition highlights the bifurcation between prime and secondary space, with prime rental growth defying high overall vacancy rates across most Australian CBDs.", "url": "https://www.knightfrank.com.au/research/australian-office-indicators-q1-2026", "primeYield": null, "primeRent": null, "id": 249}, {"publishDate": "2026-03-01", "firm": "Knight Frank", "title": "Australian Industrial Review \u2013 Q1 2026", "market": "Australia", "sector": "Industrial & Logistics", "summary": "Knight Frank Australia's quarterly industrial review summarises trends and insights from all major Australian industrial markets. The Q1 2026 edition tracks a sector where demand for prime industrial and logistics property is resurgent, with competition ramping up for high-quality assets in Sydney and Brisbane. Yields are edging down in Brisbane and are expected to sharpen in Sydney, with industrial recognised as one of Australia's most resilient commercial property sectors.", "url": "https://www.knightfrank.com.au/research/australian-industrial-review-q1-2026", "primeYield": null, "primeRent": null, "id": 250}, {"publishDate": "2026-03-01", "firm": "Knight Frank", "title": "Sydney Industrial State of the Market \u2013 Q1 2026", "market": "Australia", "sector": "Industrial & Logistics", "summary": "Knight Frank's quarterly snapshot of the Sydney industrial market tracks key trends in vacancy, leasing activity and rental growth across Greater Sydney. The Q1 2026 report reflects strong ongoing demand supported by e-commerce and 3PL occupiers, with prime vacancy remaining at historically low levels and rents continuing to rise in key logistics precincts near Port Botany and the Western Sydney corridor.", "url": "https://www.knightfrank.com.au/research/sydney-industrial-state-of-the-market-q1-2026", "primeYield": null, "primeRent": null, "id": 251}, {"publishDate": "2026-03-01", "firm": "Knight Frank", "title": "Melbourne Industrial State of the Market \u2013 Q1 2026", "market": "Australia", "sector": "Industrial & Logistics", "summary": "Knight Frank's quarterly snapshot of the Melbourne industrial market provides a snapshot of key trends including vacancy, rents and leasing activity. The Q1 2026 edition tracks demand from manufacturing and 3PL occupiers driving industrial absorption, with the Melbourne market benefiting from the city's population growth and its position as Australia's largest metropolitan industrial market.", "url": "https://www.knightfrank.com.au/research/melbourne-industrial-state-of-the-market-q1-2026", "primeYield": null, "primeRent": null, "id": 252}, {"publishDate": "2026-03-01", "firm": "Knight Frank", "title": "Perth Industrial State of the Market \u2013 Q1 2026", "market": "Australia", "sector": "Industrial & Logistics", "summary": "Knight Frank's quarterly Perth industrial market snapshot covers the latest trends in the Western Australian industrial and logistics market. Perth's industrial market is benefiting from strong resource-sector related demand and limited new supply, with prime yields firming as investor interest in high-quality logistics assets continues to build.", "url": "https://www.knightfrank.com.au/research/perth-industrial-state-of-the-market-report-q1-2026", "primeYield": null, "primeRent": null, "id": 253}, {"publishDate": "2026-03-01", "firm": "Knight Frank", "title": "Brisbane Industrial State of the Market \u2013 Q1 2026", "market": "Australia", "sector": "Industrial & Logistics", "summary": "Knight Frank's quarterly snapshot of key trends across the Brisbane industrial market covers the South East Queensland logistics and industrial sector. Brisbane is identified as a market where yields are already starting to edge down as demand for high-quality logistics assets intensifies ahead of the Brisbane 2032 Olympics infrastructure build-out, making it one of Australia's most attractive industrial investment opportunities.", "url": "https://www.knightfrank.com.au/research/brisbane-industrial-state-of-the-market-q1-2026", "primeYield": null, "primeRent": null, "id": 254}, {"publishDate": "2026-03-01", "firm": "Knight Frank", "title": "Brisbane CBD Office State of the Market \u2013 Q1 2026", "market": "Australia", "sector": "Office", "summary": "Knight Frank's snapshot of key trends in the Brisbane CBD office market for Q1 2026 examines vacancy, absorption, and the impact of new supply completions. The completion of two major new CBD buildings during 2025 resulted in a lift in immediate availability of full floor and contiguous space, though strong pre-commitment levels have contained any broader vacancy blowout.", "url": "https://www.knightfrank.com.au/research/brisbane-cbd-office-state-of-the-market-q1-2026", "primeYield": null, "primeRent": null, "id": 255}, {"publishDate": "2026-03-01", "firm": "Knight Frank", "title": "Sydney CBD Office State of the Market \u2013 Q1 2026", "market":
