x", "primeYield": null, "primeRent": null, "id": 258}, {"publishDate": "2026-03-01", "firm": "Knight Frank", "title": "Singapore Residential Market Update \u2013 Q1 2026", "market": "Singapore", "sector": "Residential", "summary": "Knight Frank Singapore's quarterly residential market update provides an in-depth look at the performance of Singapore's residential market, examining prices and trends in the mainstream, prime and project sectors. The Q1 2026 report notes that private home prices in the Outside Central Region (OCR) continued to rise by 1.3% QoQ, ahead of the 1.0% QoQ rise in Q4 2025, with Knight Frank anticipating 3\u20135% annual price growth for 2026.", "url": "https://www.knightfrank.com.sg/research/singapore-residential-market-update-q1-2026", "primeYield": null, "primeRent": null, "id": 259}, {"publishDate": "2026-03-01", "firm": "Knight Frank", "title": "Singapore Industrial and Logistics Market Update \u2013 Q1 2026", "market": "Singapore", "sector": "Industrial & Logistics", "summary": "Knight Frank Singapore's quarterly bulletin reports on market performance in the industrial sector, including factory and warehouse space, logistics facilities and business parks. The Q1 2026 edition covers a Singapore industrial market where supply constraints and resilient demand from third-party logistics and e-commerce operators continue to support occupancy and rental rates.", "url": "https://www.knightfrank.com.sg/research/singapore-industrial-and-logistics-market-update-q1-2026", "primeYield": null, "primeRent": null, "id": 260}, {"publishDate": "2026-03-01", "firm": "Knight Frank", "title": "Singapore Retail Market Update \u2013 Q1 2026", "market": "Singapore", "sector": "Retail", "summary": "Knight Frank Singapore's quarterly bulletin reports on Singapore's retail market with a focus on recent developer and retailer activity. The Q1 2026 edition covers a market where rising tourism and recovering consumer sentiment are supporting prime retail performance, particularly in Orchard Road and other tourist-linked precincts, though household cost-of-living concerns and global macroeconomic headwinds introduce caution.", "url": "https://www.knightfrank.com.sg/research/singapore-retail-market-update-q1-2026", "primeYield": null, "primeRent": null, "id": 261}, {"publishDate": "2026-03-01", "firm": "Knight Frank", "title": "Singapore Investment Market Update \u2013 Q1 2026", "market": "Singapore", "sector": "Capital Markets", "summary": "Knight Frank Singapore's quarterly bulletin reports on real estate investment in Singapore with insights into the latest transaction trends. The Q1 2026 edition covers a period when Singapore recorded its highest quarterly investment volume on record according to JLL data, and where cross-border capital from Southeast Asian and global investors is actively deploying into prime commercial and residential assets.", "url": "https://www.knightfrank.com.sg/research/singapore-investment-market-update-q1-2026", "primeYield": null, "primeRent": null, "id": 262}, {"publishDate": "2026-03-01", "firm": "Knight Frank", "title": "Singapore Auction Market Update \u2013 Q1 2026", "market": "Singapore", "sector": "Capital Markets", "summary": "Knight Frank Singapore's quarterly bulletin reports the market performance of residential and commercial property auctions in Singapore. The Q1 2026 edition provides data on auction clearance rates, auction volumes and notable transactions, in a market where elevated government land sales supply is gradually broadening buyer options while demand for well-located assets remains robust.", "url": "https://www.knightfrank.com.sg/research/singapore-auction-market-update-q1-2026", "primeYield": null, "primeRent": null, "id": 263}, {"publishDate": "2026-03-01", "firm": "Knight Frank", "title": "Melbourne Economic Rent Report \u2013 Q1 2026", "market": "Australia", "sector": "Office", "summary": "Knight Frank's Melbourne Economic Rent Report for Q1 2026 estimates the economic rent for a premium office tower in Melbourne CBD, finding that achievable rents remain significantly below replacement cost levels. This gap between economic and market rents indicates a continuing constraint on development feasibility, which will keep the supply pipeline thin and support rental growth prospects for existing prime stock over the medium term.", "url": "https://www.knightfrank.com.au/research/melbourne-economic-rent-report-q1-2026", "primeYield": null, "primeRent": null, "id": 267}, {"publishDate": "2026-03-01", "firm": "Knight Frank", "title": "Adelaide Economic Rent Report \u2013 Q1 2026", "market": "Australia", "sector": "Office", "summary": "Knight Frank's Adelaide Economic Rent Report for Q1 2026 analyses how economic rents have surged since 2021 as rising costs and market pressures have constrained new office development. The supply pipeline in Adelaide CBD remains relatively thin, with achievable rents still well below replacement cost, meaning the development feasibility gap will continue to limit new supply and support rental growth for existing prime assets.", "url": "https://www.knightfrank.com.au/research/adelaide-economic-rent-report-q1-2026", "primeYield": null, "primeRent": null, "id": 268}, {"publishDate": "2026-03-01", "firm": "Knight Frank", "title": "Brisbane CBD Full Floor Report \u2013 Q1 2026", "market": "Australia", "sector": "Office", "summary": "Knight Frank's Brisbane CBD Full Floor Report for Q1 2026 assesses the availability of full floor and contiguous space following the completion of two new major CBD buildings during 2025, which lifted immediate availability. The report profiles options across Brisbane's CBD precincts and evaluates how relocating tenants can leverage the current availability window before the pipeline tightens further from 2027 onwards.", "url": "https://www.knightfrank.com.au/research/brisbane-cbd-full-floor-report-q1-2026", "primeYield": null, "primeRent": null, "id": 269}, {"publishDate": "2026-03-01", "firm": "Knight Frank", "title": "Asia-Pacific Capital Markets Insights \u2013 Q1 2026", "market": "APAC", "sector": "Capital Markets", "summary": "Knight Frank's quarterly Asia-Pacific Capital Markets Insights for Q1 2026 covers the strongest quarterly performance since Q4 2021, with total regional investment reaching US$64.6 billion, up 13.0% QoQ and 64.7% YoY. Cross-border investment more than doubled YoY to US$22.4 billion, accounting for 34.8% of total regional investment. The office sector led at US$23.5 billion, a 46.7% YoY increase, reflecting selective reallocation into prime, income-resilient assets as capital transitions from price discovery to deployment.", "url": "https://kfmap.asia/research/asia-pacific-capital-markets-insights-q1-2026/4971", "primeYield": null, "primeRent": null, "id": 280}, {"publishDate": "2026-02-25", "firm": "Knight Frank", "title": "Global Super-Prime Intelligence \u2013 Q4 2025", "market": "APAC", "sector": "Residential", "summary": "Knight Frank's Global Super-Prime Intelligence report provides a quarterly review of super-prime residential markets globally, with coverage of key APAC cities including Hong Kong, Singapore and Tokyo. The Q4 2025 edition notes that Hong Kong saw one of the strongest upticks in super-prime sales, while Singapore continues to set price records but volume remains constrained by high stamp duty fees. Tokyo led global prime residential price growth with a 55.9% increase in the 12 months to Q3 2025.", "url": "https://international-residential.knightfrank.com.sg/global-super-prime-intelligence-q4-2025/", "primeYield": null, "primeRent": null, "id": 264}, {"publishDate": "2026-02-23", "firm": "CBRE", "title": "CBRE's 2026 Asia Pacific Real Estate Outlook Press Release", "market": "APAC", "sector": "Multi-sector", "summary": "CBRE's press release accompanying the 2026 APAC Market Outlook reiterates a 5\u201310% year-on-year increase in commercial real estate investment volume for the region, with offices ranked as investors' top preferred sector for the first time since 2020. Regional Grade A office supply is forecast to peak in 2026 at 61.3 million sq ft, with more than three quarters concentrated in India and mainland China, while developed markets such as Tokyo, Singapore and Australian CBDs benefit from structurally constrained supply. The logistics sector faces moderating rental growth as occupiers adopt selective expansion strategies ahead of a sharp decline in new completions from 2027.", "url": "https://www.cbre.com/press-releases/cbre-2026-apac-real-estate-outlook-investment-activity-set-to-increase", "primeYield": null, "primeRent": null, "id": 140}, {"publishDate": "2026-02-19", "firm": "JLL", "title": "Melbourne Residential Market Dynamics Q4 2025 (APPD Report)", "market": "Australia", "sector": "Residential", "summary": "Melbourne's inner apartment market hit a 10-year low in new completions in 2025 at just over 2,000 units, though supply is forecast to nearly double to approximately 4,000 completions in 2026. The median apartment sale price closed 2025 at AUD 615,000, largely unchanged since early 2023, while median apartment rent recorded modest growth of 3.6% year-on-year. Melbourne's rental vacancy rate reached 2.0% in Q4 2025, approaching its long-term average of 2.3%, with relative affordability versus other Australian cities expected to sustain strong transactional activity.", "url": "https://research.jllapsites.com/appd-market-report/q4-2025-residential-melbourne/", "primeYield": null, "primeRent": null, "id": 180}, {"publishDate": "2026-02-18", "firm": "CBRE", "title": "2026 Asia Pacific Investor Intentions Survey: Japan Results", "market": "Tokyo", "sector": "Capital Markets", "summary": "CBRE's Japan-specific results from the 2026 Asia Pacific Investor Intentions Survey indicate that the Japan investment market will remain active, with many investors expecting real estate prices to rise. A pronounced shift from core to value-add strategies was recorded, as rising interest rates are offset by strong rental growth prospects in the office sector. Investors are expected to focus on achieving returns through rental growth that exceeds the impact of rising interest rates and inflation-driven cost increases.", "url": "https://www.cbre.co.jp/en/insights/reports/2026-asia-pacific-investor-intentions-survey-japan-results", "primeYield": null, "primeRent": null, "id": 139}, {"publishDate": "2026-02-15", "firm": "Savills", "title": "Japan Multifamily Sector \u2013 Resilient Fundamentals Support 2026 Outlook", "market": "Tokyo", "sector": "Residential", "summary": "Savills Investment Management highlighted Japan's multifamily residential sector as demonstrating resilient fundamentals entering 2026, underpinned by demographic trends, urban concentration, and strong preference for rental housing. The report noted that even amid Bank of Japan rate increases, risk-free rates would likely need to exceed 3.0% before cap rates broadly shift. Steady occupancy and predictable income were expected to continue supporting multifamily investor returns.", "url": "https://savillsim.com/equity-investment/living/japan-residential/", "primeYield": null, "primeRent": null, "id": 224}, {"publishDate": "2026-02-12", "firm": "JLL", "title": "Tokyo Office Market Dynamics Q4 2025 (APPD Report)", "market": "Tokyo", "sector": "Office", "summary": "Tokyo's Grade A office market recorded full-year net absorption of 124,700 sqm in 2025, a record-breaking level, driven by professional services, IT and manufacturing sectors. The Grade A vacancy rate declined a further 20 bps to 0.7% in Q4 2025, down 210 bps year-on-year, as Akasaka Trust Tower entered the market with near-full occupancy. Average monthly gross rent reached JPY 38,252 per tsubo, up 3.3% quarter-on-quarter and 9.4% year-on-year, with capital values rising 3.6% quarter-on-quarter and 13% year-on-year.", "url": "https://research.jllapsites.com/appd-market-report/q4-2025-office-tokyo/", "primeYield": null, "primeRent": "JPY 38,252/tsubo/month", "id": 163}, {"publishDate": "2026-02-12", "firm": "JLL", "title": "Tokyo Logistics & Industrial Market Dynamics Q4 2025 (APPD Report)", "market": "Tokyo", "sector": "Industrial & Logistics", "summary": "Greater Tokyo's prime logistics market saw its vacancy rate decline to 8.8% in Q4 2025, down 31 bps quarter-on-quarter and 74 bps year-on-year, as new supply fell below 100,000 sqm for the first time in eight years. Gross rents averaged JPY 4,780 per tsubo per month, up 1.2% quarter-on-quarter and 2.0% year-on-year, with prime locations showing stronger growth than fringe areas. Rents are expected to continue rising driven by 3PL and online retail demand, with cap rates projected to edge up only gradually.", "url": "https://research.jllapsites.com/appd-market-report/q4-2025-logistics-industrial-tokyo/", "primeYield": null, "primeRent": "JPY 4,780/tsubo/month", "id": 164}, {"publishDate": "2026-02-12", "firm": "JLL", "title": "Tokyo Retail Market Dynamics Q4 2025 (APPD Report)", "market": "Tokyo", "sector": "Retail", "summary": "Tokyo's prime retail markets of Ginza and Omotesando saw rents reach JPY 104,154 per tsubo per month in Q4 2025, up 1.9% quarter-on-quarter and 5.5% year-on-year, driven by international luxury brand expansion and strong inbound tourism. Capital values increased 1.7% quarter-on-quarter and 4.2% year-on-year as cap rates remained stable. Luxury goods sales resumed double-digit growth in November\u2013December, with record foreign visitor arrivals supporting inbound consumption.", "url": "https://research.jllapsites.com/appd-market-report/q4-2025-retail-tokyo/", "primeYield": null, "primeRent": "JPY 104,154/tsubo/month", "id": 165}, {"publishDate": "2026-02-12", "firm": "JLL", "title": "Seoul Office Market Dynamics Q4 2025 (APPD Report)", "market": "Seoul", "sector": "Office", "summary": "Seoul's Grade A office vacancy rate declined slightly to 4.6% in Q4 2025, down 13 bps quarter-on-quarter, remaining below 5% throughout the year, though the CBD held flat at 8.5% with scheduled move-ins pending. Net effective rent reached KRW 147,882 per pyeong, up 0.8% quarter-on-quarter and 4.7% year-on-year, with the quarter's office transaction volume reaching a record-breaking KRW 6.0 trillion. The largest transaction was Signature Tower in the CBD, sold from IGIS to KB Asset Management for KRW 1.0 trillion.", "url": "https://research.jllapsites.com/appd-market-report/q4-2025-office-seoul/", "primeYield": null, "primeRent": "KRW 147,882/pyeong", "id": 166}, {"publishDate": "2026-02-12", "firm": "JLL", "title": "Seoul Logistics & Industrial Market Dynamics Q4 2025 (APPD Report)", "market": "Seoul", "sector": "Industrial & Logistics", "summary": "The Seoul Capital Area (SCA) prime logistics market recorded net absorption of 123,100 pyeong in Q4 2025, the highest level since Q4 2023, as annual absorption exceeded new supply for the first time in four years. Overall SCA vacancy declined to 15.2%, extending a four-quarter downward trend, while net effective rents reached KRW 32,400 per pyeong, rising 0.4% quarter-on-quarter. The logistics investment market surged to KRW 2.13 trillion in Q4, up 167% year-on-year, highlighted by KKR's KRW 1.03 trillion acquisition of Cheongna Logistics Center.", "url": "https://research.jllapsites.com/appd-market-report/q4-2025-logistics-industrial-seoul/", "primeYield": null, "primeRent": "KRW 32,400/pyeong", "id": 167}, {"publishDate": "2026-02-12", "firm": "JLL", "title": "Seoul Retail Market Dynamics Q4 2025 (APPD Report)", "market": "Seoul", "sector": "Retail", "summary": "Seoul's prime retail markets saw modest rent growth of 0.4% quarter-on-quarter for both shopping malls and high streets in Q4 2025, with Myeongdong recording the strongest quarterly growth at 1.0% driven by surging tourist volumes. Shopping mall vacancy improved marginally by 20 bps quarter-on-quarter to 1.1%, while high street vacancy improved 68 bps to 14.5%. Both shopping mall and high street yields remained flat at 6.6% and 6.3% respectively as significant yield adjustments remain unlikely in the fragmented transaction market.", "url": "https://research.jllapsites.com/appd-market-report/q4-2025-retail-seoul/", "primeYield": "6.6%", "primeRent": null, "id": 168}, {"publishDate": "2026-02-12", "firm": "JLL", "title": "Singapore Office Market Dynamics Q4 2025 (APPD Report)", "market": "Singapore", "sector": "Office", "summary": "Singapore's CBD investment grade office market gained further momentum in Q4 2025, recording its second consecutive quarter of over 1% quarterly rental growth\u2014the strongest run since Q2 2024\u2014supported by Singapore's economic resilience and broadening business recovery. No major office completions occurred in Q4 with the next significant delivery being Shaw Tower in 2026, while capital value growth accelerated alongside rents on improved financing conditions. The market is shifting to favour landlords in 2026 as declining vacancy and limited new supply underpin continued rental growth.", "url": "https://research.jllapsites.com/appd-market-report/q4-2025-office-singapore/", "primeYield": null, "primeRent": null, "id": 169}, {"publishDate": "2026-02-12", "firm": "JLL", "title": "Singapore Logistics & Industrial Market Dynamics Q4 2025 (APPD Report)", "market": "Singapore", "sector": "Industrial & Logistics", "summary": "Singapore's islandwide logistics and warehouse market remained stable in Q4 2025, with average rents unchanged for the sixth consecutive quarter, while healthy investor demand sustained steady capital values and yields. Demand for higher-specification logistics/warehouse spaces held firm from manufacturers, logistics service providers and e-commerce firms, with notable investment deals including CapitaLand Ascendas REIT's SGD 176.62 million acquisition of 2PS1. Full-year 2025 net space additions reached an eight-year high following the surge in completions in H1 2025, with rents expected to return to a modest growth trajectory in 2026.", "url": "https://research.jllapsites.com/appd-market-report/q4-2025-logistics-industrial-singapore/", "primeYield": null, "primeRent": null, "id": 170}, {"publishDate": "2026-02-12", "firm": "JLL", "title": "Singapore Residential Market Dynamics Q4 2025 (APPD Report)", "market": "Singapore", "sector": "Residential", "summary": "Singapore's prime non-landed residential market saw sales volume contract in Q4 2025, with October front-loaded by the launch of the 666-unit Skye at Holland. Prime resale non-landed home capital values rose on improved macro conditions and buyer preference for Prime assets as capital preservation vehicles. Luxury Prime rents fell amid weaker leasing demand while Typical Prime rents grew as cost-conscious tenants sought more affordable prime-district options.", "url": "https://research.jllapsites.com/appd-market-report/q4-2025-residential-singapore/", "primeYield": null, "primeRent": null, "id": 171}, {"publishDate": "2026-02-12", "firm": "JLL", "title": "Singapore Retail Market Dynamics Q4 2025 (APPD Report)", "market": "Singapore", "sector": "Retail", "summary": "Singapore's retail market saw occupier demand soften in Q4 2025 as the challenging operating environment and shifting consumer behaviours led retailers to seek more affordable options, though the Formula One race and year-end festivities provided a temporary boost. Islandwide vacancy rose quarter-on-quarter but remained contained as landlords prioritised occupancy, while prime floor space rents held stable on continued demand from quality-seeking occupiers. The suburban submarket recorded the highest vacancy increase of 0.1 percentage points driven by closures of underperforming stores at non-prime locations.", "url": "https://research.jllapsites.com/appd-market-report/q4-2025-retail-singapore/", "primeYield": null, "primeRent": null, "id": 172}, {"publishDate": "2026-02-12", "firm": "JLL", "title": "Hong Kong Office Market Dynamics Q4 2025 (APPD Report)", "market": "Hong Kong", "sector": "Office", "summary": "Hong Kong's Grade A office market recorded its largest quarterly net absorption since 2019 at 1.5 million sq ft in Q4 2025, driven by pre-committed space at the newly completed International Gateway Centre in West Kowloon, with UBS and Banco Santander among the key tenants. The overall vacancy rate expanded to 14.1% as three major completions brought 2,659,300 sq ft of NFA to market, though Central recorded flat vacancy and Tsimshatsui contracted by 0.5 ppts. Overall rents increased 0.7% quarter-on-quarter in Q4 2025, with Central and Tsimshatsui rising 1.5% and 1.2% respectively, while Kowloon East dropped 1.2%.", "url": "https://research.jllapsites.com/appd-market-report/q4-2025-office-hong-kong/", "primeYield": null, "primeRent": null, "id": 173}, {"publishDate": "2026-02-12", "firm": "JLL", "title": "Hong Kong Logistics & Industrial Market Dynamics Q4 2025 (APPD Report)", "market": "Hong Kong", "sector": "Industrial & Logistics", "summary": "Hong Kong's prime warehouse vacancy rate rose to a record high of 10.1% in Q4 2025, up from 9.3% in Q3, as major retailers including Hitachi and H&M outsourced logistics operations to third-party providers, vacating large warehouse facilities. There were no new completions in Q4, with two enbloc warehouse transactions concluded\u2014Big Orange in Tai Wai for HKD 500 million and G2000 Warehouse Building in Fanling for HKD 380 million, implying yields of approximately 4.5\u20134.9%. Retailers outsourcing in-house storage to 3PLs is expected to persist in 2026, keeping the storage leasing market challenging.", "url": "https://research.jllapsites.com/appd-market-report/q4-2025-logistics-industrial-hong-kong/", "primeYield": "4.5%", "primeRent": null, "id": 174}, {"publishDate": "2026-02-12", "firm": "JLL", "title": "Hong Kong Residential Market Dynamics Q4 2025 (APPD Report)", "market": "Hong Kong", "sector": "Residential", "summary": "Hong Kong's luxury residential market saw momentum in Q4 2025, with Mainland Chinese buyers remaining active in the primary market and Cullinan Sky Phase 2 selling out its first launch round. Luxury leasing market rental values rose 2.3% quarter-on-quarter on continued inflow of non-local talent and returning expats, while luxury residential capital values increased 0.2% quarter-on-quarter. JLL projects mass and luxury residential capital values to rise approximately 5% and remain stable respectively in 2026, with luxury rents projected to increase by 0\u20135%.", "url": "https://research.jllapsites.com/appd-market-report/q4-2025-residential-hong-kong/", "primeYield": null, "primeRent": null, "id": 175}, {"publishDate": "2026-02-12", "firm": "JLL", "title": "Hong Kong Retail Market Dynamics Q4 2025 (APPD Report)", "market": "Hong Kong", "sector": "Retail", "summary": "Hong Kong's prime shopping centre vacancy improved marginally from 9.9% to 9.7% in Q4 2025, supported by increased rental concessions and seasonal demand, while high street shop vacancies rose from 9.7% to 10.0%. Total retail sales growth accelerated to 6.7% year-on-year in October\u2013November, with electronics surging 30.2% on the iPhone 17 launch and banks and securities expanding on active markets. JLL projects high street shop rents to soften 0\u20135% in 2026, with prime shopping centre rents declining a further 5\u201310%.", "url": "https://research.jllapsites.com/appd-market-report/q4-2025-retail-hong-kong/", "primeYield": "6.3%", "primeRent": null, "id": 176}, {"publishDate": "2026-02-12", "firm": "JLL", "title": "Sydney Office Market Dynamics Q4 2025 (APPD Report)", "market": "Australia", "sector": "Office", "summary": "Sydney CBD recorded its eighth straight quarter of positive demand in Q4 2025, with 20,500 sqm of positive net absorption driven by large-tenant demand across all four precincts. Sydney CBD core prime net face rents grew 1.5% over the quarter and 6.5% over the year to average AUD 1,540 per sqm per annum, with prime incentives reducing marginally to 32.8%. Two completions and four withdrawals were recorded in the CBD, with the vacancy rate expected to gradually fall over the near term as supply remains very limited.", "url": "https://research.jllapsites.com/appd-market-report/q4-2025-office-sydney/", "primeYield": null, "primeRent": "AUD 1,540/sqm p.a.", "id": 177}, {"publishDate": "2026-02-12", "firm": "JLL", "title": "Asia Pacific Industrial Market Insights Q4 2025", "market": "APAC", "sector": "Industrial & Logistics", "summary": "JLL's regional APAC industrial market overview for Q4 2025 reports net absorption increased 32.8% quarter-on-quarter, led by China Tier-2 cities, Southeast Asia and Seoul, though Tier-1 markets including Hong Kong, Sydney and Melbourne recorded negative net absorption. APAC vacancy fell slightly by 0.1 percentage points to 11.5%, while rents were weighed down by Greater China where landlords offered discounts, but remained mostly stable outside Greater China. Investment transaction volumes for the full year 2025 declined 18% year-on-year, though trended upward through the year, with Seoul mega-scale deals and Singapore portfolio transactions the highlights.", "url": "https://research.jllapsites.com/appd-article/industrial-market-insights-q4-2025/", "primeYield": null, "primeRent": null, "id": 178}, {"publishDate": "2026-02-12", "firm": "JLL", "title": "Sydney Residential Market Dynamics Q4 2025 (APPD Report)", "market": "Australia", "sector": "Residential", "summary": "Sydney's inner apartment market saw its median sale price surpass AUD 800,000 in 2025, recording year-on-year growth of 4.5%, with the three-bedroom segment leading at 9.5% growth. The rental vacancy rate held steady at 1.4% in Q4 2025, well below the long-term average of 2.3%, while median apartment rent increased during the final quarter of 2025 to close the year 3.6% higher year-on-year at AUD 730 per week. JLL anticipates Sydney's apartment market is entering a period of renewed confidence in 2026, with supply-demand imbalances continuing to drive rental and sales price growth.", "url": "https://research.jllapsites.com/appd-market-report/q4-2025-residential-sydney/", "primeYield": null, "primeRent": "AUD 730/week (median)", "id": 179}, {"publishDate": "2026-02-12", "firm": "JLL", "title": "Asia Pacific Capital Tracker 2026 Outlook (Q4 2025 Edition)", "market": "APAC", "sector": "Capital Markets", "summary": "JLL's Q4 2025/2026 Outlook Capital Tracker reports full-year APAC CRE investment reached USD 147.6 billion in 2025, up 12% and the strongest annual performance since 2021, with Q4 alone reaching USD 40.3 billion. Japan set the pace with USD 41.4 billion for the full year, while the living sector captured a record share of APAC investment at USD 12.6 billion (+77% year-on-year). Looking ahead to 2026, JLL identifies prime offices in Singapore and Sydney, logistics hubs in South Korea and India, and multifamily in Japan as top investment picks, alongside growing interest in data centres and energy storage.", "url": "https://www.jll.com/en-in/insights/asia-pacific-capital-tracker", "primeYield": null, "primeRent": null, "id": 186}, {"publishDate": "2026-02-12", "firm": "JLL", "title": "Korea Investment Market Review 2025 / Outlook 2026", "market": "Seoul", "sector": "Capital Markets", "summary": "South Korea's commercial real estate investment market achieved a record-breaking KRW 6.0 trillion in Q4 2025 office transactions alone, with the full-year 2025 figure reaching USD 28.1 billion (+29% year-on-year). Domestic asset management companies with dry powder from NPS, Korea Post and Yellow Umbrella Mutual Aid are expected to actively drive the investment market in 2026, alongside continued foreign interest in logistics assets. The CBD supply pipeline is expected to create an additional risk premium for investors and may redirect appetite towards Yeouido and Gangnam submarkets.", "url": "https://research.jllapsites.com/appd-market-report/q4-2025-office-seoul/", "primeYield": null, "primeRent": null, "id": 187}, {"publishDate": "2026-02-09", "firm": "JLL", "title": "Asia Pacific Commercial Real Estate Investment Reaches USD 40.3 Billion in Q4 2025", "market": "APAC", "sector": "Capital Markets", "summary": "JLL reports APAC commercial real estate investment volumes totalled USD 40.3 billion in Q4 2025, up 15% year-on-year, bringing full-year 2025 to USD 147.6 billion (+12%)\u2014the strongest annual performance since 2021. Japan led as the region's most active market at USD 9.8 billion in Q4, while Hong Kong rebounded strongly with a 62% year-on-year increase to USD 2.4 billion in Q4. South Korea surged 41% year-on-year to USD 7.7 billion in Q4 on strong domestic office demand and foreign logistics interest.", "url": "https://www.jll.com/en-hk/newsroom/apac-commercial-real-estate-investment-reaches-usd-40-3-billion-in-q4-2025", "primeYield": null, "primeRent": null, "id": 162}, {"publishDate": "2026-02-05", "firm": "CBRE", "title": "Asia Pacific Data Centre Boom to Continue in 2026", "market": "APAC", "sector": "Data Centre", "summary": "CBRE's viewpoint on the Asia Pacific data centre market outlines how AI implementation, cloud adoption and digitalisation are driving unprecedented demand heading into 2026, with aggregate hyperscaler CapEx forecasts exceeding USD 400 billion globally. Australia and Japan are set to lead demand, with Southeast Asia emerging as an investment hotspot as Malaysia, Thailand and Singapore expand capacity. Singapore's two new tranches of 1.2 GW development capacity will keep the city-state as a premium AI workload hub while pushing larger requirements to neighbouring markets.", "url": "https://www.cbre.com/insights/articles/asia-pacific-data-centre-boom-to-continue-in-2026", "primeYield": null, "primeRent": null, "id": 138}, {"publishDate": "2026-02-04", "firm": "CBRE", "title": "2026 Singapore Real Estate Market Outlook", "market": "Singapore", "sector": "Multi-sector", "summary": "CBRE forecasts Singapore's GDP growth to slow to 1\u20133% in 2026, with firm occupier demand and limited supply supporting Core CBD Grade A office rent growth faster than 2025. Sustained demand and constrained supply should see prime logistics rents resume mild growth, while improving tourism and below-historical-average future retail supply will drive increases in prime retail rents. Singapore ranks among the top three investment destinations in APAC, supported by lower interest rates and a healthy pipeline of investment-grade assets.", "url": "https://www.cbre.com.sg/insights/reports/2026-singapore-real-estate-market-outlook", "primeYield": null, "primeRent": null, "id": 137}, {"publishDate": "2026-02-04", "firm": "JLL", "title": "Sydney Industrial Market Dynamics Q4 2025", "market": "Australia", "sector": "Industrial & Logistics", "summary": "JLL's Q4 2025 Sydney industrial market report covers key leasing and vacancy trends across Sydney's precincts. The report covers gross take-up, new supply delivered, and rental movements across the Sydney metropolitan area's industrial submarkets. It forms part of JLL Australia's broader quarterly industrial market dynamics series published in early February 2026.", "url": "https://www.jll.com/en-au/insights/market-dynamics/sydney-industrial", "primeYield": null, "primeRent": null, "id": 161}, {"publishDate": "2026-02-04", "firm": "Knight Frank", "title": "Global House Price Index \u2013 Q3 2025", "market": "APAC", "sector": "Residential", "summary": "Knight Frank's Global House Price Index provides a quarterly update on mainstream residential price performance across 150 global cities. Published in early February 2026 covering Q3 2025 data, the report highlights that global luxury residential prices rose 3.2% in 2025, with Asia-Pacific markets performing strongly. Tokyo led with a 55.9% increase and Seoul followed with 25.2%, while Singapore and Australia both recorded positive performance, with six APAC cities appearing in the global top ten.", "url": "https://international-residential.knightfrank.com.sg/global-house-price-index-q3-2025/", "primeYield": null, "primeRent": null, "id": 270}, {"publishDate": "2026-02-03", "firm": "CBRE", "title": "2026 Asia Pacific Investor Intentions Survey", "market": "APAC", "sector": "Capital Markets", "summary": "CBRE's 2026 Asia Pacific Investor Intentions Survey of over 420 respondents found that net buying intentions improved to 17%, with offices overtaking industrial & logistics as the most preferred sector for investment for the first time in six years. Tokyo retained its position as the top cross-border investment destination for a seventh consecutive year, with Sydney in second place and Singapore and Seoul tied for third. Data centres were newly classified as a mainstream sector and ranked fourth in investor preference, with the strongest price appreciation expectations.", "url": "https://www.cbre.com/insights/reports/2026-asia-pacific-investor-intentions-survey", "primeYield": null, "primeRent": null, "id": 134}, {"publishDate": "2026-02-03", "firm": "CBRE", "title": "Japan Retail MarketView Q4 2025", "market": "Tokyo", "sector": "Retail", "summary": "Japan's retail market remained extremely tight in Q4 2025, with average rents reaching record highs in three of 10 surveyed areas including Ginza, Omotesando/Harajuku and Shibuya. Three areas\u2014Ginza, Shibuya and Sakae\u2014reported zero vacancy in prime locations, reflecting fierce retailer competition for limited space. Persistent demand and a lack of available units are expected to maintain upward pressure on rents into 2026.", "url": "https://www.cbre.co.jp/en/insights/figures/japan-retail-marketview-q4-2025", "primeYield": null, "primeRent": "JPY 299,500/month (Ginza, projected 2027)", "id": 135}, {"publishDate": "2026-02-03", "firm": "CBRE", "title": "Seoul Figures Q4 2025", "market": "Seoul", "sector": "Multi-sector", "summary": "Seoul's commercial real estate investment market reached a record annual transaction volume of KRW 33.7 trillion in 2025, driven by office and logistics assets and an increase in owner-occupier acquisitions. Grade A office vacancy rose slightly to 3.3% while effective rents grew 6.3% year-on-year to KRW 38,304 per sqm, as landlords extended rent-free incentives. The logistics market entered a stabilisation phase with ambient logistics vacancy declining to approximately 10% following a 71% year-on-year drop in new supply.", "url": "https://www.cbrevietnam.com/press-releases/seoul-figures-q4-2025", "primeYield": null, "primeRent": "KRW 40,768/sqm", "id": 136}, {"publishDate": "2026-02-03", "firm": "JLL", "title": "Global Hotel Investment Outlook 2026", "market": "APAC", "sector": "Capital Markets", "summary": "JLL's Global Hotel Investment Outlook 2026 reports 2025 hotel investment volumes were up 22% from the 2023 trough, with international tourist arrivals surpassing pre-pandemic levels globally. The outlook for 2026 highlights improving liquidity dynamics across Asia Pacific, where RevPAR growth is leading global hotel performance. Strong debt markets, near-record dry powder and resilient sector fundamentals are expected to drive further growth in hotel transaction volumes through 2026.", "url": "https://www.jll.com/en-us/insights/market-outlook/global-hotel-investment", "primeYield": null, "primeRent": null, "id": 160}, {"publishDate": "2026-02-02", "firm": "CBRE", "title": "Japan Investment MarketView Q4 2025", "market": "Tokyo", "sector": "Capital Markets", "summary": "Japan's full-year 2025 commercial real estate investment volume reached a record-high JPY 6.5 trillion, up 31% year-on-year and 20% above the previous record set in 2007. Tokyo prime office expected NOI yields declined for the first time in approximately three years to 3.13%, establishing a new all-time low. J-REIT acquisition volume surged 2.7x year-on-year in Q4 driven by rising stock prices and portfolio reshuffling.", "url": "https://www.cbre.com/insights/figures/japan-investment-marketview-q4-2025", "primeYield": "3.13%", "primeRent": null, "id": 133}, {"publishDate": "2026-02-01", "firm": "Knight Frank", "title": "Data Centres Global Forecast Report 2026", "market": "APAC", "sector": "Data Centre", "summary": "Knight Frank's Global Data Centres Forecast Report 2026 examines key trends driving the industry's evolution, including power availability, sustainability requirements and tech advancements, with coverage of EMEA, APAC and North America. For APAC, the report forecasts live IT capacity to grow from 14.5 GW in 2025 to 16.8 GW in 2026 (~15% YoY) and 19.8 GW in 2027, with Tokyo recording the largest ever data centre financing deal and over 80% of 2026 capacity already pre-let. Power availability is identified as the decisive constraint to further supply expansion.", "url": "https://www.knightfrank.com/research/reports/global/data-centres-global-forecast-report-2026", "primeYield": null, "primeRent": null, "id": 232}, {"publishDate": "2026-02-01", "firm": "Knight Frank", "title": "2026 Outlook for Hong Kong Island Grade-A Office Market: From Volatility to Opportunity", "market": "Hong Kong", "sector": "Office", "summary": "This dedicated report examines the key demand drivers, occupier trends and market headwinds for the Hong Kong Island Grade-A office market heading into 2026. The report notes that premium Central Grade-A office buildings are expected to record positive rental growth of up to 8%, reflecting durable demand from financial services, family offices and Middle East capital diversifying into APAC hubs. A sharp reduction in new major supply from 2026 onward will provide the market with time to absorb leftover stock from 2024 and 2025.", "url": "https://www.knightfrank.com.hk/research/2026-outlook-for-hong-kong-island-grade-a-office-market-from-volatility-to-opportunity-2026-outlook-for-hong-kong-island-grade-a-office-market-12799.aspx", "primeYield": null, "primeRent": null, "id": 234}, {"publishDate": "2026-02-01", "firm": "Knight Frank", "title": "Australian Capital View \u2013 February 2026", "market": "Australia", "sector": "Capital Markets", "summary": "Knight Frank Australia's monthly capital markets monitor breaks down the key indicators shaping the Australian capital markets environment. The report tracks investment activity across all major asset classes, noting that total Australian CRE investment volumes reached A$53.6 billion in 2025, the third strongest on record. Office transactions are rising, driven by end-user demand and growing investor interest, while the retail sector was a standout performer in 2025 with A$14.6 billion transacted.", "url": "https://www.knightfrank.com.au/research/results.aspx", "primeYield": null, "primeRent": null, "id": 235}, {"publishDate": "2026-02-01", "firm": "Knight Frank", "title": "Sydney CBD Office Market Report \u2013 February 2026", "market": "Australia", "sector": "Office", "summary": "Knight Frank's monthly snapshot of the Sydney CBD office market provides an overview of current market trends including vacancy, absorption, and rental performance. Prime vacancy is forecast to stabilise quickly as construction activity falls, with prime office rental growth expected to defy high vacancy rates. The development pipeline is thinning as asset values remain below replacement cost and rents are below the level required to trigger new development.", "url": "https://www.knightfrank.com.au/research/sydney-cbd-office-market-february-2026", "primeYield": null, "primeRent": null, "id": 236}, {"publishDate": "2026-02-01", "firm": "Knight Frank", "title": "Melbourne CBD Office Market Report \u2013 February 2026", "market": "Australia", "sector": "Office", "summary": "Knight Frank's monthly snapshot of the Melbourne CBD office market highlights current market conditions including supply, demand and rental trends. Melbourne remains an attractive long-term investment proposition with the fastest growing population of any advanced global economy at 1.8% per year since 2000. Economic rents for premium towers are significantly above current and forecast rental levels, indicating a constraint on development feasibility that will limit new supply.", "url": "https://www.knightfrank.com.au/research/melbourne-cbd-office-market-february-2026", "primeYield": null, "primeRent": null, "id": 237}, {"publishDate": "2026-02-01", "firm": "Knight Frank", "title": "North Shore Office Market Report \u2013 February 2026", "market": "Australia", "sector": "Office", "summary": "Knight Frank's report highlights current and forecast conditions in the North Shore office market, comprising the precincts of North Sydney, St Leonards, Chatswood and Macquarie Park-North Ryde. The report assesses how metro corridor precincts are redefining the geography of demand as occupiers seek talent-accessible locations with strong public transport connectivity.", "url": "https://www.knightfrank.com.au/research/north-shore-office-market-february-2026", "primeYield": null, "primeRent": null, "id": 238}, {"publishDate": "2026-02-01", "firm": "Knight Frank", "title": "Leading Indicators \u2013 February 2026 (Singapore)", "market": "Singapore", "sector": "Multi-sector", "summary": "Knight Frank Singapore's Leading Indicators report, authored by Chief Economist Ben Burston, provides key economic and financial metrics impacting property markets. The February 2026 edition tracks interest rate movements, employment data, GDP indicators and real estate market drivers relevant to the Singapore context, as global central banks near the end of their easing cycles.", "url": "https://www.knightfrank.com.sg/research/leading-indicators-march-2026-12730.aspx", "primeYield": null, "primeRent": null, "id": 239}, {"publishDate": "2026-02-01", "firm": "Knight Frank", "title": "Tokyo Data Centre Market \u2013 Investment Outlook 2026", "market": "Tokyo", "sector": "Data Centre", "summary": "Knight Frank identifies Tokyo as a primary APAC data centre market where AI adoption is driving unprecedented demand. With over 80% of 2026 capacity pre-let, supply remains constrained by construction costs and power availability, driving activity including the largest ever data centre financing transaction in Japan. Investors and operators are forming new joint-venture platforms to scale exposure into digital infrastructure.", "url": "https://www.knightfrank.com/research/reports/global/data-centres-global-forecast-report-2026", "primeYield": null, "primeRent": null, "id": 274}, {"publishDate": "2026-01-30", "firm": "CBRE", "title": "Japan Logistics MarketView Q4 2025", "market": "Tokyo", "sector": "Industrial & Logistics", "summary": "Greater Tokyo's large multi-tenant logistics vacancy rate fell for a third consecutive quarter to 9.8% in Q4 2025, led by a 2.0 pp decline in the Ken-O-do area. Effective rents for Greater Tokyo increased by 0.2% quarter-on-quarter to JPY 4,490, while Greater Osaka vacancy fell to 4.2% with effective rents rising 0.7% to JPY 4,290. Greater Nagoya and Fukuoka also recorded vacancy declines as net absorption reached historically strong levels.", "url": "https://www.cbre.com/insights/figures/japan-logistics-marketview-q4-2025", "primeYield": null, "primeRent": "JPY 4,490/tsubo", "id": 132}, {"publishDate": "2026-01-30", "firm": "JLL", "title": "Brisbane Office Market Dynamics Q4 2025", "market": "Australia", "sector": "Office", "summary": "The Brisbane CBD office market recorded consistent demand in Q4 2025, reflected in strong net absorption figures. One project reached completion in the CBD during the quarter, and Brisbane recorded sustained and elevated rental growth through the period. The market outlook remains positive given the limited supply pipeline and continued flight-to-quality demand from occupiers.", "url": "https://www.jll.com/en-au/insights/market-dynamics/brisbane-office", "primeYield": null, "primeRent": null, "id": 159}, {"publishDate": "2026-01-29", "firm": "CBRE", "title": "Asia Pacific Real Estate Market Outlook 2026", "market": "APAC", "sector": "Multi-sector", "summary": "CBRE projects 5\u201310% growth in Asia Pacific commercial real estate investment volumes in 2026, as net buying intentions improve to 17% and offices overtake industrial & logistics as investors' top preferred sector for the first time since 2020. Office rents are expected to continue rising in developed markets such as Tokyo, Singapore and Australian CBDs where supply is structurally constrained, while logistics rental growth moderates as occupiers turn more selective. Data centres are ranked fourth among investor preferences and are expected to see the strongest price appreciation.", "url": "https://www.cbre.com/insights/reports/asia-pacific-real-estate-market-outlook-2026", "primeYield": null, "primeRent": null, "id": 130}, {"publishDate": "2026-01-29", "firm": "CBRE", "title": "Japan Office MarketView Q4 2025", "market": "Tokyo", "sector": "Office", "summary": "Tokyo's All-Grade office vacancy rate dropped by 0.5 pp quarter-on-quarter to 1.6% in Q4 2025, with Grade A vacancy falling below 1% for the first time since Q3 2020. Grade A rents spiked 3.3% quarter-on-quarter to JPY 41,050, exceeding the JPY 40,000 threshold for the first time in 17 years. Rents rose across all grades in all 10 surveyed cities, with Fukuoka setting an all-time high.", "url": "https://www.cbre.co.jp/en/insights/figures/japan-office-marketview-q4-2025", "primeYield": null, "primeRent": "JPY 41,050/tsubo", "id": 131}, {"publishDate": "2026-01-29", "firm": "CBRE", "title": "CBRE Australia Pacific Market Outlook 2026 \u2013 Office Sector", "market": "Australia", "sector": "Office", "summary": "CBRE forecasts Australia's CBD office market net effective rents to grow +3.3% in 2026, with Brisbane (+7.3%) and Sydney (+6.6%) leading performance, while Melbourne's recovery is expected from 2027 onwards. Economic rents now exceed market rents by 20\u201335%, reinforcing pricing power for premium assets, and no new Sydney CBD supply is scheduled for 2026. Total office returns are forecast to exceed historical averages, led by Brisbane and Canberra, as cap rates remain broadly flattish before compressing in 2028.", "url": "https://www.cbre.com.au/insights/reports/pacific-real-estate-market-outlook-2026", "primeYield": null, "primeRent": null, "id": 151}, {"publishDate": "2026-01-29", "firm": "CBRE", "title": "CBRE Australia Pacific Market Outlook 2026 \u2013 Industrial & Logistics Sector", "market": "Australia", "sector": "Industrial & Logistics", "summary": "CBRE's 2026 Pacific Market Outlook for industrial and logistics expects industrial vacancy to peak at 3.6% in H2 2026\u2014still below equilibrium\u2014before tightening further as new supply falls sharply from 2027. Effective rents are forecast to turn positive in 2026 as incentives stabilise, widening the gap between super prime and secondary assets. Rising e-commerce and hyperscale data centre demand are intensifying competition for industrial land, compressing developer margins.", "url": "https://www.cbre.com.au/insights/reports/pacific-real-estate-market-outlook-2026", "primeYield": null, "primeRent": null, "id": 152}, {"publishDate": "2026-01-29", "firm": "CBRE", "title": "CBRE Australia Pacific Market Outlook 2026 \u2013 Residential Sector", "market": "Australia", "sector": "Residential", "summary": "CBRE's 2026 Pacific Market Outlook highlights Australia's living sector facing a structural supply shortfall, with apartment completions forecast at approximately 60,000 units annually\u2014well below the long-run demand of 75\u201385k. Capital city vacancy is expected to decline from 1.8% in 2025 to 1.1% by 2030, with rents projected to grow +24% and capital values +28% over 2025\u20132030. Student accommodation and senior living remain under-penetrated, presenting significant investment opportunities amid demographic shifts and affordability pressures.", "url": "https://www.cbre.com.au/insights/reports/pacific-real-estate-market-outlook-2026", "primeYield": null, "primeRent": null, "id": 153}, {"publishDate": "2026-01-28", "firm": "Savills", "title": "Regional Real Estate Forecasts for 2026 \u2013 Asia Pacific", "market": "APAC", "sector": "Multi-sector", "summary": "Savills World Research published its Asia Pacific 2026 regional outlook, forecasting a 7% rise in investment activity after broadly flat 2025 volumes. Tokyo Grade A office rental growth was forecast above 5%, Seoul investment was projected to grow 10%, and Australia investment was expected to rise nearly 20%. Cross-border investors continued to favour Japan, Australia, South Korea, and Singapore despite geopolitical risks.", "url": "https://impacts.savills.com/market-trends/our-regional-real-estate-forecasts-for-2026.html", "primeYield": null, "primeRent": null, "id": 193}, {"publishDate": "2026-01-28", "firm": "Savills", "title": "2026 Global Occupier Outlook \u2013 Asia Pacific Office and Retail", "market": "APAC", "sector": "Office", "summary": "Savills' global occupier survey found 89% of respondents forecast rising prime office rents in 2026, with Tokyo expected to see growth above 5% driven by near-zero vacancy. In Asia Pacific, India, Malaysia, and Vietnam were projected to see the strongest growth among talent hub markets. The report also found 82% of respondents expected increased occupier take-up, with a broad trend toward consolidation into fewer, higher-quality spaces.", "url": "https://impacts.savills.com/market-trends/2026-global-occupier-outlook-increased-demand-to-drive-higher-rents.html", "primeYield": null, "primeRent": null, "id": 207}, {"publishDate": "2026-01-28", "firm": "Savills", "title": "2026 Investment Outlook \u2013 Global Recovery to Strengthen", "market": "APAC", "sector": "Capital Markets", "summary": "Savills' global investment outlook for 2026 forecast global investment turnover to surpass $1 trillion, the highest since 2022, as stabilising values and improved institutional confidence drove deployment. Prime offices were identified as a leading investment pick among core/core-plus strategies, with living sectors and industrial and logistics remaining popular. In Asia Pacific, Japan and Australia were highlighted as priority markets for cross-border capital.", "url": "https://impacts.savills.com/market-trends/2026-investment-outlook-recovery-set-to-strengthen.html", "primeYield": null, "primeRent": null, "id": 215}, {"publishDate": "2026-01-28", "firm": "Savills", "title": "Asia Pacific Themes Shaping Real Estate in 2026", "market": "APAC", "sector": "Multi-sector", "summary": "Savills Impacts published its analysis of the key themes shaping Asia Pacific real estate in 2026, identifying the economic environment, AI and technology adoption, and geopolitics as the top drivers. Industrial and logistics sector was identified as particularly exposed to geopolitical risk from trade policy uncertainty, while office demand was expected to recover across major Asian gateway cities. Data centre and digital infrastructure investment was projected to continue accelerating across the region.", "url": "https://impacts.savills.com/market-trends/the-themes-that-will-shape-global-real-estate-in-2026.html", "primeYield": null, "primeRent": null, "id": 218}, {"publishDate": "2026-01-27", "firm": "CBRE", "title": "Pacific Real Estate Market Outlook 2026", "market": "Australia", "sector": "Multi-sector", "summary": "CBRE's Pacific Market Outlook for Australia and New Zealand forecasts below-trend economic growth of approximately 2% in 2026 and investment volume growth of ~5%, led by office and industrial sectors. Net effective office rents are forecast to grow +3.3% nationally, with Brisbane (+7.3%) and Sydney (+6.6%) leading the way, while industrial vacancy is expected to peak at 3.6% in H2 2026. The report introduces the 'TINA' (there is no alternative) thesis, highlighting how constrained supply across all sectors will drive returns over the medium term.", "url": "https://www.cbre.com.au/insights/reports/pacific-real-estate-market-outlook-2026", "primeYield": null, "primeRent": null, "id": 129}, {"publishDate": "2026-01-27", "firm": "Knight Frank", "title": "Singapore Residential Market Update Q4 2025", "market": "Singapore", "sector": "Residential", "summary": "Published in late January 2026, this quarterly bulletin reviews Q4 2025 performance in Singapore's residential market, examining prices and trends in the mainstream, prime and project sectors. Private home prices increased 3.4% for the full year 2025, coming in at the lower end of Knight Frank's projected range. Knight Frank anticipates private home price growth of 3\u20135% in 2026 as homebuyer demand remains intact amid global macroeconomic headwinds.", "url": "https://international-residential.knightfrank.com.sg/singapore-residential-market-research-report-q4-2025/", "primeYield": null, "primeRent": null, "id": 228}, {"publishDate": "2026-01-22", "firm": "JLL", "title": "Hong Kong Monthly Market Dynamics \u2013 January 2026", "market": "Hong Kong", "sector": "Multi-sector", "summary": "Hong Kong's Grade A office leasing market recorded positive net absorption of 537,000 sq ft in December 2025, marking the ninth consecutive month of expansion\u2014a clear sign of gradual recovery. The overall office vacancy rate edged up to 14.1% at end-December, reflecting abundant available space in the broader market, while prime areas such as Central and Tsimshatsui continued to tighten. Overall office rents rose 0.4% month-on-month in December, with Central recording a 0.6% increase.", "url": "https://www.jll.com/en-hk/newsroom/grade-a-office-market-records-the-ninth-consecutive-month-of-positive-net-absorption", "primeYield": null, "primeRent": null, "id": 158}, {"publishDate": "2026-01-22", "firm": "Savills", "title": "Outlook 2026 \u2013 Asia-Pacific Office & Retail", "market": "APAC", "sector": "Multi-sector", "summary": "Savills Investment Management released its Asia-Pacific office and retail outlook for 2026, highlighting Tokyo's early expansion phase with Grade-A vacancy falling to approximately 1.4% in mid-2025. Corporate relocations and expansions drove record net absorption and rent increases across all grades. The report identified acquiring well-located but under-capitalised assets as a key strategy to benefit from the leasing recovery cycle.", "url": "https://savillsim.com/insights/outlook-2026-asia-pacific-office-retail/", "primeYield": null, "primeRent": null, "id": 192}, {"publishDate": "2026-01-20", "firm": "Knight Frank", "title": "Active Capital 2026", "market": "APAC", "sector": "Capital Markets", "summary": "Knight Frank's Active Capital Survey 2026 captures the views and investment intentions of 119 global real estate investors tracking US$144 billion of planned capital deployment. The survey finds that 87% of respondents by AUM plan to increase direct CRE investment in 2026, with offices re-emerging as the most targeted sector. In the Asia-Pacific region, Japan and Singapore stand out due to relatively low debt costs and structural demand drivers, with Australia also entering the top-ten destination list.", "url": "https://www.knightfrank.com/research/reports/active-capital", "primeYield": null, "primeRent": null, "id": 226}, {"publishDate": "2026-01-18", "firm": "CBRE", "title": "Australia Industrial and Logistics Figures Q4 2025", "market": "Australia", "sector": "Industrial & Logistics", "summary": "Australia's gross industrial take-up in 2025 exceeded 2024 by over 10%, with the supply pipeline reaching 15% above the 10-year average. The national average super prime grade midpoint yield compressed marginally to 5.66%, while close to 50% of the 2026 supply pipeline is pre-committed. Net effective rent growth remained negative as incentive levels continued to rise across most markets, with stabilisation forecast for 2026.", "url": "https://www.cbre.com.au/insights/figures/-australia-industrial-and-logistics-figures-q4-2025", "primeYield": "5.66%", "primeRent": null, "id": 127}, {"publishDate": "2026-01-18", "firm": "CBRE", "title": "Sydney Industrial and Logistics Figures Q4 2025", "market": "Australia", "sector": "Industrial & Logistics", "summary": "Sydney's industrial gross take-up declined significantly quarter-on-quarter to approximately 95,000 sqm in Q4 2025, with transport, postal and warehousing leading demand at 56% of floorspace leased. The average vacancy rate rose marginally to 2.9% and super prime face rents recorded 2.6% year-on-year growth. Super prime midpoint yields tightened slightly to 5.17%, with AUD 624 million in investment sales recorded across 15 transactions.", "url": "https://www.cbre.com.au/insights/figures/sydney-industrial-and-logistics-figures-q4-2025", "primeYield": "5.17%", "primeRent": null, "id": 128}, {"publishDate": "2026-01-18", "firm": "CBRE", "title": "Melbourne Industrial and Logistics Figures Q4 2025", "market": "Australia", "sector": "Industrial & Logistics", "summary": "Melbourne industrial gross take-up declined quarter-on-quarter to approximately 190,000 sqm in Q4 2025, with the average vacancy rate rising to 4.7%. Average net effective rents continued to decline, falling 0.7% over the quarter as incentives remained elevated. Investment sales totalled approximately AUD 339 million across 13 transactions valued at or above AUD 5 million, with yields holding stable across all grades and precincts.", "url": "https://www.cbre.com.au/insights/figures/melbourne-industrial-and-logistics-figures-q4-2025", "primeYield": null, "primeRent": null, "id": 146}, {"publishDate": "2026-01-18", "firm": "CBRE", "title": "Brisbane Industrial and Logistics Figures Q4 2025", "market": "Australia", "sector": "Industrial & Logistics", "summary": "Brisbane industrial gross take-up increased quarter-on-quarter in Q4 2025 to approximately 109,100 sqm, as occupiers sought functional and cost-effective solutions. Tight vacancy conditions continued to exert upward pressure on rents, with average net face rents increasing across all asset grades, and land values appreciating with 1.6ha lots rising approximately 5.9% quarter-on-quarter. Investment sale volumes totalled approximately AUD 336 million in Q4 2025, bringing the full-year 2025 total to AUD 2.8 billion\u2014almost double the long-run average.", "url": "https://www.cbre.com.au/insights/figures/brisbane-industrial-and-logistics-figures-q4-2025", "primeYield": null, "primeRent": null, "id": 147}, {"publishDate": "2026-01-15", "firm": "CBRE", "title": "2026 Korea Real Estate Market Outlook", "market": "Seoul", "sector": "Multi-sector", "summary": "CBRE Korea forecasts 2026 as an inflection point for the Korean real estate market, with interest rate cuts and cyclical recovery converging. GDP growth is forecast to re-enter the 2% range and vacancy rates across Seoul's Grade A office market are expected to remain below 5% despite new supply entering core CBD locations. Investment volumes are projected to moderate 5\u201315% from 2025's record KRW 33.8 trillion due to base effects, while logistics supply falls to its lowest level in a decade.", "url": "https://www.cbrekorea.com/insights/reports/2026-korea-real-estate-market-outlook", "primeYield": null, "primeRent": null, "id": 125}, {"publishDate": "2026-01-15", "firm": "Savills", "title": "APAC Investment Outlook 2026 \u2013 Modest Recovery After Flat 2025", "market": "APAC", "sector": "Capital Markets", "summary": "Savills projected Asia Pacific real estate investment to rise 7% in 2026 after remaining broadly flat in 2025, representing more modest growth compared to forecasts for the US and Europe. Australia was expected to lead with nearly 20% investment growth, followed by South Korea at approximately 10%. Mainland China continued to weigh on total regional volumes, while Japan remained a strong destination for both domestic and cross-border capital.", "url": "https://impacts.savills.com/market-trends/our-regional-real-estate-forecasts-for-2026.html", "primeYield": null, "primeRent": null, "id": 214}, {"publishDate": "2026-01-15", "firm": "Knight Frank", "title": "Singapore Prime Non-Landed & Landed Residential Update H2 2025", "market": "Singapore", "sector": "Residential", "summary": "Published in mid-January 2026, this bi-annual bulletin reports on the market performance of Singapore's prime non-landed and landed residential properties for the second half of 2025. The report examines how easing interest rates are supporting prime residential demand, and notes Singapore continues to set price records in the luxury segment while volume remains constrained by high stamp duty.", "url": "https://international-residential.knightfrank.com.sg/singapore-prime-non-landed-and-landed-residential-report-h2-2025/", "primeYield": null, "primeRent": null, "id": 229}, {"publishDate": "2026-01-15", "firm": "Knight Frank", "title": "Tokyo Office Market Outlook 2026", "market": "Tokyo", "sector": "Office", "summary": "Knight Frank identifies Tokyo as the region's tightest prime office market in 2026, with Grade-A vacancy in the five central wards tightening to near-zero levels. Tokyo office rents rose 22% YoY in Q1 2026, the fastest rental growth across the Asia-Pacific region. New supply for 2026 and beyond remains extremely scant and pre-leasing is well advanced on available buildings, while the cap rate hovers around 3.5% for core office transactions.", "url": "https://apac.knightfrank.com/horizon/content/asia-pacific-real-estate-2026-hunting-for-value-amid-volatility", "primeYield": "3.5%", "primeRent": null, "id": 271}, {"publishDate": "2026-01-15", "firm": "Knight Frank", "title": "Tokyo Prime Residential Performance \u2013 Leading Global Markets", "market": "Tokyo", "sector": "Residential", "summary": "Knight Frank's Prime Global Cities Index ranks Tokyo first among 46 global cities in prime residential price performance, with a 55.9% increase over the 12 months to Q3 2025. The outperformance is attributed to limited secondary market supply, strong foreign capital inflows and a persistent shortage of high-quality new developments. New condominium supply in 2026 is projected at approximately 23,000 units, the lowest level in more than 50 years, maintaining structural upward pressure.", "url": "https://www.knightfrank.co.uk/research/article/2025/12/tokyo-leads-the-pack-in-prime-residential-performance", "primeYield": null, "primeRent": null, "id": 272}, {"publishDate": "2026-01-15", "firm": "Knight Frank", "title": "Japan Capital Markets Outlook 2026", "market": "Tokyo", "sector": "Capital Markets", "summary": "Knight Frank highlights Japan as a core destination for global capital in 2026, driven by strong liquidity, low debt costs and strong inbound investor appetite following JPY 6.6 trillion in transaction volume in 2025. Q1 2026 volumes are 43% above the 10-year quarterly average. Japan accounts for over 80% of APAC living-sector volumes in Q1 2026, with new investors entering the multifamily market, while funding gaps in data centres are creating attractive private credit entry points.", "url": "https://apac.knightfrank.com/horizon/content/asia-pacific-real-estate-2026-hunting-for-value-amid-volatility", "primeYield": null, "primeRent": null, "id": 273}, {"publishDate": "2026-01-15", "firm": "Knight Frank", "title": "Tokyo Retail Market Outlook 2026", "market": "Tokyo", "sector": "Retail", "summary": "Knight Frank identifies Tokyo retail rents as rising at the fastest pace across the Asia-Pacific region in 2026, up approximately 8% YoY, driven by record inbound tourism and strong domestic consumption. Japan's high street retail market is experiencing near-zero vacancy in major corridors including Ginza, Omotesando and Shinjuku. Rising inbound tourism and the depreciated yen continue to support luxury retail leasing demand at prime high-street locations.", "url": "https://apac.knightfrank.com/horizon/content/asia-pacific-real-estate-2026-hunting-for-value-amid-volatility", "primeYield": null, "primeRent": null, "id": 275}, {"publishDate": "2026-01-15", "firm": "Knight Frank", "title": "Japan Industrial & Logistics Market Outlook 2026", "market": "Tokyo", "sector": "Industrial & Logistics", "summary": "Knight Frank highlights Tokyo's logistics sector as resilient in 2026, with strong demand and rent increases expected to offset rising interest rates as the market gradually sees more CPI-linked contracts. Renewal rates remain high amid tight availability of super-prime logistics space in Greater Tokyo, while solid domestic consumption and flight-to-quality continue to drive expansionary demand. Supply chain diversification trends are broadening logistics demand beyond the Greater Tokyo area to regional markets.", "url": "https://apac.knightfrank.com/horizon/content/asia-pacific-real-estate-2026-hunting-for-value-amid-volatility", "primeYield": null, "primeRent": null, "id": 276}, {"publishDate": "2026-01-15", "firm": "Knight Frank", "title": "Seoul Office Market Outlook 2026", "market": "Seoul", "sector": "Office", "summary": "Knight Frank identifies Seoul's Grade-A office market as supply-constrained, with the average vacancy rate across the three major business districts (CBD, Gangnam, Yeouido) at approximately 2.8% in Q1 2026. Tenants are adopting a wait-and-see stance ahead of large-scale new supply scheduled in the CBD in Q2 2026, including G1 Seoul and Re:nesquare. Rental growth is expected to persist as elevated development costs and rising asset values continue to widen the gap between prime and general Grade-A assets.", "url": "https://www.knightfrank.com/research/article/2025/8/how-asiapacific-is-defying-global-trends-in-the-prime-office-market", "primeYield": null, "primeRent": null, "id": 277}, {"publishDate": "2026-01-15", "firm": "Knight Frank", "title": "Seoul Capital Markets & Private Credit Outlook 2026", "market": "Seoul", "sector": "Capital Markets", "summary": "Knight Frank highlights South Korea as a two-way bridge for private credit capital, with domestic institutions allocating to global funds while foreign investors target approximately US$325 million in local real estate credit opportunities. Korea's commercial real estate market enters a mild correction phase in 2026 after a record 2025, but prime office assets remain the core of transaction activity. Data centres, hotels and alternative living sectors are broadening the investable universe for domestic and international capital.", "url": "https://apac.knightfrank.com/horizon/content", "primeYield": null, "primeRent": null, "id": 278}, {"publishDate": "2026-01-15", "firm": "Knight Frank", "title": "Seoul Industrial & Logistics Market Outlook 2026", "market": "Seoul", "sector": "Industrial & Logistics", "summary": "Knight Frank reports that the Greater Seoul logistics market is expected to see Grade-A supply fall to its lowest level in a decade in 2026, driving rapid vacancy stabilisation toward the low-10% range from approximately 17% in 2025. 3PL providers and e-commerce operators account for approximately 77% of total demand. Ambient-temperature logistics vacancy has already fallen below 10% and prime assets are experiencing rental growth and asset value differentiation.", "url": "https://apac.knightfrank.com/horizon/content", "primeYield": null, "primeRent": null, "id": 279}, {"publishDate": "2026-01-14", "firm": "Savills", "title": "Outlook 2026 \u2013 Asia-Pacific Living", "market": "APAC", "sector": "Residential", "summary": "Savills Investment Management released its Asia-Pacific living sector outlook for 2026, covering multifamily, build-to-rent, and student housing markets. The report highlighted Japan and Hong Kong as markets with rising net migration supporting rental growth, and noted that throttled housing supply and lower vacancies signalled strong potential for rental appreciation across the region.", "url": "https://savillsim.com/insights/outlook-2026-asia-pacific-living/", "primeYield": null, "primeRent": null, "id": 194}, {"publishDate": "2026-01-14", "firm": "Knight Frank", "title": "Hong Kong Property Market 2026 Forecasts", "market": "Hong Kong", "sector": "Multi-sector", "summary": "Knight Frank Hong Kong's annual press briefing and forecast report covers the office, retail, residential, and capital markets sectors. The firm forecasts overall residential transaction volume to increase to 65,000\u201368,000 units in 2026, with mass residential prices rising 5\u20138%. Grade-A office rents on Hong Kong Island are forecast to decline 0\u20135%, with premium Central expected to record positive growth of up to 8%. Prime street shop rents are projected to rise 5\u201310%, while Kowloon office rents are forecast to decline 4\u20136%.", "url": "https://www.knightfrank.com.hk/blog/2026/01/14/hong-kong-property-market-2026-forecasts", "primeYield": null, "primeRent": null, "id": 230}, {"publishDate": "2026-01-13", "firm": "CBRE", "title": "Hong Kong Major Report \u2013 Hong Kong Market Outlook 2026", "market": "Hong Kong", "sector": "Multi-sector", "summary": "CBRE's comprehensive Hong Kong market outlook for 2026 forecasts that further interest rate cuts and a strong IPO pipeline will enhance the wealth effect, boosting private consumption and corporate real estate demand. Office leasing momentum is expected to improve, led by financial services firms in the Central CBD and the emerging Tsim Sha Tsui West cluster, while retail leasing benefits from student and tourist inflows. Commercial real estate investment volume is forecast to rise by approximately 5%, supported by mainland Chinese corporates and living-sector demand.", "url": "https://www.cbre.com.hk/insights/reports/hong-kong-major-report-hong-kong-market-outlook-2026", "primeYield": null, "primeRent": null, "id": 126}, {"publishDate": "2026-01-09", "firm": "JLL", "title": "Multiscale Analysis of Japan's Rental Apartments Market", "market": "Tokyo", "sector": "Residential", "summary": "This research paper examines the factors driving investment concentration in the Greater Tokyo area, finding that Tokyo accounts for approximately 70% of total residential investment in Japan. The report identifies three key drivers: core investor criteria favouring Tokyo, high railway network density expanding suitable residential development areas, and rising university enrolment and urbanisation of employment. It notes a relative shortage of rental housing for low-income segments despite robust overall demand.", "url": "https://www.jll.com/en-jp/insights/multiscale-analysis-of-japan-s-rental-apartments-market", "primeYield": null, "primeRent": null, "id": 157}, {"publishDate": "2026-01-06", "firm": "CBRE", "title": "CBRE Hong Kong: Q4 2025 Market Review and 2026 Outlook Press Release", "market": "Hong Kong", "sector": "Multi-sector", "summary": "CBRE's year-end Hong Kong press release reports that commercial real estate investment surged 130% quarter-on-quarter to HK$20.3 billion in Q4 2025, driven by mainland Chinese corporates and educational institutions, bringing full-year volume to HK$44.5 billion. Grade A office vacancy reached 17.3% after a wave of new supply, while rents edged up 0.6% quarter-on-quarter in Q4 for the first time since Q2 2019, led by Central (+3.7%) and Tsim Sha Tsui (+1.7%). Looking ahead to 2026, CBRE forecasts a modest 5% increase in investment volume, improving office leasing momentum, and continued retail rental growth of 5\u20137% in leading high streets.", "url": "https://www.cbre.com.hk/press-releases/hong-kong-commercial-real-estate-market-outlook-2026", "primeYield": null, "primeRent": null, "id": 144}, {"publishDate": "2026-01-05", "firm": "JLL", "title": "2026 Global Data Center Market Outlook", "market": "APAC", "sector": "Data Centre", "summary": "JLL's annual data centre outlook forecasts global capacity to nearly double from 103 GW to 200 GW by 2030, with APAC expanding from 32 GW to 57 GW at a 12% CAGR. The report highlights a USD 3 trillion investment supercycle driven by AI demand, with colocation leading APAC growth at 19%. APAC lease rates are anticipated to increase at a 4% CAGR through 2030 as demand shifts from constrained markets to emerging hubs.", "url": "https://www.jll.com/en-us/insights/market-outlook/data-center-outlook", "primeYield": null, "primeRent": null, "id": 156}, {"publishDate": "2026-01-05", "firm": "JLL", "title": "2026 Global Data Center Outlook \u2013 APAC Highlights", "market": "APAC", "sector": "Data Centre", "summary": "JLL's comprehensive 2026 data centre outlook highlights APAC-specific findings, noting that APAC data centre capacity will expand from 32 GW to 57 GW by 2030 at a 12% CAGR, with colocation leading growth at 19%. The report emphasises that 97% global occupancy and 77% of the construction pipeline pre-committed to tenants demonstrate healthy sector fundamentals without signs of a bubble. APAC lease rates are projected to increase at a 4% CAGR through 2030 as demand shifts from constrained core markets to emerging hubs.", "url": "https://www.jll.com/content/dam/jllcom/en/global/documents/reports/research-reports/26-research-global-data-center-outlook-new.pdf", "primeYield": null, "primeRent": null, "id": 188}, {"publishDate": "2026-01-01", "firm": "Knight Frank", "title": "Asia-Pacific Real Estate Outlook 2026: Hunting for Value amid Volatility", "market": "APAC", "sector": "Multi-sector", "summary": "Knight Frank's annual Asia-Pacific Outlook report positions 2026 as a year for disciplined value hunting across the region. APAC GDP is forecast to ease from 4.5% in 2025 to 4.1% in 2026, but the region will still account for more than half of global expansion. Prime Grade-A offices command rent premiums of 15\u201320% over Grade-B space in core APAC cities, and commercial real estate investment volumes are expected to rise a further 5\u201310% in 2026, building on a 9% increase in the first nine months of 2025.", "url": "https://apac.knightfrank.com/knight-frank-asia-pacific-outlook-2026", "primeYield": null, "primeRent": null, "id": 227}, {"publishDate": "2026-01-01", "firm": "Knight Frank", "title": "Investment Yield Guide \u2013 January 2026 (Hong Kong)", "market": "Hong Kong", "sector": "Capital Markets", "summary": "Knight Frank's monthly Hong Kong Investment Yield Guide provides a monthly update on prime yields across all commercial sectors and current market sentiment. The January 2026 edition reflects the market conditions entering 2026, covering office, retail, industrial and residential prime yield benchmarks across Hong Kong's key sub-markets including Central, Kowloon and the New Territories.", "url": "https://www.knightfrank.com.hk/research/investment-yield-guide-january-2026-12629.aspx", "primeYield": null, "primeRent": null, "id": 231}, {"publishDate": "2026-01-01", "firm": "Knight Frank", "title": "Korea: South Korea Emerges as a Two-Way Bridge for Private Credit Capital", "market": "Seoul", "sector": "Capital Markets", "summary": "Part of Knight Frank's Asia-Pacific Horizon series, this article on South Korea examines how domestic institutions are allocating to global funds while foreign investors target approximately US$325 million in local private credit opportunities. Korea's real estate private credit market is identified as a compelling opportunity as traditional lenders approach exposure limits in high-conviction sectors such as data centres, creating attractive entry points for private credit and offshore capital.", "url": "https://apac.knightfrank.com/horizon/content", "primeYield": null, "primeRent": null, "id": 265}, {"publishDate": "2026-01-01", "firm": "Knight Frank", "title": "Australia's Private Credit Market Set for Sustained Growth", "market": "Australia", "sector": "Capital Markets", "summary": "Part of Knight Frank's Asia-Pacific Horizon series, this report examines Australia's growing market for private credit in real estate. Major Australian lenders have halved their commercial real estate exposure since 2009, creating a US$33\u201356 billion opportunity for alternative lenders. Australia is expected to capture nearly half of the forecast US$90\u2013110 billion expansion in Asia-Pacific real estate private credit by 2028.", "url": "https://apac.knightfrank.com/horizon/content", "primeYield": null, "primeRent": null, "id": 266}];
